AL</li><li>区分NNLM、RNNLM、Word2Vec与GloVe</li><li>牢记CBOW和Skip-gram方向</li><li>解释负采样</li><li>说明ELMo为何能处理一词多义</li></ul></div>\n  <div class=\"source-note\">内容依据：《第5讲 预训练词向量 2026》PPT，以及教材第2.1节、第5章、第6章</div>\n</section><details class=\"qa lesson-block\" open>\n      <summary><span class=\"qtag\">知识块1</span><span class=\"qtitle\">NLP为什么从规则走向预训练？</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"timeline\">\n<div><b>小规模专家系统</b><span>人工词典＋规则，可解释但覆盖有限。</span></div>\n<div><b>语料库统计模型</b><span>One-hot、词频等高维稀疏特征，需人工特征工程。</span></div>\n<div><b>深度学习模型</b><span>神经网络自动学习低维稠密表示，但依赖大量任务标注数据。</span></div>\n<div><b>大规模预训练模型</b><span>先用海量无标注文本自监督预训练，再用少量标注数据精调。</span></div>\n</div>\n<p><strong>预训练＋精调</strong>提高了未标注文本的利用效率，也让同一个模型能迁移到多种任务。</p></div>\n    </details><details class=\"qa lesson-block\" open>\n      <summary><span class=\"qtag\">知识块2</span><span class=\"qtitle\">什么是文本表示？</span></summary>\n      <div class=\"answer lesson-answer\"><p>计算机不能直接理解“土豆非常好吃”这串人类符号，必须先转为数字。<strong>文本表示</strong>就是把词、句子、段落或文档转换为向量。</p>\n<ul><li><strong>词语表示：</strong>给单个词一个向量，是本章核心；</li><li><strong>整文表示：</strong>把句子或文档变成向量，通常建立在词表示之上。</li></ul>\n<p>表示质量决定模型性能上限：若“土豆”和“马铃薯”的向量毫无关系，模型很难把在“土豆”上学到的知识迁移给“马铃薯”。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块3</span><span class=\"qtitle\">One-hot：给每个词一张数字身份证</span></summary>\n      <div class=\"answer lesson-answer\"><p>假设词表V={苹果,香蕉,汽车}：</p>\n<div class=\"formula\">苹果=[1,0,0]　香蕉=[0,1,0]　汽车=[0,0,1]</div>\n<p>优点是简单、唯一、易实现。缺点有三点：</p>\n<ol><li><strong>高维：</strong>词表十万，向量就十万维；</li><li><strong>稀疏：</strong>只有一位为1；</li><li><strong>无语义：</strong>任意两个不同词都正交，“苹果—香蕉”与“苹果—汽车”的距离没有本质区别。</li></ol>\n<p>所以One-hot只能告诉机器“这是不同编号”，不能告诉机器“哪些词意思相近”。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块4</span><span class=\"qtitle\">分布假说：一个词的意思由它经常和谁一起出现决定</span></summary>\n      <div class=\"answer lesson-answer\"><p>核心思想是“词如其伴”：如果两个词经常出现在相似上下文中，它们的语义也可能相似。</p>\n<p>例如“猫”和“狗”都常与“宠物、喂养、动物”共现，因此可以用上下文共现次数形成向量，再计算相似度。</p>\n<div class=\"table-wrap\"><table><thead><tr><th>词</th><th>宠物</th><th>动物</th><th>驾驶</th></tr></thead><tbody><tr><td>猫</td><td>12</td><td>8</td><td>0</td></tr><tr><td>狗</td><td>10</td><td>9</td><td>0</td></tr><tr><td>汽车</td><td>0</td><td>0</td><td>15</td></tr></tbody></table></div>\n<p>猫和狗的行向量相近，汽车与它们差异较大。但直接共现矩阵仍高维、稀疏，而且统计方法较简单。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块5</span><span class=\"qtitle\">LSA：用SVD从稀疏矩阵中发现潜在语义</span></summary>\n      <div class=\"answer lesson-answer\"><p>LSA先构造“词项—文档”或“词—上下文”矩阵C，再做奇异值分解：</p><div class=\"formula\">C = UΣV<sup>T</sup></div>\n<ul><li><strong>U：</strong>词项在潜在语义维度上的表示；</li><li><strong>Σ：</strong>奇异值，表示各潜在语义维度的重要性；</li><li><strong>V<sup>T</sup>：</strong>文档或上下文在潜在语义维度上的表示。</li></ul>\n<p>只保留最大的前k个奇异值，就是截断SVD，可以降维、去噪，并间接捕捉高阶共现关系。</p>\n<p><strong>直观理解：</strong>原矩阵有“计算机、电脑、足球、篮球”等表面词，SVD可能提炼出“科技、体育”等潜在维度。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块6</span><span class=\"qtitle\">HAL：滑动窗口＋距离加权＋词词共现矩阵</span></summary>\n      <div class=\"answer lesson-answer\"><p>HAL用固定窗口扫描语料。窗口中词离中心词越近，权重越大，再把权重累加到词—词共现矩阵。</p>\n<pre class=\"algo\">句子：猫 喜欢 吃 鱼\n窗口中心：吃\n距离1：喜欢、鱼 → 权重大\n距离2：猫 → 权重小</pre>\n<p>优点：完全自动，直接利用局部共现。缺点：矩阵维度高且稀疏，共现矩阵可能不对称，距离加权规则较简单，语义表达能力有限。</p>\n<div class=\"tip danger\"><strong>不要混淆</strong><div>LSA的核心是SVD降维；HAL的核心是滑动窗口和距离加权共现。</div></div></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块7</span><span class=\"qtitle\">词嵌入：低维、稠密、连续，而且可以通过任务训练</span></summary>\n      <div class=\"answer lesson-answer\"><p>词嵌入直接用低维稠密向量表示词，例如300维实数向量。向量不是人工指定，而是在自监督任务或目标任务训练中通过梯度下降学习。</p>\n<div class=\"compare\"><div><h4>分布表示</h4><p>先统计共现，再做PMI/SVD等变换，表示确定后不易随任务调整。</p></div><div><h4>词嵌入</h4><p>向量是模型参数，可随着损失函数优化自动更新。</p></div></div>\n<p>预训练词向量是在海量未标注文本上先学好词向量，再交给下游任务使用。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块8</span><span class=\"qtitle\">NNLM与RNNLM：词向量最初是语言模型的“副产品”</span></summary>\n      <div class=\"answer lesson-answer\"><h4>前馈神经网络语言模型（NNLM）</h4><p>用前n−1个词预测当前词，通过查找表取得词向量。训练语言模型时同时更新词向量矩阵。缺点是历史长度固定。</p>\n<h4>循环神经网络语言模型（RNNLM）</h4><p>用循环状态建模不定长历史，比NNLM能利用更长上下文。缺点是容易梯度消失/爆炸，而且普通单向语言模型只利用左侧历史。</p>\n<div class=\"flowline\"><span>历史词</span><b>→</b><span>词向量</span><b>→</b><span>神经网络</span><b>→</b><span>预测下一个词</span></div></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块9</span><span class=\"qtitle\">Word2Vec：CBOW与Skip-gram千万别记反</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"compare\">\n<div><h4>CBOW</h4><p><strong>周围预测中间</strong>。把上下文词向量平均或汇总，预测中心词。</p><div class=\"formula\">上下文 → 中心词</div></div>\n<div><h4>Skip-gram</h4><p><strong>中间预测周围</strong>。给定中心词，分别预测窗口中的上下文词。</p><div class=\"formula\">中心词 → 上下文</div></div>\n</div>\n<p>例句“我 喜欢 吃 苹果”，中心词是“吃”：CBOW用“我、喜欢、苹果”预测“吃”；Skip-gram用“吃”预测“喜欢、苹果”等周围词。</p>\n<p>Word2Vec训练快，可利用大规模语料，但它属于<strong>静态词向量</strong>：同一个词在所有句子中使用同一个向量。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块10</span><span class=\"qtitle\">为什么需要负采样？</span></summary>\n      <div class=\"answer lesson-answer\"><p>原始Softmax预测目标词时，要为词表中所有词计算分数并归一化。如果词表有十万词，每个样本都遍历十万词，代价很高。</p>\n<p>负采样把多分类改为二分类：</p>\n<ul><li>真实共现的“词—上下文”对是正样本，标签1；</li><li>随机换成少量不共现词，得到负样本，标签0。</li></ul>\n<p>训练只更新一个正样本和少量负样本对应参数，不再遍历整个词表。</p>\n<div class=\"formula\">复杂度：全词表计算 → 1个正样本＋K个负样本</div>\n<p>负采样不是把所有错误词都算一遍，而是<strong>随机抽少量</strong>。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块11</span><span class=\"qtitle\">GloVe：用全局共现统计回归学习词向量</span></summary>\n      <div class=\"answer lesson-answer\"><p>Word2Vec训练时主要利用当前局部窗口中的预测样本；GloVe先统计整个语料库的词—上下文共现矩阵，再让词向量的内积回归共现强度。</p>\n<div class=\"formula\">w<sub>i</sub><sup>T</sup> · w&#771;<sub>j</sub> + b<sub>i</sub> + b&#771;<sub>j</sub> ≈ log X<sub>ij</sub></div>\n<p>共现越频繁，模型应给出越大的关联分数；样本权重函数会降低极低频噪声和过高频样本的影响。</p>\n<p>GloVe融合全局统计和局部窗口信息，但仍然是一词一向量，不能解决一词多义。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块12</span><span class=\"qtitle\">词向量怎样评价？</span></summary>\n      <div class=\"answer lesson-answer\"><h4>内部评价</h4><ul><li><strong>词义相似度：</strong>比较模型余弦相似度与人工评分；</li><li><strong>词类比：</strong>king−man+woman≈queen。</li></ul>\n<h4>外部评价</h4><p>把词向量用于知识图谱补全、推荐系统、分类等任务，看是否提高真实任务效果。</p>\n<p>内部评价快但不一定代表下游任务表现；外部评价更实际，但成本更高。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块13</span><span class=\"qtitle\">动态词向量与ELMo：同一个词随上下文改变</span></summary>\n      <div class=\"answer lesson-answer\"><p>静态词向量假设一词一向量，因此“土豆很好吃”和“我在土豆上看视频”里的“土豆”表示相同，无法区分不同含义。</p>\n<p>ELMo使用两个LSTM分别训练前向语言模型和后向语言模型，结合整个句子的左右上下文生成每个词的表示。</p>\n<ul><li><strong>字符级输入：</strong>对未登录词更鲁棒；</li><li><strong>双向LSTM：</strong>同时利用前文与后文；</li><li><strong>多层加权：</strong>把字符/词层、第一层LSTM、第二层LSTM表示加权组合，不同任务可学不同权重。</li></ul>\n<div class=\"formula\">ELMo<sub>k</sub> = γ Σ<sub>j</sub> s<sub>j</sub> h<sub>k,j</sub></div>\n<p>较低层往往包含更多词法句法信息，较高层包含更多语义信息。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块14</span><span class=\"qtitle\">静态词向量与动态词向量完整对比</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"table-wrap\"><table><thead><tr><th>比较</th><th>静态词向量</th><th>动态词向量</th></tr></thead><tbody>\n<tr><td>表示方式</td><td>一词一个固定向量</td><td>根据当前上下文实时生成</td></tr>\n<tr><td>一词多义</td><td>不能有效处理</td><td>可在不同语境产生不同表示</td></tr>\n<tr><td>速度与资源</td><td>简单、快、资源少</td><td>模型复杂，训练推理开销大</td></tr>\n<tr><td>代表</td><td>Word2Vec、GloVe</td><td>ELMo、BERT、GPT上下文表示</td></tr>\n</tbody></table></div></div>\n    </details><div class=\"tip memory\"><strong>本章最后背一句</strong><div>One-hot给词编号，LSA和HAL统计上下文，Word2Vec利用局部窗口预测，GloVe利用全局共现统计，ELMo利用双向上下文动态生成词向量。</div></div>","6":"<section class=\"card hero-card lesson-hero\">\n  <div class=\"lesson-kicker\">零基础逐章讲解</div>\n  <h3>第6章 注意力与预训练语言模型：从RNN信息瓶颈走向Transformer、GPT和BERT</h3>\n  <p class=\"lead\">本章只按教材第4.4节“注意力模型”和第7章“预训练语言模型”讲解，不加入课后习题答案。先理解Attention，再理解Transformer，最后学习GPT/BERT怎样预训练并迁移到下游任务。</p>\n  <div class=\"goal-box\"><b>学完本章，你应该能做到：</b><ul><li>解释注意力为何出现</li><li>手写缩放点积注意力公式</li><li>理解自注意力、Q/K/V和多头机制</li><li>说出Transformer的组成与优缺点</li><li>区分GPT自回归和BERT自编码</li><li>解释MLM、NSP和下游精调</li></ul></div>\n  <div class=\"source-note\">内容依据：教材第4.4节（注意力模型）＋第7章（预训练语言模型）</div>\n</section><details class=\"qa lesson-block\" open>\n      <summary><span class=\"qtag\">知识块1</span><span class=\"qtitle\">为什么RNN编码器—解码器需要注意力？</span></summary>\n      <div class=\"answer lesson-answer\"><p>传统Seq2Seq把整个输入序列压缩到一个固定长度向量，再由解码器生成输出。句子很长时，一个向量很难保存所有细节，早期信息还会在递归传播中逐渐损失。</p>\n<p>注意力的核心改变是：生成每个目标词时，不只看一个固定向量，而是重新查看源序列所有位置，决定当前最该关注哪里。</p>\n<div class=\"flowline\"><span>计算当前查询</span><b>→</b><span>与各源位置打分</span><b>→</b><span>Softmax变权重</span><b>→</b><span>加权求和</span></div>\n<p>例如翻译到“apple”时，模型可把更高权重放在源句“苹果”位置，而不是平均记住整句。</p></div>\n    </details><details class=\"qa lesson-block\" open>\n      <summary><span class=\"qtag\">知识块2</span><span class=\"qtitle\">注意力机制四步：Query、Key、Value分别是什么？</span></summary>\n      <div class=\"answer lesson-answer\"><p>可以把注意力想成查资料：</p>\n<ul><li><strong>Query（Q）：</strong>我现在想找什么；</li><li><strong>Key（K）：</strong>每条资料的索引标签；</li><li><strong>Value（V）：</strong>资料真正的内容。</li></ul>\n<ol><li>用Q和每个K计算相关性分数；</li><li>对分数做Softmax，得到和为1的权重；</li><li>用权重乘对应V；</li><li>把所有加权V相加，得到上下文向量。</li></ol>\n<div class=\"formula\">Attention(Q,K,V)=softmax(QK<sup>T</sup>/√d<sub>k</sub>)V</div>\n<p>除以√d<sub>k</sub>是为了防止维度较大时点积过大，Softmax过于尖锐、梯度不稳定。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块3</span><span class=\"qtitle\">自注意力：序列内部每个词都去“看”其他词</span></summary>\n      <div class=\"answer lesson-answer\"><p>普通注意力可以发生在解码器状态与编码器状态之间；<strong>自注意力</strong>则让同一个序列中的词彼此计算关系。</p>\n<p>例句“动物没有过马路，因为它太累了”中，“它”的新表示可以重点关注“动物”，从而编码指代关系。</p>\n<p>对输入矩阵X做三次线性映射：</p><div class=\"formula\">Q=XW<sub>Q</sub>，K=XW<sub>K</sub>，V=XW<sub>V</sub></div>\n<p>每个位置都用自己的Q与所有位置的K打分，再对V加权。因此任意两个词只需一步即可建立联系，比RNN逐词传递更容易学习长距离依赖。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块4</span><span class=\"qtitle\">Transformer如何把自注意力变成完整模型？</span></summary>\n      <div class=\"answer lesson-answer\"><p>教材从几个问题说明Transformer的改进：</p>\n<ol><li><strong>融入位置信息：</strong>纯自注意力本身不懂词序，必须加入位置编码或位置向量。</li><li><strong>区分输入角色：</strong>同一输入通过不同矩阵变为Q/K/V。</li><li><strong>多头注意力：</strong>多组Q/K/V在不同子空间学习不同关系，再拼接。</li><li><strong>多层堆叠：</strong>逐层获得更高阶表示。</li><li><strong>位置前馈网络：</strong>对每个位置单独做非线性变换。</li><li><strong>残差连接＋层归一化：</strong>让深层网络更容易训练。</li></ol>\n<div class=\"formula\">MultiHead(Q,K,V)=Concat(head₁,…,headₕ)W<sup>O</sup></div></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块5</span><span class=\"qtitle\">Transformer编码器和解码器分别做什么？</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"compare\"><div><h4>编码器</h4><p>多头自注意力＋前馈网络，读取整个输入序列，生成每个位置的上下文表示。</p></div><div><h4>解码器</h4><p>掩码自注意力＋编码器—解码器注意力＋前馈网络，逐步生成输出。</p></div></div>\n<p><strong>因果掩码</strong>保证生成第t个词时只能看到前t−1个词，不能偷看未来答案。编码器通常可以双向读取全部输入，解码器自回归生成时必须遮住未来位置。</p>\n<div class=\"flowline\"><span>源句</span><b>→</b><span>Encoder表示</span><b>→</b><span>Decoder关注源句＋已生成词</span><b>→</b><span>下一个词</span></div></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块6</span><span class=\"qtitle\">Transformer相对RNN的优缺点</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"table-wrap\"><table><thead><tr><th>方面</th><th>Transformer</th><th>RNN</th></tr></thead><tbody>\n<tr><td>长距离依赖</td><td>任意位置直接连接</td><td>信息需逐步传递</td></tr>\n<tr><td>并行训练</td><td>编码阶段可并行</td><td>时间步存在顺序依赖</td></tr>\n<tr><td>位置信息</td><td>需额外位置编码</td><td>递归顺序天然包含位置</td></tr>\n<tr><td>长序列开销</td><td>标准注意力时间/空间约O(n²)</td><td>通常约O(n)，但难并行</td></tr>\n</tbody></table></div>\n<p>Transformer模型参数和计算量也较大，小数据直接训练往往困难，因此特别适合“大规模预训练＋下游精调”。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块7</span><span class=\"qtitle\">预训练语言模型为什么需要大数据、大模型、大算力？</span></summary>\n      <div class=\"answer lesson-answer\"><ul><li><strong>大数据：</strong>覆盖更多词义、句式、知识和领域；</li><li><strong>大模型：</strong>提供足够容量来表示复杂语言规律；</li><li><strong>大算力：</strong>让大数据和大模型能在可接受时间内训练。</li></ul>\n<p>文本自身就能提供自监督信号：根据前文预测下一个词，或遮住一个词让模型恢复。无需人工逐条标注，因此可以构造海量训练样本。</p>\n<div class=\"formula\">大规模无标注文本预训练 → 少量标注数据精调 → 下游任务</div></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块8</span><span class=\"qtitle\">GPT：自回归预训练＋有监督下游精调</span></summary>\n      <div class=\"answer lesson-answer\"><p>GPT使用Transformer的单向/因果结构，从左到右预测下一个词：</p><div class=\"formula\">P(x)=∏<sub>t</sub>P(x<sub>t</sub>|x<sub>&lt;t</sub>)</div>\n<p>训练分两阶段：</p>\n<ol><li><strong>无监督（更准确说自监督）预训练：</strong>在大规模文本上学习语言模型；</li><li><strong>有监督精调：</strong>对具体分类、蕴含、相似度、阅读理解任务加入输出层，用标注数据更新参数。</li></ol>\n<p>不同任务可以通过特殊分隔符和输入拼接改造成统一的序列输入。GPT擅长生成，但单向模型在表示某个词时不能直接使用其右侧上下文。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块9</span><span class=\"qtitle\">BERT整体结构与输入表示</span></summary>\n      <div class=\"answer lesson-answer\"><p>BERT采用多层Transformer<strong>编码器</strong>，每个位置能同时利用左右上下文，因此适合语言理解。</p>\n<p>输入向量由三部分相加：</p><div class=\"formula\">Input = Token Embedding + Segment Embedding + Position Embedding</div>\n<ul><li><strong>Token向量：</strong>词或子词本身；</li><li><strong>Segment向量：</strong>区分句子A和句子B；</li><li><strong>Position向量：</strong>表示位置顺序。</li></ul>\n<p>特殊标记：[CLS]放开头，常用于整句分类；[SEP]分隔句子或标记结束。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块10</span><span class=\"qtitle\">BERT两个基本预训练任务：MLM与NSP</span></summary>\n      <div class=\"answer lesson-answer\"><h4>MLM：掩码语言模型</h4><p>随机选择约15%的Token作为预测目标：其中80%替换为[MASK]，10%换成随机词，10%保持原词。模型利用左右上下文恢复原Token。</p>\n<p>这样处理是为了减少模型只依赖[MASK]标记的情况，并缓解预训练和下游精调时输入不一致。</p>\n<h4>NSP：下一个句子预测</h4><p>输入句子A和B，判断B是否真实紧接A。正样本是真实下一句，负样本是随机句子，使用[CLS]表示做二分类。</p>\n<p>教材还介绍整词掩码WWM和N-gram掩码：前者把一个完整词的所有子词一起遮住，后者连续遮住若干Token，使任务更难。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块11</span><span class=\"qtitle\">GPT与BERT到底怎样区分？</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"table-wrap\"><table><thead><tr><th>比较</th><th>GPT</th><th>BERT</th></tr></thead><tbody>\n<tr><td>模型类型</td><td>自回归语言模型</td><td>自编码式预训练模型</td></tr>\n<tr><td>上下文</td><td>左到右单向</td><td>左右双向</td></tr>\n<tr><td>核心任务</td><td>预测下一个词</td><td>MLM＋NSP</td></tr>\n<tr><td>结构倾向</td><td>Transformer解码式/因果掩码</td><td>Transformer编码器</td></tr>\n<tr><td>优势</td><td>自然语言生成</td><td>分类、标注、抽取等理解任务</td></tr>\n</tbody></table></div>\n<p>不要简单说“GPT只能生成、BERT只能理解”。这是结构和训练目标带来的<strong>主要倾向</strong>，不是绝对禁止。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块12</span><span class=\"qtitle\">BERT怎样适配下游任务？</span></summary>\n      <div class=\"answer lesson-answer\"><ul><li><strong>单句分类：</strong>取[CLS]表示接分类器，如情感分类。</li><li><strong>句对分类：</strong>[CLS] A [SEP] B [SEP]，判断蕴含、相似等关系。</li><li><strong>抽取式阅读理解：</strong>对每个Token预测答案起点和终点概率。</li><li><strong>序列标注：</strong>每个Token表示接标签分类器，可再接CRF。</li></ul>\n<p>两种使用方式：</p>\n<div class=\"compare\"><div><h4>特征提取</h4><p>冻结BERT参数，把隐含层表示当固定特征。训练快、资源少。</p></div><div><h4>模型精调</h4><p>BERT与任务层一起更新。通常效果更好，但开销更大。</p></div></div></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块13</span><span class=\"qtitle\">怎样理解BERT内部学到了什么？</span></summary>\n      <div class=\"answer lesson-answer\"><p>教材介绍两类分析方法：</p>\n<ul><li><strong>自注意力可视化：</strong>观察不同层、不同注意力头重点连接哪些词，部分头可能关注直接宾语、指代或分隔符。</li><li><strong>探针实验：</strong>冻结预训练表示，训练一个简单分类器检测其中是否包含词性、句法等信息。</li></ul>\n<p>注意力图能提供线索，但“注意力权重大”不等于完整因果解释；探针效果好也只说明表示中可提取相关信息。</p></div>\n    </details><div class=\"tip memory\"><strong>本章最后背一句</strong><div>长序列信息瓶颈引出Attention，同序列内部变Self-Attention；位置、QKV、多头、前馈、残差和归一化组成Transformer；GPT单向自回归生成，BERT用双向MLM学习理解表示。</div></div>","7":"<section class=\"card hero-card lesson-hero\">\n  <div class=\"lesson-kicker\">零基础逐章讲解</div>\n  <h3>第7章 信息检索：把查询和文档变成同一种数学表示，再计算相关度排序</h3>\n  <p class=\"lead\">PPT先用一个新闻检索实例讲完整流程，再讲布尔模型、VSM、语言模型、概率模型、LSI、评测和问答系统。公式题重点是TF-IDF、余弦相似度、Precision/Recall和MRR。</p>\n  <div class=\"goal-box\"><b>学完本章，你应该能做到：</b><ul><li>描述信息检索系统的一般框架</li><li>计算TF-IDF和余弦相似度</li><li>比较四种基本检索模型</li><li>解释LSI的SVD矩阵含义与优势</li><li>计算Precision、Recall、P@N和MRR</li><li>说明问答系统与普通检索的关系</li></ul></div>\n  <div class=\"source-note\">内容依据：《第7讲 信息检索 2026》PPT</div>\n</section><details class=\"qa lesson-block\" open>\n      <summary><span class=\"qtag\">知识块1</span><span class=\"qtitle\">一个信息检索系统从输入到输出做了什么？</span></summary>\n      <div class=\"answer lesson-answer\"><p>场景：文档库中有大量新闻，用户输入查询，系统要迅速找出相关文档并按相关程度排序。</p>\n<div class=\"flowline\"><span>文档库</span><b>→</b><span>文档标引</span><b>→</b><span>文档向量</span></div>\n<div class=\"flowline\"><span>用户查询</span><b>→</b><span>查询标引</span><b>→</b><span>查询向量</span></div>\n<div class=\"flowline\"><span>查询向量＋文档向量</span><b>→</b><span>相关度计算</span><b>→</b><span>降序排序</span><b>→</b><span>Top N</span></div>\n<p>“标引”就是把文档或查询转换为统一的数学表示，方便比较。</p></div>\n    </details><details class=\"qa lesson-block\" open>\n      <summary><span class=\"qtag\">知识块2</span><span class=\"qtitle\">信息检索的定义与三个核心环节</span></summary>\n      <div class=\"answer lesson-answer\"><p>信息检索（IR）是从大规模非结构化数据集合中找出满足用户信息需求的资料。形式化地说：给定文档库D和查询query，返回有序文档列表[d₁,d₂,…]。</p>\n<ol><li><strong>Indexing 标引：</strong>建立查询和文档的统一数学表示；</li><li><strong>Relevance Measuring 相关度评估：</strong>计算查询与候选文档的匹配程度；</li><li><strong>Relevance Sorting 排序：</strong>按相关度、重要性等排序输出。</li></ol>\n<p>好系统不仅要“找得到”，还要避免不相关结果、重要结果排太后和前排结果高度重复。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块3</span><span class=\"qtitle\">文本预处理与标引：为什么先分词、标词性、过滤虚词？</span></summary>\n      <div class=\"answer lesson-answer\"><p>中文文档先经过：</p><div class=\"flowline\"><span>中文分词</span><b>→</b><span>词性标注</span><b>→</b><span>虚词过滤</span><b>→</b><span>特征选择</span><b>→</b><span>权重计算</span></div>\n<p>虚词如“的、了、在”频率很高，但通常不能代表文档主题。PPT示例中可保留动词、名词、副词、形容词等内容词。</p>\n<p>特征选择可先按词项在文档库中的频率筛选。但不能只看频率：太常见的词区分能力低，因此还要使用TF-IDF确定权重。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块4</span><span class=\"qtitle\">TF-IDF：一个词在本文常见、在全库少见，才重要</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"formula\">TF-IDF(t,d)=TF(t,d)×IDF(t)</div>\n<div class=\"formula\">IDF(t)=log(N/df(t))</div>\n<ul><li><strong>TF：</strong>词t在当前文档d中出现多少；</li><li><strong>N：</strong>文档总数；</li><li><strong>df(t)：</strong>包含词t的文档数。</li></ul>\n<p><strong>例：</strong>N=1000，“Transformer”在文档A出现3次，只在10篇文档出现：</p><div class=\"formula\">TF-IDF = 3×log(1000/10)=3×log100</div>\n<p>“的”虽然在文档A出现20次，但几乎1000篇都有，IDF≈0，所以权重很低。</p>\n<div class=\"tip warn\"><strong>方向</strong><div>TF越大通常越重要；df越大，IDF越小；全库到处出现的词区分力低。</div></div></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块5</span><span class=\"qtitle\">向量空间模型VSM与余弦相似度</span></summary>\n      <div class=\"answer lesson-answer\"><p>VSM把每篇文档表示为索引项权重组成的向量：</p><div class=\"formula\">d=(w₁,w₂,…,wₙ)</div>\n<p>三个关键点：</p><ol><li>索引项选择；</li><li>索引项权重计算；</li><li>查询与文档相似度评价。</li></ol>\n<p>最常用余弦相似度：</p><div class=\"formula\">cos(q,d)=q·d/(||q||·||d||)</div>\n<p><strong>例：</strong>q=(1,1)，d₁=(2,2)，d₂=(1,0)。cos(q,d₁)=1；cos(q,d₂)=1/√2≈0.707，所以d₁排在前面。</p>\n<p>余弦主要比较方向而非长度，文档更长不一定天然更相似。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块6</span><span class=\"qtitle\">布尔模型：满足条件就返回，不满足就不返回</span></summary>\n      <div class=\"answer lesson-answer\"><p>文档表示为关键词集合，查询表示为AND、OR、NOT连接的布尔表达式。</p>\n<div class=\"formula\">病毒 AND（计算机 OR 电脑）AND NOT 医</div>\n<p>文档必须含“病毒”，还要含“计算机”或“电脑”，并且不能含“医”。</p>\n<p><strong>优点：</strong>逻辑简单、检索非常快、专业用户可写复杂条件。<br><strong>缺点：</strong>只做完全匹配，不支持自然的部分匹配；通常不考虑词频权重；命中的文档难以按相关性排序。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块7</span><span class=\"qtitle\">基于语言模型的检索：哪篇文档最可能“生成”查询？</span></summary>\n      <div class=\"answer lesson-answer\"><p>为每篇文档建立一个词概率分布，即文档语言模型。把查询看作从该模型中抽样生成的序列，计算：</p><div class=\"formula\">P(query|D)=∏<sub>i</sub>P(q<sub>i</sub>|D)</div>\n<p>生成查询概率越高，说明该文档的用词分布越接近查询，排名越靠前。</p>\n<p>实际必须使用平滑，否则查询中只要有一个词在文档中没出现，整个乘积就会变成0。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块8</span><span class=\"qtitle\">概率检索模型：文档与查询相关的概率有多大？</span></summary>\n      <div class=\"answer lesson-answer\"><p>设R表示“相关”，模型比较P(R|D,Q)与P(¬R|D,Q)，按相关概率或概率比排序。</p>\n<p>训练时统计每个关键词在相关文档与不相关文档中出现的情况。如果某词在相关文档中常出现、在不相关文档中很少出现，它对相关判断的权重就更大。</p>\n<p>经典简化通常假设关键词之间相互独立，实际语言中这一假设并不完全成立。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块9</span><span class=\"qtitle\">为什么VSM会被一词多义和一义多词影响？</span></summary>\n      <div class=\"answer lesson-answer\"><ul><li><strong>一词多义：</strong>查询“处理”会同时匹配“处理旧家具、处理叛徒、处理自然语言”，引入不相关结果。</li><li><strong>一义多词：</strong>查询“互联网”可能漏掉只写“万维网、因特网”的文档。</li></ul>\n<p>VSM默认不同词项彼此独立，无法自动理解同义词属于同一语义，也无法区分同一个词的不同义项。这正是LSI要缓解的问题。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块10</span><span class=\"qtitle\">LSI：把词项—文档矩阵投影到潜在语义空间</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"formula\">C = UΣV<sup>T</sup></div>\n<ul><li><strong>C：</strong>原始词项—文档矩阵；行是词项，列是文档。</li><li><strong>U：</strong>词项—语义矩阵；每行可看作词项表示。</li><li><strong>V<sup>T</sup>：</strong>语义—文档矩阵；每列可看作文档表示。</li><li><strong>Σ：</strong>奇异值对角矩阵；奇异值表示语义维度重要性。</li></ul>\n<p>将较小奇异值置0并只保留前k维，得到截断SVD。查询也映射到低维语义空间，再与文档计算余弦等相似度。</p>\n<h4>三项优势</h4>\n<ol><li>过滤次要语义维度，实现降维和降噪；</li><li>“计算机”和“电脑”可通过共同语义维度联系，缓解一义多词；</li><li>多义词分散在多个语义维度中，其干扰作用可能被削弱。</li></ol></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块11</span><span class=\"qtitle\">信息检索系统怎样评测？</span></summary>\n      <div class=\"answer lesson-answer\"><p>基本指标：</p><div class=\"formula\">Precision=检索到的相关文档数/检索文档总数</div><div class=\"formula\">Recall=检索到的相关文档数/库中相关文档总数</div>\n<p><strong>例：</strong>返回10篇，其中6篇相关；库中共15篇相关：P=6/10=0.6，R=6/15=0.4。</p>\n<ul><li><strong>Precision@N：</strong>前N个结果中相关文档比例，搜索引擎常看P@10、P@20；</li><li><strong>R-Precision：</strong>已知相关文档总数R，计算前R个结果的Precision；</li><li><strong>P-R曲线：</strong>在不同召回率下观察精确率。</li></ul>\n<p>通常召回率提高时，需要返回更多文档，精确率可能下降。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块12</span><span class=\"qtitle\">问答系统：从“返回文档”升级为“直接给答案”</span></summary>\n      <div class=\"answer lesson-answer\"><p>问答系统允许用户用自然语言提问，从语料库、互联网或知识库中检索、推理并总结答案。</p>\n<div class=\"flowline\"><span>自然语言问句</span><b>→</b><span>问句分析</span><b>→</b><span>查询/推理</span><b>→</b><span>答案抽取</span><b>→</b><span>答案</span></div>\n<p>常见类型：</p><ul><li>检索式问答；</li><li>知识库问答；</li><li>常问问题集FAQ问答；</li><li>阅读理解式问答。</li></ul>\n<p>QA评测可用Accuracy；如果系统返回多个候选答案，则常用MRR：</p><div class=\"formula\">MRR=(1/N)Σ 1/rank<sub>i</sub></div>\n<p>三个问题第一个正确答案排名为1、2、4：MRR=(1+1/2+1/4)/3≈0.583。</p></div>\n    </details><div class=\"tip memory\"><strong>本章最后背一句</strong><div>信息检索先把查询和文档标引成统一表示，再计算相关度并排序；VSM的三关键点是索引项、权重和相似度；TF-IDF衡量词重要性，LSI用SVD进入潜在语义空间。</div></div>"}};
const CATEGORIES = [{"id":"lessons","name":"零基础逐章讲解","desc":"按PPT与教材顺序，从零讲清第1—7章","icon":"学"},{"id":"homework","name":"课后习题答案","desc":"第1—5章与第7章标准答案","icon":"答"},{"id":"traps","name":"期末易错点","desc":"判断题、选择题与简答陷阱","icon":"错"},{"id":"routes","name":"总复习路线","desc":"每章一张结构化知识树","icon":"图"},{"id":"examples","name":"重点题目示例","desc":"分词、HMM、CYK、TF-IDF等","icon":"题"},{"id":"chapter6","name":"第6章专题","desc":"注意力＋预训练语言模型","icon":"6"},{"id":"all","name":"全课程速记","desc":"考前30分钟冲刺清单","icon":"总"}];
const CHAPTER_NAMES = {"1": "第1章 绪论", "2": "第2章 词法分析", "3": "第3章 句法分析", "4": "第4章 语义分析", "5": "第5章 预训练词向量", "6": "第6章 预训练语言模型", "7": "第7章 信息检索"};
const state = {category:null, chapter:null, search:""};

function stripHTML(s){const d=document.createElement("div");d.innerHTML=s;return (d.textContent||"").replace(/\s+/g," ").trim()}
function allowedChapters(cat){
  if(cat==="homework") return ["1","2","3","4","5","7"];
  if(cat==="chapter6") return ["6"];
  if(cat==="all") return [];
  return ["1","2","3","4","5","6","7"];
}
function saveState(){localStorage.setItem("nlpReviewState",JSON.stringify({category:state.category,chapter:state.chapter}))}
function loadState(){try{return JSON.parse(localStorage.getItem("nlpReviewState")||"{}")}catch(e){return {}}}
function setView(cat,chapter){
  state.search="";document.getElementById("searchInput").value="";
  state.category=cat;
  const list=allowedChapters(cat);
  state.chapter=chapter || list[0] || null;
  saveState();render();window.scrollTo({top:0,behavior:"smooth"});
}
function renderNav(){
  const cn=document.getElementById("categoryNav");
  cn.innerHTML=CATEGORIES.map(c=>`<button class="cat-btn ${state.category===c.id?"active":""}" data-cat="${c.id}"><span class="cat-icon">${c.icon}</span><span>${c.name}</span></button>`).join("");
  cn.querySelectorAll("button").forEach(b=>b.onclick=()=>setView(b.dataset.cat));
  const list=allowedChapters(state.category);
  const ch=document.getElementById("chapterNav");
  ch.innerHTML=list.length?list.map(n=>`<button class="chapter-btn ${state.chapter===n?"active":""}" data-ch="${n}"><span class="num">${n}</span><span>${CHAPTER_NAMES[n].replace(/^第\d章\s*/,"")}</span></button>`).join(""):`<div class="small" style="padding:8px">本模块为全课程汇总页</div>`;
  ch.querySelectorAll("button").forEach(b=>b.onclick=()=>{state.chapter=b.dataset.ch;saveState();render();window.scrollTo({top:0,behavior:"smooth"})});
}
function landing(){
  return `<div class="page-head"><h1>NLP期末复习网页</h1><p>先从“零基础逐章讲解”按顺序学习，再用课后习题、易错点、知识路线和算法例题进行巩固。</p></div>
  <div class="category-home">${CATEGORIES.map(c=>`<div class="cat-card" data-cat="${c.id}"><div class="big-icon">${c.icon}</div><h3>${c.name}</h3><p>${c.desc}</p></div>`).join("")}</div>
  <div class="chapter-home">${Object.entries(CHAPTER_NAMES).map(([n,name])=>`<div class="chapter-card" data-ch="${n}"><b>${name}</b></div>`).join("")}</div>`;
}
function getTitle(){
  const c=CATEGORIES.find(x=>x.id===state.category);
  if(state.category==="all") return [c.name,"全课程"];
  return [c?c.name:"",state.chapter?CHAPTER_NAMES[state.chapter]:""];
}
function pageContent(){
  if(!state.category) return landing();
  const [catName,chName]=getTitle();
  let body="";
  if(state.category==="all") body=DATA.all.all;
  else body=(DATA[state.category]||{})[state.chapter]||`<div class="empty">本章节在该模块下暂无内容。</div>`;
  return `<div class="breadcrumb"><span>首页</span><span>›</span><span>${catName}</span>${chName?`<span>›</span><span>${chName}</span>`:""}</div>
  <div class="page-head"><h1>${catName}${chName?" · "+chName:""}</h1><p>${state.category==="homework"?"点击题目可展开或收起标准答案。":state.category==="lessons"?"严格按课程内容顺序分块讲解；建议从知识块1开始依次展开。":"按考试优先级提炼，重点处附有例题和记忆口诀。"}</p></div>
  <div class="toolbar"><button id="expandAll">展开全部</button><button id="collapseAll">收起全部</button><button onclick="window.print()">打印当前页</button><button id="backHome">返回总目录</button></div>
  <div class="content">${body}</div>`;
}
function bindPage(){
  document.querySelectorAll(".cat-card").forEach(x=>x.onclick=()=>setView(x.dataset.cat));
  document.querySelectorAll(".chapter-card").forEach(x=>x.onclick=()=>setView("lessons",x.dataset.ch));
  const ex=document.getElementById("expandAll");if(ex)ex.onclick=()=>document.querySelectorAll("details.qa").forEach(d=>d.open=true);
  const co=document.getElementById("collapseAll");if(co)co.onclick=()=>document.querySelectorAll("details.qa").forEach(d=>d.open=false);
  const bh=document.getElementById("backHome");if(bh)bh.onclick=()=>{state.category=null;state.chapter=null;saveState();render()};
}
function searchAll(query){
  const q=query.trim().toLowerCase();
  if(!q){render();return}
  const results=[];
  for(const c of CATEGORIES){
    const group=DATA[c.id]||{};
    for(const [ch,content] of Object.entries(group)){
      const text=stripHTML(content);
      const idx=text.toLowerCase().indexOf(q);
      if(idx>=0){
        const start=Math.max(0,idx-45), end=Math.min(text.length,idx+q.length+85);
        let snippet=text.slice(start,end);
        const re=new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig");
        snippet=snippet.replace(re,m=>`<mark>${m}</mark>`);
        results.push({cat:c.id,catName:c.name,ch,chapter:CHAPTER_NAMES[ch]||"全课程",snippet});
      }
    }
  }
  document.getElementById("app").innerHTML=`<div class="page-head"><h1>搜索：${query.replace(/[<>]/g,"")}</h1><p>共找到 ${results.length} 个模块结果。点击结果跳转到对应章节。</p></div>
  <div class="search-results">${results.length?results.map((r,i)=>`<div class="result" data-i="${i}"><b>${r.catName} · ${r.chapter}</b><br><small>…${r.snippet}…</small></div>`).join(""):`<div class="empty">没有找到相关内容，可尝试“CYK”“负采样”“语义角色”“BERT”等关键词。</div>`}</div>`;
  document.querySelectorAll(".result").forEach(el=>el.onclick=()=>{const r=results[+el.dataset.i];setView(r.cat,r.ch==="all"?null:r.ch)});
}
function render(){
  renderNav();
  document.getElementById("app").innerHTML=pageContent();
  bindPage();
}
const saved=loadState();state.category=saved.category||null;state.chapter=saved.chapter||null;
if(state.category && !allowedChapters(state.category).includes(state.chapter) && state.category!=="all") state.chapter=allowedChapters(state.category)[0]||null;
render();

document.getElementById("brandHome").onclick=()=>{state.category=null;state.chapter=null;state.search="";document.getElementById("searchInput").value="";saveState();render()};
document.getElementById("searchInput").addEventListener("input",e=>searchAll(e.target.value));
document.getElementById("menuBtn").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
const themeBtn=document.getElementById("themeBtn");
const initTheme=localStorage.getItem("nlpTheme")||"light";document.documentElement.dataset.theme=initTheme;
themeBtn.onclick=()=>{const t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;localStorage.setItem("nlpTheme",t)};
</script>
</body>
</html>
