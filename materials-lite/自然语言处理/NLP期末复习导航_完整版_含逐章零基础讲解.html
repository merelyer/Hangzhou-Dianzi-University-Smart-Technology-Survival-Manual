<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NLP期末复习导航｜第1—7章完整版</title>
<style>
:root{
  --bg:#f4f6fb;--panel:#ffffff;--panel2:#f8faff;--text:#182033;--muted:#69738a;
  --primary:#315efb;--primary2:#6c4df6;--border:#dfe5f1;--shadow:0 10px 30px rgba(31,43,77,.08);
  --warn:#fff7df;--danger:#fff0f1;--memory:#eef8f1;--code:#172033;--codeText:#edf2ff;
  --header:rgba(255,255,255,.92)
}
[data-theme="dark"]{
  --bg:#10131b;--panel:#191e2a;--panel2:#151a24;--text:#eef2ff;--muted:#aab3c7;
  --primary:#7ea0ff;--primary2:#aa8cff;--border:#30394b;--shadow:0 10px 30px rgba(0,0,0,.25);
  --warn:#302817;--danger:#311c20;--memory:#183024;--code:#0d1118;--codeText:#e8efff;
  --header:rgba(16,19,27,.92)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.75}
button,input{font:inherit}
a{color:inherit}
header{position:sticky;top:0;z-index:50;background:var(--header);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.topbar{max-width:1500px;margin:auto;padding:12px 22px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:250px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;display:grid;place-items:center;font-weight:900;box-shadow:var(--shadow)}
.brand b{display:block;font-size:17px}.brand small{color:var(--muted)}
.search{flex:1;position:relative}
.search input{width:100%;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:11px 42px 11px 15px;border-radius:12px;outline:none}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}
.search span{position:absolute;right:14px;top:8px;color:var(--muted)}
.icon-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:11px;padding:9px 12px;cursor:pointer}
.layout{max-width:1500px;margin:auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;padding:22px}
.sidebar{position:sticky;top:88px;height:calc(100vh - 110px);overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.side-title{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.12em;margin:4px 8px 10px}
.cat-btn,.chapter-btn{width:100%;border:0;background:transparent;color:var(--text);text-align:left;border-radius:11px;padding:10px 11px;cursor:pointer;display:flex;gap:10px;align-items:center;margin:3px 0}
.cat-btn:hover,.chapter-btn:hover{background:var(--panel2)}
.cat-btn.active,.chapter-btn.active{background:color-mix(in srgb,var(--primary) 13%,var(--panel));color:var(--primary);font-weight:800}
.cat-icon{width:29px;height:29px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-weight:900}
.side-sep{height:1px;background:var(--border);margin:14px 4px}
.chapter-btn .num{width:28px;height:28px;border-radius:9px;border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:900}
main{min-width:0}
.breadcrumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:10px}
.page-head{background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 12%,var(--panel)),color-mix(in srgb,var(--primary2) 10%,var(--panel)));border:1px solid var(--border);border-radius:22px;padding:24px 27px;margin-bottom:18px;box-shadow:var(--shadow)}
.page-head h1{margin:0 0 6px;font-size:28px;line-height:1.25}.page-head p{margin:0;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.toolbar button{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:7px 12px;border-radius:9px;cursor:pointer}
.toolbar button:hover{border-color:var(--primary);color:var(--primary)}
.content{display:grid;gap:15px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:20px 22px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:20px}.card h4{margin:12px 0 7px}
.hero-card{border-left:5px solid var(--primary)}
.warn-card{border-left:5px solid #ffae36}
.route-card{border-left:5px solid var(--primary2)}
.lead{font-size:16px;color:var(--muted);margin:0}
.qa{background:var(--panel);border:1px solid var(--border);border-radius:17px;box-shadow:var(--shadow);overflow:hidden}
.qa summary{list-style:none;cursor:pointer;padding:17px 20px;display:flex;align-items:flex-start;gap:10px;font-weight:800}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"＋";margin-left:auto;color:var(--muted);font-size:20px;line-height:1}
.qa[open] summary::after{content:"－"}
.qa[open] summary{border-bottom:1px solid var(--border);background:var(--panel2)}
.qtag{font-size:12px;background:color-mix(in srgb,var(--primary) 13%,var(--panel));color:var(--primary);padding:2px 8px;border-radius:99px;white-space:nowrap}
.qtitle{line-height:1.5}
.answer{padding:18px 22px}.answer p:first-of-type{margin-top:0}.answer p:last-child{margin-bottom:0}
.answer-label{font-size:12px;color:var(--primary);font-weight:900;letter-spacing:.12em;margin-bottom:8px}
.tip{border-radius:14px;padding:14px 17px;border:1px solid var(--border);display:grid;grid-template-columns:max-content 1fr;gap:13px}
.tip strong{color:var(--text)}.tip.warn{background:var(--warn)}.tip.danger{background:var(--danger)}.tip.memory{background:var(--memory)}
.formula{font-family:"Cambria Math","Times New Roman",serif;background:var(--panel2);border:1px dashed var(--border);padding:10px 14px;border-radius:10px;text-align:center;font-size:18px;margin:12px 0;overflow:auto}
pre{white-space:pre-wrap}
.grammar,.algo,.tree,.route pre{background:var(--code);color:var(--codeText);padding:15px 17px;border-radius:12px;overflow:auto;line-height:1.6;margin:10px 0}
.route pre{font-family:"Microsoft YaHei","PingFang SC",monospace;font-size:15px}
.table-wrap{overflow:auto;margin:10px 0}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{border:1px solid var(--border);padding:10px 12px;text-align:left;vertical-align:top}
th{background:var(--panel2);white-space:nowrap}
.cyk td{text-align:center}.cyk td:first-child,.cyk th:first-child{font-weight:800;background:var(--panel2)}
.code-grid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px}
.code-grid span,.tag-row span,.role-row span{background:var(--panel2);border:1px solid var(--border);padding:8px 10px;border-radius:9px}
.tag-row,.role-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.compare,.tree-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare>div{border:1px solid var(--border);background:var(--panel2);padding:12px 14px;border-radius:12px}
.seg{font-weight:800;color:var(--primary);word-break:break-all}
.small,.source-note{font-size:13px;color:var(--muted)}
.flowline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}.flowline span{background:var(--panel2);border:1px solid var(--border);padding:5px 9px;border-radius:8px}
.mini-q{display:flex;justify-content:space-between;gap:15px;border-bottom:1px dashed var(--border);padding:10px 2px}.mini-q:last-child{border:0}.mini-q span{color:var(--primary);text-align:right}
.mega-route{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.mega-route>div:not(.arrow){background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}.mega-route span{font-size:12px;color:var(--muted)}.arrow{color:var(--primary);font-weight:900}
.template-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.template-grid>div{border:1px solid var(--border);background:var(--panel2);padding:12px;border-radius:11px;display:flex;flex-direction:column}.template-grid span{color:var(--muted);font-size:14px}
.category-home{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.cat-card{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:20px;cursor:pointer;box-shadow:var(--shadow);transition:.2s}
.cat-card:hover{transform:translateY(-3px);border-color:var(--primary)}
.cat-card .big-icon{width:45px;height:45px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;display:grid;place-items:center;font-weight:900;font-size:19px}
.cat-card h3{margin:12px 0 5px}.cat-card p{margin:0;color:var(--muted);font-size:14px}
.chapter-home{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:16px}
.chapter-card{border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:13px;cursor:pointer}
.chapter-card:hover{border-color:var(--primary);color:var(--primary)}
.search-results{display:grid;gap:10px}.result{border:1px solid var(--border);background:var(--panel);border-radius:13px;padding:13px;cursor:pointer}.result:hover{border-color:var(--primary)}.result small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:60px 20px;background:var(--panel);border:1px dashed var(--border);border-radius:17px}
mark{background:#ffe58f;color:#1b2230;border-radius:3px;padding:0 2px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:25px}
.lesson-kicker{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--panel));border-radius:99px;padding:3px 10px;margin-bottom:9px}
.lesson-hero .goal-box{margin-top:16px;background:var(--panel2);border:1px solid var(--border);border-radius:13px;padding:13px 16px}
.goal-box ul{margin:7px 0 0;padding-left:22px;columns:2;column-gap:30px}.goal-box li{break-inside:avoid;margin:3px 0}
.lesson-answer h4{color:var(--primary);margin-top:15px}.lesson-answer>ul,.lesson-answer>ol{padding-left:23px}
.layer-stack{display:flex;flex-direction:column;gap:8px;margin:12px 0}.layer-stack>div{display:grid;grid-template-columns:125px 1fr;gap:12px;align-items:start;background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:11px 13px}.layer-stack b{color:var(--primary)}
.timeline{display:grid;gap:9px;margin:12px 0}.timeline>div{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:13px;border-left:4px solid var(--primary2);background:var(--panel2);border-radius:10px;padding:11px 14px}.timeline span{color:var(--muted)}
.lesson-block summary{position:relative}.lesson-block[open]{border-color:color-mix(in srgb,var(--primary) 32%,var(--border))}
.lesson-block .qtag{min-width:62px;text-align:center}
@media(max-width:680px){.goal-box ul{columns:1}.layer-stack>div,.timeline>div{grid-template-columns:1fr}}
@media(max-width:1000px){
 .layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:none}.sidebar.open{display:block}
 .brand{min-width:unset}.brand small{display:none}.category-home{grid-template-columns:repeat(2,1fr)}
 .chapter-home{grid-template-columns:repeat(3,1fr)}.mobile-menu{display:block!important}
}
@media(min-width:1001px){.mobile-menu{display:none!important}}
@media(max-width:680px){
 .topbar{padding:9px 12px}.brand b{font-size:14px}.logo{width:36px;height:36px}.search{order:3;flex-basis:100%}.topbar{flex-wrap:wrap}
 .layout{padding:12px}.page-head{padding:18px}.page-head h1{font-size:23px}.card,.answer{padding:16px}
 .category-home{grid-template-columns:1fr}.chapter-home{grid-template-columns:repeat(2,1fr)}
 .compare,.tree-grid,.template-grid{grid-template-columns:1fr}.code-grid{grid-template-columns:repeat(2,1fr)}
 .tip{grid-template-columns:1fr}.mini-q{flex-direction:column}.mini-q span{text-align:left}
}
@media print{
 header,.sidebar,.toolbar,footer{display:none!important}.layout{display:block;padding:0}.page-head,.card,.qa{box-shadow:none;break-inside:avoid}.qa:not([open]) .answer{display:block}.qa:not([open]) summary{border-bottom:1px solid var(--border)}body{background:white;color:black}
}
</style>

<header>
  <div class="topbar">
    <button class="icon-btn mobile-menu" id="menuBtn">☰</button>
    <div class="brand" id="brandHome" role="button" tabindex="0">
      <div class="logo">NLP</div><div><b>期末复习导航</b><small>第1—7章 · 零基础讲解＋习题＋冲刺</small></div>
    </div>
    <div class="search"><input id="searchInput" placeholder="搜索：CYK、Viterbi、BERT、TF-IDF……"><span>⌕</span></div>
    <button class="icon-btn" id="themeBtn" title="切换深浅色">◐</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-title">复习模块</div>

    <div class="side-title">章节切换</div>
    <div id="chapterNav"></div>
  </aside>
  <main>
    <div id="app"></div>
    <footer>依据课程第1—5、7讲PPT及教材第4.4节、第7章整理 · 含逐章零基础讲解、习题答案、易错点与例题 · 单文件离线网页</footer>
  </main>
</div>

<script>
const DATA = {"homework":{"1":"<section class=\"card hero-card\"><h3>本章课后作业：4道简答题</h3><p class=\"lead\">答题模板：先下定义，再写层次或特点，最后补一个PPT中的例子。每题建议写成一段完整文字。</p></section><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">1. 什么是自然语言处理？自然语言处理与人工智能的关系如何理解？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>自然语言处理（NLP）是一门旨在让计算机模拟人类，对自然语言进行理解、转换和生成的技术。其处理对象是自然产生并不断发展变化的人类语言。</p>\n       <p>自然语言处理属于人工智能的重要分支。人工智能研究如何使机器表现出智能；机器学习研究如何从数据中获得知识；自然语言处理则重点模拟人的认知过程，解决对语言符号及其所承载知识的理解与利用问题。自然语言处理通常可以概括为<strong>自然语言理解＋自然语言生成</strong>。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">2. NLP的研究内容可以划分为哪些层次？各层次有哪些具体内容？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>自然语言处理的研究内容可以分为三个层次：</p>\n       <ol><li><strong>基础研究：</strong>语言模型、语料库建设、语言知识库建设、字符集与编码体系等。</li>\n       <li><strong>应用基础研究：</strong>词法分析、句法分析、语义分析、篇章分析等。</li>\n       <li><strong>应用层研究：</strong>机器翻译、信息检索、自动文摘、问答系统、文档分类、信息抽取、对话系统等。</li></ol>\n       <p>三者关系是：基础资源和模型为词法、句法、语义等分析任务提供支撑；这些基础分析结果又服务于上层应用系统。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">3. 自然语言处理的主要困难是什么？请举例说明。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>课程PPT将主要困难概括为<strong>歧义</strong>和<strong>未知语言现象</strong>。</p>\n       <p><strong>歧义</strong>是指同一语言形式存在多种解释，包括分词歧义、短语结构歧义、词义歧义和语用歧义。例如“自动化研究所取得的成就”既可切分为“自动化／研究所／取得／的／成就”，也可切分为“自动化／研究／所／取得／的／成就”；“喜欢乡下的孩子”也可能有两种不同的短语结构。</p>\n       <p><strong>未知语言现象</strong>是指规则库或训练数据中没有覆盖的新词、新义和新句式。例如“网红、内卷、YYDS”等新词，以及“卷、很丧”等旧词的新用法。自然语言不断演化，任何有限规则都难以完全覆盖。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">4. NLP的基本研究方法分为哪几类？各自有什么特点？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>自然语言处理的基本方法分为<strong>理性主义方法</strong>和<strong>经验主义方法</strong>。</p>\n       <p>理性主义方法依赖语言学专家总结规则，并利用逻辑推理处理语言。其优点是可解释性强、过程清楚；缺点是规则编写工作量大、主观性强、覆盖范围有限，面对复杂或新出现的语言现象时泛化能力较弱。</p>\n       <p>经验主义方法通过观察大量真实语料，利用统计学习或神经网络归纳语言规律。其优点是能从数据中自动学习、覆盖面广、适合复杂任务；缺点是依赖数据和算力，模型内部机理往往不易解释。</p></div>\n    </details><div class=\"tip memory\"><strong>背诵压缩版</strong><div>NLP是让计算机理解和生成自然语言的人工智能技术；内容分基础研究、应用基础研究和应用层；困难是歧义与未知语言现象；方法分规则驱动的理性主义和数据驱动的经验主义。</div></div>","2":"<section class=\"card hero-card\"><h3>本章课后作业：4道简答＋1道分词题</h3><p class=\"lead\">本章最容易出“定义＋模型框架＋手算”。HMM要把观察序列、状态序列和三个参数说清楚。</p></section><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">1. 简述基于字分类法的汉语分词原理。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>字分类法把汉语分词转换为一个<strong>字序列标注问题</strong>。从句首到句尾依次为每个汉字预测其在词中的位置，常用标签为：</p>\n       <div class=\"tag-row\"><span>B：词首</span><span>M：词中</span><span>E：词尾</span><span>S：单字词</span></div>\n       <p>分类器根据当前字及其前后字、字的类别等上下文特征预测标签，常用模型有HMM和CRF。完成全部字符的标签预测后，按照B-M-E或S等合法标签组合恢复词边界，即得到分词结果。</p>\n       <p>例如“乒乓球拍完了”可标为“乒/B 乓/M 球/E 拍/S 完/S 了/S”，最终切分为“乒乓球／拍／完／了”。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">2. 简述命名实体识别的概念。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>命名实体识别（NER）是识别文本中对实体的<strong>命名性指称</strong>，并确定其类型的任务，常见类型包括人名、地名、机构名、时间名等。</p>\n       <p>例如在“中国乒乓球男队总教练刘国梁出席会议，他指出……”中，“刘国梁”是命名性指称；“中国乒乓球男队总教练”是名词性指称；“他”是代词性指称。命名实体识别重点识别“刘国梁”这一类专有名称。</p>\n       <p>主要方法包括基于规则、基于统计序列标注和基于深度学习的方法。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">3. 列举北大词性标注集的26个基本词性代码。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><div class=\"code-grid\">\n       <span>n 名词</span><span>t 时间词</span><span>s 处所词</span><span>f 方位词</span>\n       <span>m 数词</span><span>q 量词</span><span>b 区别词</span><span>r 代词</span>\n       <span>v 动词</span><span>a 形容词</span><span>z 状态词</span><span>d 副词</span>\n       <span>p 介词</span><span>c 连词</span><span>u 助词</span><span>y 语气词</span>\n       <span>e 叹词</span><span>o 拟声词</span><span>i 成语</span><span>l 习用语</span>\n       <span>j 简称</span><span>h 前接成分</span><span>k 后接成分</span><span>g 语素</span>\n       <span>x 非语素字</span><span>w 标点符号</span></div>\n       <p class=\"small\">北大标注集包含26个基本词类代码、74个扩充代码，共106个代码。考试通常只要求基本代码。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">4. 简述如何利用HMM建立词性标注器。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>利用HMM建立词性标注器时，把<strong>单词序列</strong>看作观察序列，把<strong>词性标记序列</strong>看作隐藏状态序列。模型记为 μ=(A,B,π)：</p>\n       <ul><li>π：初始概率，表示一个句子以各词性开始的概率；</li>\n       <li>A：状态转移概率，表示前一个词性转移到后一个词性的概率；</li>\n       <li>B：发射概率，表示某个词性生成某个具体词的概率。</li></ul>\n       <p>训练阶段利用大规模“分词＋词性”标注语料，通过最大似然估计统计π、A、B。使用阶段给定待标注单词序列，利用<strong>Viterbi算法</strong>寻找概率最大的词性状态序列，作为最终标注结果。</p>\n       <div class=\"formula\">δ<sub>t</sub>(j)=max<sub>i</sub>[δ<sub>t−1</sub>(i)·a<sub>ij</sub>]·b<sub>j</sub>(o<sub>t</sub>)</div></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">计算题</span><span class=\"qtitle\">5. 分别用正向最大匹配和反向最大匹配进行分词。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p><strong>词典：</strong>自动化研究所、自动化、研究所、自动、研究、取得、成就、非常、常人、能干、干到</p>\n       <p><strong>句子：</strong>自动化研究所取得的成就非常人能干到</p>\n       <div class=\"compare\"><div><h4>正向最大匹配</h4><p class=\"seg\">自动化研究所／取得／的／成就／非常／人／能干／到</p><p>从左向右，每次选择当前起点能够匹配的最长词。</p></div>\n       <div><h4>反向最大匹配</h4><p class=\"seg\">自动化研究所／取得／的／成就／非／常人／能／干到</p><p>从右向左，每次选择当前终点能够匹配的最长词。</p></div></div>\n       <p>两种结果不同，说明最大匹配法只追求局部最长匹配，无法利用全句语义保证全局最优。</p></div>\n    </details><div class=\"tip memory\"><strong>本章最重要一句</strong><div>分词、命名实体识别和词性标注都可以转化为序列标注；HMM中“词是观察，词性是状态”，训练统计π/A/B，解码用Viterbi。</div></div>","3":"<section class=\"card hero-card\"><h3>本章课后作业：3道简答＋1道CYK大题</h3><p class=\"lead\">句法分析的大题核心是：先乔姆斯基范式化，再按跨度填CYK表，最后沿回溯指针画出所有句法树。</p></section><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">1. 比较句法结构分析、浅层句法分析和依存句法分析。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><div class=\"table-wrap\"><table><thead><tr><th>类型</th><th>目标</th><th>输出</th><th>特点</th></tr></thead><tbody>\n       <tr><td>句法结构分析<br>（完全句法分析）</td><td>判断句子是否符合语法规则，并确定完整层次结构</td><td>短语结构句法树</td><td>关注整句的完整递归结构，常基于CFG/PCFG</td></tr>\n       <tr><td>浅层句法分析</td><td>识别局部、非递归的基本语块</td><td>Base NP、VG、PP、DP等语块序列</td><td>不分析远距离关系，不构建完整句法树</td></tr>\n       <tr><td>依存句法分析</td><td>确定词与词之间的支配—被支配关系</td><td>依存树或带标签有向图</td><td>以词为节点，突出谓词中心，边表示SBV、VOB等关系</td></tr>\n       </tbody></table></div></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">2. 解释S、VP、NP、PP；SBV、VOB、ATT、DE。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p><strong>短语结构符号：</strong>S表示句子；VP表示动词短语；NP表示名词短语；PP表示介词短语。</p>\n       <p><strong>依存关系符号：</strong>SBV表示主谓关系（主语—谓词）；VOB表示动宾关系（谓词—宾语）；ATT表示定中关系（修饰语—中心词）；DE表示“的”字结构关系。</p>\n       <p>前四个是句法树中的节点类别，后四个是依存树中边的关系标签，不要混为一类。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">3. 简述PCFG模型特点，以及采用PCFG进行句法分析的优势。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>概率上下文无关文法（PCFG）是在CFG每条产生式规则上增加概率参数的文法模型。具有相同左部的规则概率之和通常为1，规则及其概率可以从带句法树标注的训练语料中自动抽取和估计。</p>\n       <p>一棵句法树的概率通常等于树中所使用各条规则概率的乘积。</p><div class=\"formula\">P(T)=∏<sub>r∈T</sub>P(r)</div><p>与人工CFG相比，PCFG的优势是：降低人工编写规则的工作量和主观性；从真实数据学习的规则更符合语言实际；能够为多个合法句法结构赋予不同概率，从中选择概率最大的最优句法树；可配合CYK/Viterbi动态规划提高搜索效率。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">算法大题</span><span class=\"qtitle\">4. 用CYK分析“咬 死 了 猎人 的 狗”，并给出多种句法树。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><h4>第一步：乔姆斯基范式化</h4>\n       <p>原文法中有三元规则S→VP Aux NP、NP→NP Aux NP。引入新非终结符X：</p>\n       <pre class=\"grammar\">S  → VC NP | VP X\nVC → v a | VC utl\nVP → VC NP\nNP → n | NP X | NP NP\nX  → Aux NP\nv→咬　a→死　utl→了　n→猎人|狗　Aux→的</pre>\n       <h4>第二步：填写CYK表</h4>\n       <div class=\"table-wrap\"><table class=\"cyk\"><thead><tr><th>跨度</th><th>1 咬</th><th>2 死</th><th>3 了</th><th>4 猎人</th><th>5 的</th><th>6 狗</th></tr></thead><tbody>\n       <tr><td>1</td><td>v</td><td>a</td><td>utl</td><td>n, NP</td><td>Aux</td><td>n, NP</td></tr>\n       <tr><td>2</td><td>VC<br><small>[1,2]</small></td><td>—</td><td>—</td><td>—</td><td>X<br><small>[5,6]</small></td><td></td></tr>\n       <tr><td>3</td><td>VC<br><small>[1,3]</small></td><td>—</td><td>—</td><td>NP<br><small>[4,6]</small></td><td></td><td></td></tr>\n       <tr><td>4</td><td>S, VP<br><small>[1,4]</small></td><td>—</td><td>—</td><td></td><td></td><td></td></tr>\n       <tr><td>5</td><td>—</td><td>—</td><td></td><td></td><td></td><td></td></tr>\n       <tr><td>6</td><td><strong>S（两条回溯路径）</strong><br><small>[1,6]</small></td><td></td><td></td><td></td><td></td><td></td></tr>\n       </tbody></table></div>\n       <p>关键组合：VC[1,2]=v+a；VC[1,3]=VC+utl；X[5,6]=Aux+NP；NP[4,6]=NP+X；VP[1,4]=VC+NP。</p>\n       <h4>第三步：回溯得到两棵树</h4>\n       <div class=\"tree-grid\">\n       <pre class=\"tree\">结构一：S → VC NP\nS\n├─VC\n│ ├─VC → v(咬) a(死)\n│ └─utl(了)\n└─NP\n  ├─NP → n(猎人)\n  └─X\n    ├─Aux(的)\n    └─NP → n(狗)</pre>\n       <pre class=\"tree\">结构二：S → VP X\nS\n├─VP\n│ ├─VC\n│ │ ├─VC → v(咬) a(死)\n│ │ └─utl(了)\n│ └─NP → n(猎人)\n└─X\n  ├─Aux(的)\n  └─NP → n(狗)</pre></div>\n       <p>顶格[1,6]中虽然都写作S，但必须保存两套分裂点和产生式，才能回溯出两种结构。</p></div>\n    </details><div class=\"tip memory\"><strong>CYK得分点</strong><div>写出CNF化规则；初始化词性；按跨度从短到长填表；每个格枚举所有分裂点；顶格出现S说明句子可被文法接受；保存分叉点才能画多棵树。</div></div>","4":"<section class=\"card hero-card\"><h3>本章课后作业：4道简答题</h3><p class=\"lead\">语义分析考试通常考“概念、分类、方法对比”。答题时要明确分析对象和使用的信息来源。</p></section><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">1. 什么是词义消歧？主要方法分为哪几类？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>词义消歧（WSD）是确定一个多义词在给定上下文中的具体含义。例如“bank”在“by the bank of the river”中表示河岸，在“deposit money in the bank”中表示银行。</p>\n       <p>课程中主要分为三类方法：</p>\n       <ol><li><strong>基于规则的方法：</strong>人工总结词语搭配和语义限制规则进行判断；</li>\n       <li><strong>基于有监督学习的方法：</strong>利用标注语料训练分类器，代表方法有互信息、贝叶斯分类器和最大熵模型；</li>\n       <li><strong>基于词典的方法：</strong>利用词典中的释义、义类或双语翻译信息进行消歧。</li></ol></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">2. 基于词典的词义消歧有哪几种类型？分别简述原理。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><ol><li><strong>基于词典释义的方法：</strong>比较待消歧词各义项的词典释义，与上下文词及其释义的重叠程度，重叠越大越可能是正确义项。</li>\n       <li><strong>基于义类词典的方法：</strong>先获得各义项所属语义类，再根据上下文中其他词的语义类及共现规律选择最匹配的义项。例如crane的“鹤”属于ANIMAL，“起重机”属于MACHINE。</li>\n       <li><strong>基于双语词典的方法：</strong>把多义词的不同译文及上下文翻译到另一种语言，在大规模语料库中比较译文与上下文词的共现频次，以共现更强的译文对应义项作为结果。</li></ol></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">3. 什么是语义角色标注？常用语义角色有哪些？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>语义角色标注（SRL）以句子的<strong>谓词</strong>为中心，识别句子中哪些成分是该谓词的论元，并用语义角色描述这些成分与谓词之间的关系，因此也称谓词—论元结构分析。</p>\n       <p>常用角色包括：施事者（动作发出者）、受事者（动作承受者）、体验者、工具、材料、结果、原因、时间、地点、方式、来源和目标等。英文PropBank中常用ARG0、ARG1等核心论元以及ARGM-TMP、ARGM-LOC、ARGM-MNR等附加论元表示。</p>\n       <p>例如“他们昨天在北京讨论了方案”中，“讨论”是谓词，“他们”是施事者，“方案”是受事或主题，“昨天”是时间，“在北京”是地点。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">4. 比较基于短语结构树和基于依存关系树的语义角色标注。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><div class=\"table-wrap\"><table><thead><tr><th>比较项</th><th>基于短语结构树</th><th>基于依存关系树</th></tr></thead><tbody>\n       <tr><td>标注对象</td><td>短语或句法树节点</td><td>词语或依存树节点</td></tr>\n       <tr><td>主要特征来源</td><td>短语类型、路径、位置、支配关系等短语树特征</td><td>依存关系、父子节点、谓词到候选词路径等依存树特征</td></tr>\n       <tr><td>候选论元生成</td><td>从句法树中选择与谓词相关的短语节点</td><td>从谓词开始向根回溯，并收集当前节点的子节点作为候选论元</td></tr>\n       <tr><td>粒度</td><td>短语级</td><td>词级</td></tr></tbody></table></div>\n       <p>两类方法的共同流程通常都是：谓词识别 → 候选论元生成 → 论元识别 → 论元分类。</p></div>\n    </details><div class=\"tip memory\"><strong>本章最重要一句</strong><div>词义消歧回答“这个词在这里是什么意思”；语义角色标注回答“谁对谁做了什么，以及何时、何地、用什么方式做”。</div></div>","5":"<section class=\"card hero-card\"><h3>本章必须背住的4道简答题</h3><p class=\"lead\">以下答案按“发展过程／核心差异／为什么”组织，可直接用于期末简答题。</p></section><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">1. 简述NLP技术的发展过程。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>自然语言处理技术主要经历了四个阶段。</p>\n       <p>第一阶段是<strong>小规模专家系统</strong>，主要依赖人工编写语言规则和词典，具有较强的可解释性，但规则覆盖范围有限，难以处理复杂语言现象。</p>\n       <p>第二阶段是<strong>语料库统计模型</strong>，主要利用One-hot、词频等高维稀疏特征，通过统计机器学习模型完成任务，但需要人工设计特征，语义表示能力有限。</p>\n       <p>第三阶段是<strong>深度学习模型</strong>，使用神经网络自动学习低维稠密的文本表示，减少人工特征工程，但通常依赖大量任务标注数据。</p>\n       <p>第四阶段是<strong>大规模预训练模型</strong>，先利用大量无标注文本进行预训练，再使用少量标注数据针对具体任务进行精调，提高数据利用效率和模型迁移能力。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">2. 简述词表示模型的发展过程。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>词表示模型首先采用<strong>One-hot离散表示</strong>，为每个词分配一个高维稀疏向量，但无法表达词语之间的语义关系。</p>\n       <p>之后出现<strong>LSA、HAL</strong>等分布表示方法，根据词的上下文分布或共现信息表示词义，但仍存在高维稀疏、语义表达能力有限等问题。</p>\n       <p>随后出现<strong>NNLM、RNNLM、Word2Vec和GloVe</strong>等静态词向量模型，通过神经网络或全局共现统计学习低维稠密词向量，但一个词始终只有一个固定向量，无法处理一词多义。</p>\n       <p>最后出现<strong>ELMo、BERT、GPT</strong>等动态词向量或预训练语言模型，根据上下文为同一个词生成不同表示，从而更准确地表达具体语境中的词义。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">3. 静态词向量与动态词向量有什么区别？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p><strong>静态词向量</strong>为每个词分配固定且唯一的向量，同一个词在不同上下文中的表示完全相同。优点是模型简单、训练和推理速度快、资源消耗较少；缺点是无法处理一词多义，缺乏上下文感知能力。代表模型有Word2Vec和GloVe。</p>\n       <p><strong>动态词向量</strong>根据词语所处的上下文实时生成向量，同一个词在不同语境中可以获得不同表示。优点是能够处理一词多义，更准确地表达上下文语义；缺点是模型结构复杂，训练和推理开销较大。代表模型有ELMo、BERT和GPT。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">4. Word2Vec为什么需要负采样？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>Word2Vec使用Softmax预测目标词时，需要计算词表中所有词的概率并进行归一化。当词表规模很大时，每个训练样本都需要遍历整个词表，计算开销非常高。</p>\n       <p>负采样把原来的多分类问题转化为“词—上下文对”的二分类问题：真实共现词对作为正样本，再随机抽取少量不共现词对作为负样本。训练时只计算一个正样本和少量负样本，不需要遍历整个词表，因此显著降低计算复杂度并加快训练。</p></div>\n    </details><div class=\"tip memory\"><strong>最后背这一句话</strong><div>One-hot给词编号，LSA和HAL统计上下文，Word2Vec利用局部窗口预测，GloVe利用全局共现统计，ELMo利用双向上下文动态生成词向量。</div></div>","7":"<section class=\"card hero-card\"><h3>本章课后作业：4道简答题</h3><p class=\"lead\">本章要抓住一条主线：文档和查询怎样表示 → 怎样计算相关度 → 怎样排序和评价。</p></section><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">1. VSM信息检索框架的三个关键点是什么？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><ol><li><strong>索引项选择：</strong>确定文档中哪些词、短语或语义概念能够代表文档内容，可选择高频词、领域词，并可将同义词归并。</li>\n       <li><strong>权重计算：</strong>确定每个索引项在某篇文档中的重要程度，常用TF-IDF。</li>\n       <li><strong>相似度评价：</strong>计算查询向量与文档向量之间的相关程度，常用余弦相似度，也可使用内积或广义Jaccard系数。</li></ol>\n       <p>计算相似度后，按相关度从高到低排序，返回Top N文档。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">2. LSI相对于基本VSM有哪些优势？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>LSI先对“词项—文档”矩阵进行SVD分解，并在潜在语义空间中表示文档和查询。相对于基本VSM，主要优势有：</p>\n       <ol><li>可以舍弃较小奇异值对应的次要语义维度，实现降维和去噪；</li>\n       <li>引入潜在语义层后，能够把“计算机—电脑”这类一义多词联系起来，减少漏检；</li>\n       <li>多义词往往同时分散在多个语义维度中，其区分作用会被自动降低，从而减少误检；</li>\n       <li>低维稠密表示可在一定程度上缓解VSM的高维稀疏和索引项独立假设问题。</li></ol></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">3. 解释LSI中的C、U、Σ、Vᵀ四个矩阵。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>LSI使用奇异值分解：</p><div class=\"formula\">C = UΣV<sup>T</sup></div><ul><li><strong>C：</strong>原始“词项—文档”矩阵，行对应词项，列对应文档；</li>\n       <li><strong>U：</strong>词项表征矩阵，每行可看作一个词项在潜在语义空间中的表示，每列可解释为一个语义维度；</li>\n       <li><strong>Σ：</strong>奇异值对角矩阵，奇异值从大到小排列，反映各潜在语义维度的重要程度；</li>\n       <li><strong>Vᵀ：</strong>文档标引矩阵，每列对应一篇文档在潜在语义空间中的表示。</li></ul>\n       <p>只保留前k个最大奇异值及对应行列，就是截断SVD，可实现低秩近似、降维和去噪。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">4. 什么是问答系统？当前有哪几种实现类型？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>问答系统是一种允许用户用自然语言提问，系统从大量异构数据中查找、推理或生成用户问题答案的新型信息检索系统。与传统信息检索返回文档列表不同，问答系统希望返回准确、直接的答案。</p>\n       <p>课程中分为四类：</p>\n       <ol><li>基于大规模真实文本语料库的问答系统；</li>\n       <li>基于Web的问答系统；</li>\n       <li>基于知识库的问答系统，可进行结构化查询和知识推理；</li>\n       <li>基于语言模型的理解式问答系统，可学习问题—答案材料、阅读网络资料并生成答案。</li></ol></div>\n    </details><div class=\"tip memory\"><strong>本章最重要一句</strong><div>VSM在词项空间中算相似度，LSI用SVD转到潜在语义空间，QA则进一步从“返回文档”走向“返回直接答案”。</div></div>"},"traps":{"1":"<section class=\"card warn-card\"><h3>第1章期末易错点</h3><ul><li><strong>NLP不等于自然语言理解。</strong>NLP通常包含自然语言理解和自然语言生成。</li><li><strong>自然语言与人工语言不要混淆。</strong>自然语言自然产生、不断演化、形式灵活；SQL、Python等人工语言为特定目的设计，规则更明确。</li><li><strong>研究内容的三个层次不要串。</strong>语言模型/语料库属于基础研究；词法/句法/语义属于应用基础；翻译/检索/问答属于应用层。</li><li><strong>歧义不只是词义歧义。</strong>还包括分词、短语结构和语用歧义。</li><li><strong>理性主义不是“有理性的人做的方法”。</strong>它指专家规则＋逻辑推理；经验主义指从大量实例中归纳。</li><li><strong>形式正确不代表语义合理。</strong>“亚里士多德吃了一个地球”可以语法正确，但语义常识不合理。</li></ul></section><div class=\"tip danger\"><strong>判断题陷阱</strong><div>“自然语言处理只研究语言学规律”错误；它更偏技术与应用。计算语言学更偏用计算方法研究语言学问题。</div></div>","2":"<section class=\"card warn-card\"><h3>第2章期末易错点</h3><ul><li><strong>交集型歧义：</strong>AJ、JB都是词，如“乒乓球拍卖完了”；<strong>组合型歧义：</strong>A、B、AB都是词，如“马上”。</li><li><strong>最大匹配法不能识别未登录词。</strong>词典没有覆盖时通常退化为单字。</li><li><strong>正向/反向最大匹配都只是局部贪心。</strong>结果不同不代表其中一定有一个正确。</li><li><strong>字分类法是序列标注。</strong>B/M/E/S表示字在词中的位置，不是词性。</li><li><strong>NER识别命名性指称。</strong>“刘国梁”是命名实体，“总教练”是普通名词性指称，“他”是代词性指称。</li><li><strong>词性是上下文中的语法属性。</strong>不能只查词典；兼类词必须结合句子。</li><li><strong>HMM中观察是词，状态是词性。</strong>不要反写。</li><li><strong>Viterbi解决解码问题。</strong>它寻找最优状态序列，不是用来估计HMM参数的。</li></ul></section><div class=\"tip memory\"><strong>最易考的三参数</strong><div>π是句首词性概率；A是词性到词性的转移概率；B是词性生成单词的发射概率。</div></div>","3":"<section class=\"card warn-card\"><h3>第3章期末易错点</h3><ul><li><strong>句法分析只做形式层面。</strong>它判断结构和依存关系，不保证句子符合常识。</li><li><strong>CFG与PCFG区别：</strong>PCFG给规则加概率并可选最优树；CFG只能判断是否能生成及列出结构。</li><li><strong>CYK要求乔姆斯基范式。</strong>通常只有A→BC或A→a；三元规则必须引入新非终结符。</li><li><strong>填表方向不是死规定。</strong>真正规定是先有短跨度结果，再计算长跨度；格内必须枚举所有分裂点。</li><li><strong>普通CYK应保留所有合法回溯。</strong>PCFG/Viterbi-CYK才会对同一非终结符保留概率最大的路径。</li><li><strong>顶格出现S只表示可被文法接受。</strong>完整句法树必须继续回溯产生式和分裂点。</li><li><strong>浅层句法不是“不完整的错误分析”。</strong>它主动只识别Base NP、VG、PP等局部非递归语块。</li><li><strong>短语节点符号与依存关系标签不要混淆。</strong>NP/VP是节点类别，SBV/VOB是边标签。</li></ul></section><div class=\"tip memory\"><strong>CYK检查顺序</strong><div>词性初始化 → 二元组合 → 跨度逐渐增大 → 枚举分裂点 → 顶格S → 回溯树。</div></div>","4":"<section class=\"card warn-card\"><h3>第4章期末易错点</h3><ul><li><strong>词义消歧与词性标注不同。</strong>前者选语义，后者选语法类别。</li><li><strong>邻近词更适合判断词性，远距离实词常更有助于判断词义。</strong></li><li><strong>基于互信息的消歧在本章属于有监督方法。</strong>因为指示器由人工标注语料归纳。</li><li><strong>最大熵不是“熵越大越混乱”。</strong>它是在满足已知约束的前提下选择最中立、额外假设最少的分布。</li><li><strong>词典释义法与义类词典法不同。</strong>前者比较释义重叠，后者比较语义类及共现规律。</li><li><strong>SRL以谓词为中心。</strong>不是给句子中的所有词随意贴语义标签。</li><li><strong>语义角色不等于句法成分。</strong>主语经常是施事，但被动句主语可能是受事。</li><li><strong>短语树SRL标短语，依存树SRL标词。</strong>特征来源和候选论元生成方式不同。</li></ul></section>","5":"<section class=\"card warn-card\"><h3>第5章期末易错点</h3><ul><li><strong>CBOW：周围预测中间；Skip-gram：中间预测周围。</strong></li><li><strong>Word2Vec是静态词向量。</strong>同一个词在任何句子中查到的基础向量相同。</li><li><strong>GloVe也是静态词向量。</strong>利用全局共现信息并不等于能解决一词多义。</li><li><strong>ELMo不是简单查表。</strong>它根据整个句子的双向上下文，通过双向LSTM动态生成表示。</li><li><strong>LSA使用SVD：</strong>C=UΣVᵀ。</li><li><strong>负采样不是计算所有错误词。</strong>只随机抽取少量负例。</li><li><strong>One-hot不能体现语义距离。</strong>“苹果—香蕉”和“苹果—汽车”的正交关系相同。</li><li><strong>分布表示与分布式表示不要混。</strong>HAL/LSA主要由共现统计得到；词嵌入是可学习、低维稠密参数。</li><li><strong>NNLM历史长度固定；RNNLM历史可变。</strong>但RNNLM仍受梯度问题和单向历史限制。</li></ul></section><div class=\"tip memory\"><strong>一秒辨析</strong><div>局部预测看Word2Vec；全局共现回归看GloVe；双向LSTM上下文看ELMo。</div></div>","6":"<section class=\"card warn-card\"><h3>第6章期末易错点</h3><ul><li><strong>注意力与自注意力不同。</strong>编码器—解码器注意力通常用目标端状态查询源端状态；自注意力在同一序列内部计算元素间关系。</li><li><strong>Softmax后的注意力权重和为1。</strong>分数大不等于直接作为权重。</li><li><strong>Q、K、V不是三个单词。</strong>它们是同一输入经过不同线性映射后承担的查询、键、值角色。</li><li><strong>自注意力本身没有顺序概念。</strong>必须加入位置嵌入或位置编码。</li><li><strong>多头不等于多层。</strong>多头是在同一层并行关注不同关系；多层是堆叠Transformer块学习高阶关系。</li><li><strong>Transformer块不仅有注意力。</strong>还有前馈网络、残差连接和层归一化。</li><li><strong>GPT是单向自回归；BERT是双向自编码。</strong>GPT从左到右预测下一个词，BERT通过掩码恢复词。</li><li><strong>BERT掩码规则：</strong>选15%的Token，其中80%换[MASK]、10%换随机词、10%保持原词。</li><li><strong>[CLS]用于整体分类，[SEP]用于分隔文本块。</strong>输入表示=词向量＋块向量＋位置向量。</li><li><strong>特征提取不更新BERT；精调会更新BERT参数。</strong></li><li><strong>抽取式阅读理解不是直接生成整段答案。</strong>它预测篇章中的起始和终止位置。</li></ul></section>","7":"<section class=\"card warn-card\"><h3>第7章期末易错点</h3><ul><li><strong>布尔模型是二值匹配。</strong>满足条件就返回，不满足就不返回，本质上没有相关度排序。</li><li><strong>VSM支持部分匹配并能排序。</strong>它把查询和文档都表示为向量。</li><li><strong>TF高不一定权重大。</strong>如果一个词在所有文档中都常见，IDF很小。</li><li><strong>余弦相似度看方向，不看绝对长度。</strong>向量夹角越小，相似度越高。</li><li><strong>LSI与LSA数学核心相同，场景不同。</strong>都用SVD；用于信息检索时常称潜在语义索引。</li><li><strong>C的行是词项、列是文档。</strong>U对应词项，Vᵀ对应文档，Σ对应语义维度重要性。</li><li><strong>截断SVD不是随意删除矩阵。</strong>保留最大的奇异值及其对应向量。</li><li><strong>Precision与Recall不要记反。</strong>Precision看返回的有多少正确，Recall看所有相关的找回多少。</li><li><strong>IR返回相关文档列表；QA希望返回直接答案。</strong></li><li><strong>MRR看第一个正确答案的排名倒数。</strong>正确答案排第1得1，排第2得1/2。</li></ul></section>"},"routes":{"1":"<section class=\"card route-card\"><h3>第1章一张总复习路线</h3>\n<div class=\"route\">\n<pre>NLP绪论\n│\n├─ 自然语言\n│  ├─ 自然产生、不断演化\n│  ├─ 形式灵活、规则难完全覆盖\n│  └─ 对比人工语言：规则明确、语义单一\n│\n├─ NLP定义\n│  ├─ 让计算机智能处理自然语言\n│  ├─ 理解 + 转换 + 生成\n│  └─ NLP = NLU + NLG\n│\n├─ 研究内容\n│  ├─ 基础：语言模型、语料库、知识库、编码\n│  ├─ 应用基础：词法、句法、语义、篇章\n│  └─ 应用：翻译、检索、摘要、问答、抽取、对话\n│\n├─ 主要困难\n│  ├─ 歧义：分词/短语/词义/语用\n│  └─ 未知：新词/新义/新句式\n│\n└─ 研究方法与历史\n   ├─ 理性主义：规则 + 逻辑\n   ├─ 经验主义：数据 + 归纳\n   └─ 专家系统 → 统计学习 → 深度学习 → 预训练</pre></div>\n</section><div class=\"tip memory\"><strong>最后背一句</strong><div>NLP是人工智能中处理语言认知问题的分支，其研究从规则驱动发展到数据驱动，并始终受到歧义和语言不断演化的挑战。</div></div>","2":"<section class=\"card route-card\"><h3>第2章一张总复习路线</h3>\n<div class=\"route\"><pre>词法分析（词一级处理）\n│\n├─ 汉语自动分词\n│  ├─ 困难：规范不统一 / 切分歧义 / 未登录词\n│  ├─ 词典法\n│  │  ├─ 最大匹配：局部最长\n│  │  └─ 最短路径：词数最少\n│  ├─ 概率法：选句子概率最大的切分\n│  └─ 字分类法：B/M/E/S序列标注\n│\n├─ 命名实体识别\n│  ├─ 人名 / 地名 / 机构名 / 时间名\n│  ├─ 规则法\n│  ├─ 统计序列标注：PNB/PNI/OUT或BIO\n│  └─ 深度学习：Embedding → RNN/LSTM/BERT → 标签\n│\n└─ 词性标注\n   ├─ 困难：无形态变化 / 兼类 / 标准不统一\n   ├─ 规则法与转换规则学习\n   └─ HMM\n      ├─ 观察：词\n      ├─ 状态：词性\n      ├─ 参数：π、A、B\n      └─ 解码：Viterbi</pre></div>\n</section><div class=\"tip memory\"><strong>最后背一句</strong><div>分词找词边界，NER找专有名称，POS找语法属性；三者都能转成序列标注。</div></div>","3":"<section class=\"card route-card\"><h3>第3章一张总复习路线</h3>\n<div class=\"route\"><pre>句法分析（句子形式结构）\n│\n├─ 完全句法结构分析\n│  ├─ CFG：人工规则，无概率\n│  ├─ CYK：CNF + 动态规划 + 回溯\n│  └─ PCFG：规则带概率\n│     └─ PCFG-CYK / Viterbi：保留最优结构\n│\n├─ 浅层句法分析\n│  ├─ 只看局部非递归语块\n│  ├─ Base NP / VG / PP / DP\n│  └─ 常转为序列标注\n│\n└─ 依存句法分析\n   ├─ 词为节点、依存关系为边\n   ├─ 动词/谓词中心\n   ├─ 转移法：快、局部贪心\n   ├─ 图方法：全局最优、较慢\n   └─ 序列标注法：简单快速</pre></div>\n</section><div class=\"tip memory\"><strong>CYK口诀</strong><div>先短后长，格格切分；规则能合就填，分叉全部留存；顶格见S，回溯成树。</div></div>","4":"<section class=\"card route-card\"><h3>第4章一张总复习路线</h3>\n<div class=\"route\"><pre>语义分析\n│\n├─ 词语层：词义消歧 WSD\n│  ├─ 定义：上下文中选择具体义项\n│  ├─ 规则法：搭配与语义限制\n│  ├─ 有监督：互信息 / 贝叶斯 / 最大熵\n│  └─ 词典法\n│     ├─ 释义重叠\n│     ├─ 义类共现\n│     └─ 双语译文共现\n│\n└─ 句子层：语义角色标注 SRL\n   ├─ 中心：谓词\n   ├─ 输出：谓词—论元结构\n   ├─ 角色：施事/受事/时间/地点/方式/工具...\n   ├─ 基于短语结构树：短语级\n   ├─ 基于依存树：词级\n   └─ 基于浅层语块：语块级</pre></div>\n</section><div class=\"tip memory\"><strong>最后背一句</strong><div>WSD确定词在语境中的义项，SRL确定句子成分与谓词之间的语义关系。</div></div>","5":"<section class=\"card route-card\"><h3>第5章一张总复习路线</h3>\n<div class=\"route\"><pre>词表示\n│\n├─ 离散表示\n│  └─ One-hot：高维、稀疏、无语义关系\n│\n├─ 分布表示\n│  ├─ 核心：词义由上下文决定\n│  ├─ LSA：SVD降维，发现潜在语义\n│  └─ HAL：滑动窗口 + 距离加权 + 共现矩阵\n│\n├─ 预训练静态词向量\n│  ├─ NNLM：固定历史预测当前词\n│  ├─ RNNLM：不定长历史，但有梯度问题\n│  ├─ Word2Vec\n│  │  ├─ CBOW：周围预测中间\n│  │  ├─ Skip-gram：中间预测周围\n│  │  └─ 负采样：避免遍历整个词表\n│  └─ GloVe：全局共现矩阵 + 回归学习\n│\n└─ 预训练动态词向量\n   └─ ELMo\n      ├─ 字符级输入\n      ├─ 前向LSTM + 后向LSTM\n      ├─ 多层表示加权\n      └─ 上下文决定具体词义</pre></div>\n</section><div class=\"tip memory\"><strong>最后背一句</strong><div>One-hot编号，LSA/HAL统计，Word2Vec局部预测，GloVe全局共现，ELMo双向上下文动态表示。</div></div>","6":"<section class=\"card route-card\"><h3>第6章一张总复习路线</h3>\n<div class=\"route\"><pre>预训练语言模型\n│\n├─ Seq2Seq瓶颈\n│  └─ 一个固定向量难保存长序列全部信息\n│\n├─ Attention\n│  ├─ 目标端状态查询源端各状态\n│  ├─ 分数 → Softmax权重\n│  └─ 加权求和得到上下文向量\n│\n├─ Self-Attention\n│  ├─ 同一序列内部建模任意两位置\n│  └─ 长距离关系可直接连接\n│\n├─ Transformer\n│  ├─ 位置编码：补顺序\n│  ├─ Q/K/V：角色分离\n│  ├─ Multi-head：同时关注多种关系\n│  ├─ FFN：引入非线性\n│  ├─ Residual + LayerNorm：易训练\n│  └─ 多层堆叠：高阶语义组合\n│\n├─ 预训练三要素：大数据 + 大模型 + 大算力\n│\n├─ GPT\n│  ├─ 单向自回归Transformer\n│  ├─ 左到右预测下一个词\n│  └─ 生成式预训练 + 下游精调\n│\n└─ BERT\n   ├─ 双向Transformer编码器\n   ├─ 输入：Token + Segment + Position\n   ├─ MLM：掩码恢复\n   ├─ NSP：句间关系\n   └─ 应用：分类 / 句对 / 阅读理解 / 序列标注</pre></div>\n</section><div class=\"tip memory\"><strong>最后背一句</strong><div>Attention选择性读取信息，Transformer用Q/K/V、多头和位置编码实现并行的长距离建模，GPT做单向生成，BERT做双向理解。</div></div>","7":"<section class=\"card route-card\"><h3>第7章一张总复习路线</h3>\n<div class=\"route\"><pre>信息检索\n│\n├─ 一般流程\n│  ├─ 文本预处理：分词 / 词性 / 虚词过滤\n│  ├─ 标引：索引项选择 + TF-IDF + 向量化\n│  ├─ 相关度：余弦 / 内积 / Jaccard\n│  └─ 排序：降序返回Top N\n│\n├─ 基本模型\n│  ├─ 布尔：AND/OR/NOT，二值匹配，不排序\n│  ├─ VSM：向量、部分匹配、可排序\n│  ├─ 语言模型：P(query|document)\n│  └─ 概率模型：P(相关|D,Q)\n│\n├─ LSI\n│  ├─ C = UΣVᵀ\n│  ├─ U词项 / Σ语义重要性 / Vᵀ文档\n│  ├─ 截断SVD降维去噪\n│  └─ 缓解一词多义与一义多词\n│\n├─ 评测\n│  ├─ Precision@N\n│  ├─ R-Precision\n│  └─ Precision-Recall曲线\n│\n└─ 问答系统\n   ├─ 语料库 / Web / 知识库 / 语言模型\n   └─ 问句分析 → 查询推理 → 答案抽取/生成</pre></div>\n</section><div class=\"tip memory\"><strong>最后背一句</strong><div>IR把查询和文档统一表示后计算相关度并排序；LSI加入潜在语义层；QA在检索基础上进一步返回直接答案。</div></div>"},"examples":{"1":"<section class=\"card \"><h3>例题1：判断歧义类型</h3><p><strong>题目：</strong>判断下列现象属于哪种歧义。</p>\n    <div class=\"mini-q\"><b>① 自动化研究所取得的成就</b><span>答案：分词歧义。</span></div>\n    <div class=\"mini-q\"><b>② 喜欢乡下的孩子</b><span>答案：短语结构歧义，可理解为“喜欢乡下”的孩子或喜欢“乡下的孩子”。</span></div>\n    <div class=\"mini-q\"><b>③ 打乒乓球、打电话、打毛衣</b><span>答案：词义歧义，“打”在不同搭配中义项不同。</span></div>\n    <div class=\"mini-q\"><b>④ 谁都看不上</b><span>答案：语用/指向歧义，可能是“她看不上任何人”，也可能是“任何人都看不上她”。</span></div></section><section class=\"card \"><h3>例题2：方法对比简答模板</h3><p><strong>题目：</strong>比较理性主义和经验主义。</p>\n    <p><strong>满分结构：</strong>共同目标 → 知识来源 → 实现方式 → 优缺点 → 发展关系。</p>\n    <p>两者都用于建立语言处理模型。理性主义的知识来源是专家，总结规则并进行逻辑推理，解释性强但覆盖有限；经验主义的知识来源是语料，通过统计或神经网络归纳规律，覆盖广但依赖数据与算力。NLP总体经历了从理性主义向经验主义的转变。</p></section>","2":"<section class=\"card \"><h3>例题1：最大匹配手算步骤</h3><p><strong>正向最大匹配：</strong>设最大词长L，从句首取不超过L个字；若在词典中则切出，否则每次缩短一个字；若全部不匹配则切单字；移动起点继续。</p>\n    <p><strong>反向最大匹配：</strong>从句尾按相同原则向前取词。</p>\n    <p class=\"seg\">例：自动化研究所取得的成就非常人能干到</p>\n    <p>FMM：自动化研究所／取得／的／成就／非常／人／能干／到</p>\n    <p>RMM：自动化研究所／取得／的／成就／非／常人／能／干到</p></section><section class=\"card \"><h3>例题2：HMM词性标注答题框架</h3><p><strong>题目：</strong>为什么HMM适合词性标注？</p>\n    <p>词性是不可直接观察的隐藏状态，词是由词性状态产生的观察；相邻词性之间存在局部转移规律，某个词性对具体词也有发射规律。HMM用π描述句首，用A描述相邻词性，用B描述词性与词的关系，最后用Viterbi寻找全局概率最大的词性序列。</p>\n    <div class=\"flowline\"><span>标注语料</span>→<span>统计π/A/B</span>→<span>输入词序列</span>→<span>Viterbi</span>→<span>词性序列</span></div></section><section class=\"card \"><h3>例题3：序列标签恢复分词</h3><p><strong>标签：</strong>自/B 然/M 语/M 言/E 处/B 理/E 很/S 难/S</p>\n    <p><strong>分词结果：</strong><span class=\"seg\">自然语言／处理／很／难</span></p>\n    <p>B后面可接M或E；M后面可接M或E；S独立成词。考试若出现非法标签序列，应指出标签转移约束被破坏。</p></section>","3":"<section class=\"card \"><h3>例题1：CYK填表通用算法</h3><pre class=\"algo\">输入：CNF文法G，词序列w₁…wₙ\n1. 对角线初始化：若A→wᵢ，则A加入chart[i,i]\n2. 对跨度len=2…n：\n3.   对起点i，终点j=i+len−1：\n4.     枚举分裂点k=i…j−1\n5.     若B∈chart[i,k]，C∈chart[k+1,j]，且A→BC\n6.       则A加入chart[i,j]并保存回溯(i,k,j,B,C)\n7. 若S∈chart[1,n]，句子可被文法生成\n8. 沿所有回溯指针生成全部句法树</pre></section><section class=\"card \"><h3>例题2：CFG与PCFG选树</h3><p>若两棵树分别使用规则概率：</p>\n    <p>T₁：0.8×0.6×0.5×0.9=0.216</p>\n    <p>T₂：0.4×0.7×0.5×0.9=0.126</p>\n    <p>则PCFG选择T₁。计算时使用<strong>所有规则概率的乘积</strong>；实际实现常取对数，把连乘变成加法以避免下溢。</p></section><section class=\"card \"><h3>例题3：三种句法分析辨析</h3><div class=\"mini-q\"><b>输出完整NP/VP层次树</b><span>完全句法结构分析</span></div>\n    <div class=\"mini-q\"><b>只标出“[美丽的校园]NP [正在建设]VG”</b><span>浅层句法分析</span></div>\n    <div class=\"mini-q\"><b>建设→校园（VOB），美丽→校园（ATT）</b><span>依存句法分析</span></div></section>","4":"<section class=\"card \"><h3>例题1：规则法词义消歧</h3><p><strong>句子：</strong>狗跑去了卫生间。</p>\n    <p>“跑”的候选义项：①快速行走；②车辆行驶。规则规定：主语具有“动物”特征时，义项①得高分；主语具有“车辆”特征时，义项②得高分。“狗”具有动物性，因此选择“快速行走”。</p></section><section class=\"card \"><h3>例题2：语义角色标注</h3><p><strong>句子：</strong>小王昨天在实验室用电脑完成了作业。</p>\n    <div class=\"role-row\"><span><b>谓词</b> 完成</span><span><b>施事</b> 小王</span><span><b>受事</b> 作业</span><span><b>时间</b> 昨天</span><span><b>地点</b> 实验室</span><span><b>工具</b> 电脑</span></div>\n    <p>答题时必须先找谓词，再围绕谓词寻找论元，不要直接按主谓宾机械照搬。</p></section><section class=\"card \"><h3>例题3：词义消歧与词性标注</h3><p>“The <b>cook</b> bought fish.”中cook是名词“厨师”；“Please <b>cook</b> the fish.”中cook是动词“烹饪”。这里同时发生词性变化和词义变化。</p>\n    <p>若同一词性内部选不同义项，如bank的“银行/河岸”，则是纯词义消歧。</p></section>","5":"<section class=\"card \"><h3>例题1：CBOW与Skip-gram</h3><p>句子：“我 喜欢 自然语言 处理”，窗口大小为1，中心词是“自然语言”。</p>\n    <p><strong>CBOW：</strong>输入“喜欢、处理”，预测“自然语言”。</p>\n    <p><strong>Skip-gram：</strong>输入“自然语言”，分别预测“喜欢”和“处理”。</p></section><section class=\"card \"><h3>例题2：为什么Softmax慢</h3><p>假设词表有100万个词。标准Softmax对一个训练样本需要计算100万个输出分数并归一化；负采样若抽5个负例，只需处理1个正例＋5个负例，输出层计算量从词表规模级别下降到常数级别。</p>\n    <p>负采样改变的是训练目标的近似方式，不是把词表删掉，也不是说模型最终只能认识6个词。</p></section><section class=\"card \"><h3>例题3：静态与动态表示</h3><p>“他在银行的<b>bank</b>工作”和“他们坐在河边的<b>bank</b>上”。</p>\n    <p>Word2Vec/GloVe查到的bank向量相同；ELMo/BERT根据左右上下文产生不同表示，因此能区分“银行”和“河岸”。</p></section><section class=\"card \"><h3>例题4：LSA矩阵含义</h3><p>对词项—文档矩阵C做SVD：C=UΣVᵀ。若只保留前2个最大奇异值，则把原始高维词项空间投影到2维潜在语义空间。U的每一行可作为词向量，Vᵀ的每一列可作为文档向量。</p></section>","6":"<section class=\"card \"><h3>例题1：由注意力分数得到权重</h3><p>某查询对三个词的注意力分数为[1, 2, 0]。经过Softmax：</p>\n    <p class=\"formula\">α≈[0.245, 0.665, 0.090]</p>\n    <p>第二个词权重最大，因此对最终上下文向量贡献最大。最终输出为0.245v₁+0.665v₂+0.090v₃。</p></section><section class=\"card \"><h3>例题2：为什么必须有位置编码</h3><p>自注意力只根据向量间关系计算，不天然区分顺序。若没有位置表示，“张三打李四”和“李四打张三”包含相同词集合，模型可能得到相同或近似表示。把位置向量加到词向量后，同一个词位于不同位置会得到不同输入表示。</p></section><section class=\"card \"><h3>例题3：BERT输入构造</h3><p><strong>单句分类：</strong><code>[CLS] 这 部 电影 很 好 [SEP]</code></p>\n    <p><strong>句对分类：</strong><code>[CLS] 句子A [SEP] 句子B [SEP]</code></p>\n    <p>每个位置输入=Token Embedding＋Segment Embedding＋Position Embedding；分类通常读取[CLS]的最终隐含表示。</p></section><section class=\"card \"><h3>例题4：BERT掩码比例</h3><p>若一句话有20个WordPiece，期望选20×15%=3个位置参与掩码任务。对被选中的位置，长期平均约80%替换[MASK]、10%替换随机词、10%保持原词。注意：15%是“被选中预测”的比例，不是全部都替换成[MASK]。</p></section><section class=\"card \"><h3>例题5：GPT与BERT应用判断</h3><div class=\"mini-q\"><b>连续生成故事、预测下一个词</b><span>更符合GPT的自回归结构</span></div>\n    <div class=\"mini-q\"><b>双向理解句子、分类、实体识别</b><span>更符合BERT编码器结构</span></div>\n    <div class=\"mini-q\"><b>抽取式阅读理解</b><span>BERT对每个位置预测答案开始/结束概率</span></div></section>","7":"<section class=\"card \"><h3>例题1：布尔检索</h3><p><strong>Query：</strong>病毒 AND（计算机 OR 电脑）AND NOT 医</p>\n    <p>D1：据报道计算机病毒最近猖獗。✅</p>\n    <p>D2：小王虽然是学医的，但对研究电脑病毒也感兴趣。❌ 含“医”</p>\n    <p>D3：计算机程序发现了艾滋病病毒传播途径。❌ 含“计算机、病毒”，但语义不符；若严格只看字符串且无“医”字可能被匹配，体现布尔模型不理解语义的局限。课程例题通常强调按给定索引项和NOT条件判断。</p></section><section class=\"card \"><h3>例题2：TF-IDF直觉</h3><p>文档库共100篇。“Transformer”在某文档出现8次，只在5篇文档出现；“的”在该文档出现20次，却在100篇都出现。</p>\n    <p class=\"formula\">IDF(Transformer)=log(100/5)=log20；IDF(的)=log(100/100)=0</p>\n    <p>因此“Transformer”的TF-IDF很高，而“的”即使频次更高，权重仍接近0。</p></section><section class=\"card \"><h3>例题3：余弦相似度</h3><p>查询q=(1,1)，文档d₁=(2,2)，d₂=(1,0)。</p>\n    <p>cos(q,d₁)=1，方向完全相同；cos(q,d₂)=1/√2≈0.707。因此d₁应排在d₂前面。d₁长度更大并不会降低相似度。</p></section><section class=\"card \"><h3>例题4：Precision与Recall</h3><p>系统返回10篇文档，其中6篇相关；文档库中一共有15篇相关文档。</p>\n    <p class=\"formula\">Precision=6/10=0.6　　Recall=6/15=0.4</p>\n    <p>Precision回答“我找出来的有多少是对的”；Recall回答“所有正确资料中我找回了多少”。</p></section><section class=\"card \"><h3>例题5：MRR</h3><p>三个问题的第一个正确答案分别排在第1、2、4名：</p>\n    <p class=\"formula\">MRR=(1+1/2+1/4)/3≈0.583</p></section>"},"chapter6":{"6":"<section class=\"card hero-card\"><h3>第6章范围说明</h3><p class=\"lead\">本专题严格按配套教材<strong>第4.4节“注意力模型”＋第7章“预训练语言模型”</strong>整理，不设置课后习题答案。</p>\n    <div class=\"source-note\">覆盖：注意力机制、自注意力、Transformer、GPT、BERT、预训练任务、下游应用与易错点。</div></section><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">必须背1：为什么需要注意力机制？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>传统RNN编码器—解码器模型试图用源序列最后一个隐状态保存整段输入的信息。序列较长时，固定长度向量难以完整保存所有细节，早期信息也容易在逐步传递中损失。</p>\n       <p>注意力机制在生成每个目标词时，根据当前解码状态与源序列各位置状态的相关性分配权重，对源序列状态加权求和得到当前上下文向量。模型因此能够在不同生成时刻有选择地读取源序列中的不同信息，缓解长序列信息瓶颈。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">必须背2：什么是自注意力？有什么优势？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>自注意力是在同一序列内部计算各位置之间的相关性。对位置i，用其查询向量与所有位置的键向量计算分数，Softmax归一化后对值向量加权求和，得到位置i的新表示。</p><div class=\"formula\">Attention(Q,K,V)=softmax(QK<sup>T</sup>/√d<sub>k</sub>)V</div><p>优势是任意两个位置可以直接建立联系，长距离依赖不需要像RNN那样逐步传递；所有位置还可以并行计算，因此训练速度更快。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">必须背3：Transformer如何改进原始自注意力？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><ol><li><strong>位置表示：</strong>用位置嵌入或位置编码补充词序信息；</li>\n       <li><strong>Q/K/V角色分离：</strong>输入通过不同参数矩阵映射成查询、键和值，降低同一向量承担多种角色的学习困难；</li>\n       <li><strong>多头注意力：</strong>多组映射矩阵并行学习，让模型同时关注不同关系；</li>\n       <li><strong>多层堆叠＋前馈网络：</strong>堆叠Transformer块建模高阶关系，位置前馈网络引入非线性；</li>\n       <li><strong>残差连接和层归一化：</strong>改善深层网络的训练稳定性。</li></ol></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">必须背4：Transformer相对RNN的优缺点。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p><strong>优点：</strong>能够直接建模长距离依赖；编码阶段各位置可以并行计算，适合GPU/TPU，训练速度高；多头机制能从不同子空间学习多种关系。</p>\n       <p><strong>缺点：</strong>自注意力对序列长度的时间和空间开销较大；多组Q/K/V映射、前馈网络以及多层堆叠带来庞大参数量；小数据上不易训练，因此通常需要大规模预训练。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">必须背5：大规模预训练语言模型为什么需要“大数据、大模型、大算力”？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p><strong>大数据</strong>提供丰富的语言现象和上下文知识；<strong>大模型</strong>提供足够参数容量存储和组合这些知识；<strong>大算力</strong>使超大规模数据和模型能在可接受时间内完成训练。三者缺一不可，Transformer因并行性强、上下文建模能力好而成为主流主体结构。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">必须背6：GPT的核心思想和训练范式。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>GPT是基于Transformer的<strong>单向自回归语言模型</strong>，按照从左到右的顺序，根据历史词预测当前词。它提出“生成式预训练＋判别式下游任务精调”的范式：先在大规模无标注文本上训练语言模型，学习通用语义表示；再加入任务输出层，用少量有标注数据精调，使模型适应分类、蕴含、相似度、阅读理解等任务。</p>\n       <p>精调时也可保留一定预训练语言模型损失，以缓解灾难性遗忘。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">必须背7：BERT的输入表示与两个基本预训练任务。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><p>BERT是多层Transformer编码器构成的双向预训练模型。每个位置的输入表示由<strong>词向量＋块向量＋位置向量</strong>相加得到；[CLS]放在序列开头，[SEP]用于分隔文本块。</p>\n       <p><strong>MLM：</strong>随机选择15%的Token进行预测；其中80%替换为[MASK]、10%替换为随机词、10%保持原词。模型利用左右双向上下文恢复原词。</p>\n       <p><strong>NSP：</strong>判断句子B是否是句子A的下一个句子，正负样本约1:1，使用[CLS]位置表示进行二分类，从而学习句间关系。</p></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">必须背8：GPT与BERT的核心区别。</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><div class=\"table-wrap\"><table><thead><tr><th>比较项</th><th>GPT</th><th>BERT</th></tr></thead><tbody>\n       <tr><td>语言模型</td><td>自回归</td><td>自编码</td></tr>\n       <tr><td>上下文方向</td><td>单向，左到右</td><td>双向，同时利用左右文</td></tr>\n       <tr><td>训练目标</td><td>预测下一个词</td><td>MLM恢复掩码词＋NSP句间预测</td></tr>\n       <tr><td>结构倾向</td><td>Transformer生成/解码式结构</td><td>Transformer编码器</td></tr>\n       <tr><td>优势任务</td><td>自然语言生成</td><td>语言理解、分类、标注、抽取</td></tr>\n       <tr><td>局限</td><td>不能直接利用未来上下文</td><td>预训练中存在[MASK]与下游输入不一致</td></tr></tbody></table></div></div>\n    </details><details class=\"qa\" open>\n      <summary><span class=\"qtag\">简答题</span><span class=\"qtitle\">必须背9：BERT怎样应用到下游任务？</span></summary>\n      <div class=\"answer\"><div class=\"answer-label\">标准答案</div><ul><li><strong>单句/句对分类：</strong>读取[CLS]隐含表示，经全连接层分类；</li>\n       <li><strong>抽取式阅读理解：</strong>对每个Token分别预测答案起点和终点概率；</li>\n       <li><strong>序列标注：</strong>对每个Token的隐含表示进行标签分类，可在上层增加CRF；</li>\n       <li><strong>两种使用方式：</strong>特征提取时冻结BERT参数；模型精调时BERT参与训练并更新参数，通常效果更好但开销更大。</li></ul></div>\n    </details><div class=\"tip memory\"><strong>第6章总口诀</strong><div>长序列瓶颈引出Attention，同序列内部变Self-Attention；位置、QKV、多头、前馈、残差和归一化组成Transformer；大数据大模型大算力做预训练；GPT单向生成，BERT双向理解。</div></div>"},"all":{"all":"<section class=\"card hero-card\"><h3>全课程主线：从语言符号到信息应用</h3>\n<div class=\"mega-route\">\n<div><b>第1章 绪论</b><span>定义任务、困难和方法</span></div>\n<div class=\"arrow\">→</div>\n<div><b>第2章 词法</b><span>把字符串变成词、实体和词性</span></div>\n<div class=\"arrow\">→</div>\n<div><b>第3章 句法</b><span>确定句子结构和词间依存</span></div>\n<div class=\"arrow\">→</div>\n<div><b>第4章 语义</b><span>确定词义和谓词—论元关系</span></div>\n<div class=\"arrow\">→</div>\n<div><b>第5章 词向量</b><span>把词转换成可计算的语义向量</span></div>\n<div class=\"arrow\">→</div>\n<div><b>第6章 预训练模型</b><span>用Transformer学习上下文表示</span></div>\n<div class=\"arrow\">→</div>\n<div><b>第7章 信息检索</b><span>表示查询和文档，计算相关度并返回答案</span></div>\n</div></section><section class=\"card \"><h3>考前30分钟只看这些</h3><ul><li>NLP：理解＋生成；困难：歧义＋未知；方法：规则＋数据。</li><li>分词：最大匹配与B/M/E/S；HMM：词是观察、词性是状态、Viterbi解码。</li><li>句法：CFG/PCFG；CYK必须CNF；顶格S并回溯所有分叉。</li><li>语义：WSD三类方法；SRL以谓词为中心，识别施事、受事、时间、地点等。</li><li>词向量：One-hot → LSA/HAL → Word2Vec/GloVe → ELMo；CBOW与Skip-gram别记反。</li><li>Transformer：位置＋QKV＋多头＋FFN＋残差/归一化；GPT单向，BERT双向MLM。</li><li>检索：VSM三关键点；TF-IDF；余弦；LSI的C/U/Σ/Vᵀ；Precision与Recall。</li></ul></section><section class=\"card \"><h3>简答题统一高分模板</h3><div class=\"template-grid\">\n    <div><b>概念题</b><span>定义 → 处理对象 → 输出 → 例子</span></div>\n    <div><b>方法题</b><span>要解决的问题 → 输入输出 → 核心步骤 → 优缺点</span></div>\n    <div><b>比较题</b><span>共同目标 → 信息来源 → 模型/输出 → 优缺点 → 适用场景</span></div>\n    <div><b>算法题</b><span>预处理/规范化 → 初始化 → 递推 → 终止 → 回溯/解释</span></div>\n    </div></section>"},"lessons":{"1":"<section class=\"card hero-card lesson-hero\">\n  <div class=\"lesson-kicker\">零基础逐章讲解</div>\n  <h3>第1章 绪论：先弄懂NLP到底在做什么</h3>\n  <p class=\"lead\">这一章不重计算，重点是建立整门课的地图。你先知道“研究对象是什么、要完成什么、为什么困难、用什么方法”，后面每一章才不会散。</p>\n  <div class=\"goal-box\"><b>学完本章，你应该能做到：</b><ul><li>用自己的话解释自然语言与自然语言处理</li><li>说出NLP的研究层次和典型任务</li><li>用例子解释歧义与未知语言现象</li><li>区分理性主义方法和经验主义方法</li><li>背出NLP的发展主线</li></ul></div>\n  <div class=\"source-note\">内容依据：《第1讲 绪论 2026》PPT</div>\n</section><details class=\"qa lesson-block\" open>\n      <summary><span class=\"qtag\">知识块1</span><span class=\"qtitle\">什么是自然语言？为什么它比编程语言难处理？</span></summary>\n      <div class=\"answer lesson-answer\"><p><strong>自然语言</strong>是随着社会发展自然产生、不断演化，用于人类日常交流和思考的符号系统，例如汉语、英语。它不是某个人先设计好规则再让大家使用的。</p>\n<div class=\"compare\">\n  <div><h4>自然语言</h4><p>自然产生、不断变化、表达灵活、经常有歧义。例：“他很男人”“我去打酱油”。</p></div>\n  <div><h4>人工语言</h4><p>为特定目的创造，规则明确、语义相对单一。例：Python、SQL。</p></div>\n</div>\n<p>计算机喜欢明确规则，而自然语言经常“同一句话有多种理解、同一个意思有多种说法”，所以处理起来困难。</p></div>\n    </details><details class=\"qa lesson-block\" open>\n      <summary><span class=\"qtag\">知识块2</span><span class=\"qtitle\">什么是自然语言处理？核心任务是什么？</span></summary>\n      <div class=\"answer lesson-answer\"><p><strong>自然语言处理（NLP）</strong>是一门让计算机模拟人类，对自然语言进行智能化处理的技术。</p>\n<p>这里有三个关键词：</p>\n<ul><li><strong>对象：</strong>自然语言文本；</li><li><strong>目标：</strong>让机器表现得像人在处理语言；</li><li><strong>方式：</strong>建立规则、统计模型或神经网络模型进行计算。</li></ul>\n<div class=\"flowline\"><span>输入语言</span><b>→</b><span>理解</span><b>→</b><span>转换</span><b>→</b><span>生成输出</span></div>\n<p>因此常把NLP概括为：</p><div class=\"formula\">自然语言处理 = 自然语言理解 + 自然语言生成</div>\n<p><strong>例子：</strong>机器翻译既要理解源语言，又要生成目标语言；问答系统既要理解问题，又要组织答案。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块3</span><span class=\"qtitle\">NLP和人工智能、机器学习、计算语言学是什么关系？</span></summary>\n      <div class=\"answer lesson-answer\"><p><strong>人工智能</strong>是大范围目标：让机器表现出智能。<strong>机器学习</strong>关注从数据中学习规律。<strong>NLP</strong>重点处理语言符号和其中的知识，属于人工智能的重要分支，也经常使用机器学习方法。</p>\n<p>PPT中的直观区分是：</p>\n<ul><li>机器学习：更关注“从数据中获取知识”；</li><li>机器视觉：更关注“模拟感知，处理图像信息”；</li><li>NLP：更关注“模拟认知，理解和利用符号化知识”。</li></ul>\n<p><strong>计算语言学</strong>偏向用计算机研究语言现象与规律；<strong>自然语言理解</strong>偏机理和科学问题；<strong>自然语言处理</strong>还包含工程实现和应用系统，范围更宽。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块4</span><span class=\"qtitle\">NLP研究内容分哪三层？</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"layer-stack\">\n  <div><b>应用层</b><span>机器翻译、信息检索、自动文摘、问答系统、文档分类、信息抽取、对话系统</span></div>\n  <div><b>应用基础层</b><span>词法分析、句法分析、语义分析、篇章分析</span></div>\n  <div><b>基础层</b><span>语言模型、语料库、语言知识库、字符编码体系</span></div>\n</div>\n<p>理解顺序是<strong>从下往上提供支撑</strong>：语料库和语言模型是底座；词法、句法、语义分析把文本逐层加工；最上面才是用户直接看到的翻译、搜索、问答等系统。</p>\n<div class=\"tip warn\"><strong>考试提醒</strong><div>“信息检索”属于应用层；“词法分析”属于应用基础层；“语料库建设”属于基础层。</div></div></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块5</span><span class=\"qtitle\">常见任务到底在做什么？</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"table-wrap\"><table><thead><tr><th>任务</th><th>输入</th><th>输出</th><th>通俗理解</th></tr></thead><tbody>\n<tr><td>词法分析</td><td>字符串</td><td>词、实体、词性</td><td>先认出句子里有哪些“词级单位”</td></tr>\n<tr><td>句法分析</td><td>词序列</td><td>句法树或依存关系</td><td>判断词语怎样组成句子</td></tr>\n<tr><td>语义分析</td><td>词法/句法结果</td><td>词义、语义角色等</td><td>判断句子在说什么</td></tr>\n<tr><td>信息抽取</td><td>非结构化文本</td><td>时间、地点、人物、关系等</td><td>把文章变成表格化信息</td></tr>\n<tr><td>信息检索</td><td>查询＋文档库</td><td>相关文档排序</td><td>从很多资料中找出最相关的</td></tr>\n<tr><td>问答系统</td><td>自然语言问题</td><td>答案</td><td>不只找文档，而是直接回答</td></tr>\n</tbody></table></div></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块6</span><span class=\"qtitle\">NLP为什么困难？——歧义与未知语言现象</span></summary>\n      <div class=\"answer lesson-answer\"><h4>一、歧义：同一种形式有多种解释</h4>\n<ul>\n<li><strong>分词歧义：</strong>“自动化研究所取得的成就”可理解为“自动化／研究所……”或“自动化／研究／所取得……”。</li>\n<li><strong>短语歧义：</strong>“喜欢乡下的孩子”可能是“[喜欢乡下]的孩子”，也可能是“喜欢[乡下的孩子]”。</li>\n<li><strong>词义歧义：</strong>“打乒乓球、打电话、打毛衣”中的“打”含义不同。</li>\n<li><strong>语用歧义：</strong>“谁都看不上”既可能表示她看不上别人，也可能表示别人看不上她。</li>\n</ul>\n<h4>二、未知语言现象：以前没见过</h4>\n<p>包括新词（网红、YYDS）、旧词新义（卷、丧）、新句式。自然语言一直变化，有限的词典、规则和训练数据不可能覆盖全部现象。</p>\n<p><strong>一句话：</strong>歧义是“看见了但不知道选哪个解释”，未知现象是“模型过去根本没有见过”。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块7</span><span class=\"qtitle\">理性主义与经验主义：两种基本研究方法</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"compare\">\n<div><h4>理性主义方法</h4><p><strong>专家规则＋逻辑推理</strong>。先由人总结语言规律，再让机器按规则推理。</p><p>优点：可解释。缺点：规则难写全，维护困难。</p></div>\n<div><h4>经验主义方法</h4><p><strong>大量实例＋归纳学习</strong>。让模型从语料中统计或学习输入到输出的映射。</p><p>优点：覆盖面广，能适应复杂现象。缺点：依赖数据与算力，可解释性较弱。</p></div>\n</div>\n<p>不要把“经验主义”理解成随便凭经验，它强调的是从<strong>真实语料和实例</strong>中归纳规律。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块8</span><span class=\"qtitle\">NLP技术发展史：规则 → 统计 → 深度学习 → 预训练</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"timeline\">\n<div><b>20世纪50年代—80年代末</b><span>理性主义：模式匹配＋文法分析，小型专家系统。</span></div>\n<div><b>20世纪90年代—2013</b><span>统计机器学习：大规模语料出现，人工设计特征，再用统计模型学习。</span></div>\n<div><b>2013—2018</b><span>深度学习：神经网络自动学习表示，减少人工特征工程。</span></div>\n<div><b>2018至今</b><span>预训练模型：Transformer与“预训练＋微调”成为新范式。</span></div>\n</div>\n<p>发展不是把旧方法彻底删除，而是主流方法逐步改变。现实系统仍可能把规则、统计和神经网络组合起来。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块9</span><span class=\"qtitle\">汉语相对英语有哪些特殊问题？</span></summary>\n      <div class=\"answer lesson-answer\"><ul><li><strong>汉语词间没有天然空格：</strong>必须先进行自动分词。</li><li><strong>英语词形变化明显：</strong>时态、单复数等可从词形获得信息；汉语词形变化少，更多依赖上下文。</li><li><strong>语序和句法组织不同：</strong>不能简单把英语处理规则原样搬到汉语。</li></ul>\n<p>因此汉语NLP中特别强调分词、未登录词、词性兼类和上下文判断。</p></div>\n    </details><div class=\"tip memory\"><strong>本章最后背一句</strong><div>NLP是让计算机理解和生成自然语言的人工智能技术；研究内容分基础层、应用基础层和应用层；主要困难是歧义与未知语言现象；方法从规则驱动发展到统计、深度学习和预训练模型。</div></div>","2":"<section class=\"card hero-card lesson-hero\">\n  <div class=\"lesson-kicker\">零基础逐章讲解</div>\n  <h3>第2章 词法分析：把连续字符串变成机器可处理的词级信息</h3>\n  <p class=\"lead\">词法分析发生在句法分析之前。汉语里最重要的是分词、命名实体识别和词性标注。考试既会考定义，也会考最大匹配、HMM和Viterbi。</p>\n  <div class=\"goal-box\"><b>学完本章，你应该能做到：</b><ul><li>解释词法分析的输入和输出</li><li>区分三种分词困难</li><li>手算正向/反向最大匹配</li><li>理解BMES序列标注</li><li>理解NER和词性标注</li><li>用HMM与Viterbi完成最优标签序列解码</li></ul></div>\n  <div class=\"source-note\">内容依据：《第2讲 词法分析 2026》PPT</div>\n</section><details class=\"qa lesson-block\" open>\n      <summary><span class=\"qtag\">知识块1</span><span class=\"qtitle\">词法分析是什么？包括哪些任务？</span></summary>\n      <div class=\"answer lesson-answer\"><p>从NLP系统接收输入字符串开始，到进入句子层面的句法分析之前，所有<strong>词一级处理</strong>统称为词法分析。</p>\n<div class=\"flowline\"><span>原始字符串</span><b>→</b><span>词法分析</span><b>→</b><span>词序列＋实体＋词性</span><b>→</b><span>句法分析</span></div>\n<ul><li><strong>汉语自动分词：</strong>确定词的边界；</li><li><strong>英语形态还原：</strong>把变形词还原为基本形；</li><li><strong>命名实体识别：</strong>识别人名、地名、机构名、时间等；</li><li><strong>词性标注：</strong>判断每个词在当前句子中是名词、动词等。</li></ul></div>\n    </details><details class=\"qa lesson-block\" open>\n      <summary><span class=\"qtag\">知识块2</span><span class=\"qtitle\">汉语自动分词为什么不是简单加空格？</span></summary>\n      <div class=\"answer lesson-answer\"><p>汉语自动分词就是让计算机在词与词之间加入边界：</p><div class=\"formula\">我们在上自然语言处理课程 → 我们／在／上／自然语言处理／课程</div>\n<p>困难有三类：</p>\n<ol><li><strong>分词规范不明确：</strong>“大白菜”“白花”等到底算一个词还是多个词，并没有唯一公认标准。</li><li><strong>切分歧义：</strong>同一字串存在多种合法切法。</li><li><strong>未登录词：</strong>词不在词典或训练数据里，如新词、专有名词、专业术语。</li></ol>\n<div class=\"compare\"><div><h4>交集型歧义</h4><p>AJ和JB都能成词，例如“乒乓球拍卖完了”：乒乓球拍／卖……或乒乓球／拍卖……</p></div><div><h4>组合型歧义</h4><p>A、B、AB都能成词，例如“马上”：马／上，或“马上”整体。</p></div></div>\n<p>PPT强调：真实场景中，<strong>专有名词等未登录词</strong>往往影响最大。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块3</span><span class=\"qtitle\">最大匹配法：每次选当前能找到的最长词</span></summary>\n      <div class=\"answer lesson-answer\"><h4>正向最大匹配（FMM）</h4><ol><li>从句子左边开始；</li><li>取不超过最大词长的字符串；</li><li>若在词典中，切出；若不在，逐字缩短；</li><li>重复直到结束。</li></ol>\n<h4>反向最大匹配（BMM）</h4><p>完全相同，只是从右向左扫描。</p>\n<div class=\"tip warn\"><strong>核心缺点</strong><div>它只保证每一步“局部最长”，不保证整句“全局最好”；不能可靠识别未登录词。</div></div>\n<p><strong>例：</strong>词典含“研究生、研究、生命、命”。“研究生命”按正向最长可能切为“研究生／命”，但正确理解通常是“研究／生命”。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块4</span><span class=\"qtitle\">最短路径法与最大概率法：从局部贪心走向全局选择</span></summary>\n      <div class=\"answer lesson-answer\"><h4>最短路径法</h4><p>把句子看成一张有向图：字符位置是节点，词典中能匹配的词是边。每条边代价相同，寻找经过词语数量最少的路径。它比单纯最大匹配更有全局性，但仍依赖词典，不能解决未登录词。</p>\n<h4>最大概率法</h4><p>枚举或搜索可能切分，计算每种切分的概率，选择概率最大者：</p><div class=\"formula\">W* = arg max<sub>W</sub> P(W)</div>\n<p>如果使用N元语言模型，概率会考虑相邻词的搭配。例如“研究／生命”在语料中比“研究生／命”更自然，就会得到更高概率。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块5</span><span class=\"qtitle\">字分类法：把分词变成BMES序列标注</span></summary>\n      <div class=\"answer lesson-answer\"><p>现代分词常不直接“切”，而是给每个字分类：</p>\n<div class=\"tag-row\"><span><b>B</b>：词首</span><span><b>M</b>：词中</span><span><b>E</b>：词尾</span><span><b>S</b>：单字词</span></div>\n<p><strong>例：</strong>“乒乓球拍完了”</p><div class=\"formula\">乒/B　乓/M　球/E　拍/S　完/S　了/S</div>\n<p>根据标签恢复边界：<strong>乒乓球／拍／完／了</strong>。</p>\n<p>分类时会利用当前字以及前后字，如C<sub>-2</sub>、C<sub>-1</sub>、C<sub>0</sub>、C<sub>1</sub>、C<sub>2</sub>，还可加入数字、标点、英文字母等字符类别。常用模型有HMM、CRF和神经网络。</p>\n<p><strong>序列标注</strong>的特殊点：从头到尾逐个分类，并且各位置标签相互影响，不能完全当成互不相关的普通分类。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块6</span><span class=\"qtitle\">命名实体识别（NER）：找出专有名称并判断类型</span></summary>\n      <div class=\"answer lesson-answer\"><p>命名实体识别是识别文本中对实体的<strong>命名性指称</strong>，如人名、地名、机构名、时间名等。</p>\n<p>句子“中国乒乓球男队总教练刘国梁出席会议，他指出……”中：</p>\n<ul><li>“中国乒乓球男队总教练”：名词性指称；</li><li>“刘国梁”：命名性指称，是NER重点；</li><li>“他”：代词性指称。</li></ul>\n<p>主要方法：</p>\n<ol><li><strong>规则法：</strong>姓氏表、称谓词、边界词、最长匹配等；</li><li><strong>统计法：</strong>把每个字标为人名开始、内部或外部，本质是序列标注，常用CRF；</li><li><strong>深度学习法：</strong>词向量输入RNN/LSTM/BiLSTM/BERT，再预测每个位置标签。</li></ol></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块7</span><span class=\"qtitle\">词性标注：为什么同一个词不能永远贴同一标签？</span></summary>\n      <div class=\"answer lesson-answer\"><p><strong>词性</strong>是词的基本语法属性，如名词、动词、形容词。<strong>词性标注</strong>要结合当前句子的上下文，给每个词选择正确词性。</p>\n<p>汉语困难：</p><ul><li>缺乏明显词形变化；</li><li>兼类词多，而且越常用的词越容易兼类；</li><li>不同语料库的词性划分标准不同。</li></ul>\n<p><strong>例：</strong>“研究取得进展”中的“研究”可以是名词；“研究这个问题”中的“研究”是动词。不能只查词典，必须看上下文。</p>\n<p>词性标注是句法分析的基础，也可以使规则更抽象，如“V＋N”表示动宾短语，不必为每个具体动词和名词单独写规则。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块8</span><span class=\"qtitle\">HMM如何描述词性标注？三个参数必须懂</span></summary>\n      <div class=\"answer lesson-answer\"><p>隐马尔可夫模型（HMM）里存在两条序列：</p>\n<ul><li><strong>观察序列O：</strong>我们能看见的词序列；</li><li><strong>状态序列Q：</strong>看不见、需要推断的词性序列。</li></ul>\n<div class=\"formula\">μ = (A, B, π)</div>\n<ul><li><strong>π 初始概率：</strong>句子第一个词属于各词性的概率；</li><li><strong>A 转移概率：</strong>前一个词性到后一个词性的概率，如P(N|V)；</li><li><strong>B 发射概率：</strong>某词性生成某个词的概率，如P(“吃”|V)。</li></ul>\n<p>训练时用已经标注好词性的语料统计π、A、B；使用时给定词序列，寻找概率最大的词性序列。</p>\n<div class=\"tip memory\"><strong>记忆口诀</strong><div>词是观察，词性是状态；π管开头，A管词性接词性，B管词性生成词。</div></div></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块9</span><span class=\"qtitle\">Viterbi算法：一步一步找最可能的标签路径</span></summary>\n      <div class=\"answer lesson-answer\"><p>暴力枚举所有词性序列会指数爆炸。Viterbi使用动态规划：到达某个时刻、某个状态时，只保留<strong>概率最大的那条路径</strong>。</p>\n<div class=\"formula\">δ<sub>t</sub>(j)=max<sub>i</sub>[δ<sub>t−1</sub>(i)·a<sub>ij</sub>]·b<sub>j</sub>(o<sub>t</sub>)</div>\n<p><strong>小例子：</strong>观察序列“研究 生物”，候选状态只有N和V。</p>\n<div class=\"table-wrap\"><table><thead><tr><th>参数</th><th>数值</th></tr></thead><tbody>\n<tr><td>初始</td><td>π(N)=0.6，π(V)=0.4</td></tr>\n<tr><td>发射“研究”</td><td>B<sub>N</sub>=0.2，B<sub>V</sub>=0.6</td></tr>\n<tr><td>发射“生物”</td><td>B<sub>N</sub>=0.7，B<sub>V</sub>=0.1</td></tr>\n<tr><td>转移</td><td>N→N=0.5，N→V=0.5，V→N=0.8，V→V=0.2</td></tr>\n</tbody></table></div>\n<p>第1词：δ₁(N)=0.6×0.2=0.12；δ₁(V)=0.4×0.6=0.24。</p>\n<p>第2词为N：max(0.12×0.5, 0.24×0.8)×0.7=0.1344，来自V。</p>\n<p>第2词为V：max(0.12×0.5, 0.24×0.2)×0.1=0.006，来自N。</p>\n<p>最终N更大，回溯得到路径<strong>V→N</strong>：研究/V，生物/N。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块10</span><span class=\"qtitle\">当前词法分析还会在哪些场景失败？</span></summary>\n      <div class=\"answer lesson-answer\"><ul><li><strong>跨领域：</strong>新闻语料训练的模型用到医学文本，专业词识别会变差。</li><li><strong>非规范文本：</strong>微博、短信、评论中有缩写、谐音、错别字、新词。</li><li><strong>边界标准不同：</strong>不同分词规范会给出不同“正确答案”。</li><li><strong>未登录实体：</strong>新出现的人名、机构名、产品名难以及时收录。</li></ul>\n<p>因此真实系统通常会结合词典、规则、统计模型、深度模型和领域数据，而不是只靠一种方法。</p></div>\n    </details><div class=\"tip memory\"><strong>本章最后背一句</strong><div>词法分析把字符串加工成词、实体和词性；分词困难是规范、歧义和未登录词；BMES把分词变为序列标注；HMM中词是观察、词性是状态，Viterbi用动态规划求最优路径。</div></div>","3":"<section class=\"card hero-card lesson-hero\">\n  <div class=\"lesson-kicker\">零基础逐章讲解</div>\n  <h3>第3章 句法分析：机器怎样判断一句话“怎么组成”</h3>\n  <p class=\"lead\">本章主线只有两个问题：语法规则库从哪里来？如何从规则库中搜索出能解释句子的规则？CFG/PCFG回答规则怎样表示，CYK/Viterbi回答怎样搜索。</p>\n  <div class=\"goal-box\"><b>学完本章，你应该能做到：</b><ul><li>区分完全句法、浅层句法和依存句法</li><li>写出CFG四元组并读懂产生式</li><li>解释乔姆斯基范式</li><li>按跨度填写CYK表并回溯句法树</li><li>解释PCFG概率与最优句法树</li><li>理解语块标注和依存关系</li></ul></div>\n  <div class=\"source-note\">内容依据：《第3讲 句法分析 2026》PPT</div>\n</section><details class=\"qa lesson-block\" open>\n      <summary><span class=\"qtag\">知识块1</span><span class=\"qtitle\">句法分析是什么？它只看形式，不判断常识真假</span></summary>\n      <div class=\"answer lesson-answer\"><p>句法分析是限定在<strong>句子层面</strong>的形式化分析，核心目标是确定：</p>\n<ul><li>句子的句法结构；</li><li>词汇之间的依存关系。</li></ul>\n<p>它分析的是“句子形式是否符合语法”，不是“内容是否符合现实”。例如“亚里士多德吃了一个地球”语义很荒谬，但形式上仍可能是“主语＋谓语＋宾语”的合法句子。</p>\n<div class=\"compare\"><div><h4>完全句法分析</h4><p>输出完整短语结构树。</p></div><div><h4>浅层句法分析</h4><p>只识别局部基本语块。</p></div></div>\n<p>依存句法分析则不强调短语层次，而是直接建立词与词之间的支配关系。</p></div>\n    </details><details class=\"qa lesson-block\" open>\n      <summary><span class=\"qtag\">知识块2</span><span class=\"qtitle\">完全句法分析的本质：在规则库中搜索解释</span></summary>\n      <div class=\"answer lesson-answer\"><p>要把句子“The can can hold the water”变成句法树，至少需要：</p>\n<ul><li><strong>词典：</strong>the是冠词；can可能是名词、助动词或动词；</li><li><strong>语法规则：</strong>S→NP VP，NP→art n，VP→aux VP，VP→v NP等。</li></ul>\n<p>句法树内部节点体现使用了哪些语法规则。因此：</p>\n<div class=\"formula\">句法分析 = 从语法规则库中搜索一组能合理解释当前句子的规则</div>\n<p>设计句法分析器要解决两件事：<strong>规则库怎样建立</strong>，以及<strong>搜索算法怎样设计</strong>。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块3</span><span class=\"qtitle\">CFG上下文无关文法：四个组成部分</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"formula\">G = (N, Σ, P, S)</div>\n<ul><li><strong>N：</strong>非终结符集合，如S、NP、VP；</li><li><strong>Σ：</strong>终结符集合，即实际词语或词性；</li><li><strong>P：</strong>产生式规则集合，如S→NP VP；</li><li><strong>S：</strong>开始符号，代表完整句子。</li></ul>\n<p>“上下文无关”在形式上表示：每条规则左边只有一个非终结符。只要看到NP，就可以按NP的规则展开，不需要检查它左右的其他符号。</p>\n<pre class=\"grammar\">S  → NP VP\nNP → art n\nVP → aux VP\nVP → v NP</pre>\n<p>从S开始不断替换非终结符，直到全部变成词，就能得到一个句子；把替换过程画出来就是句法树。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块4</span><span class=\"qtitle\">为什么人工CFG不够？</span></summary>\n      <div class=\"answer lesson-answer\"><p>人工规则法原理直观，但有四个明显问题：</p>\n<ol><li>规则有限时，长句和复杂句无法分析；</li><li>一个句子有多棵合法树时，CFG本身不能判断哪棵更好；</li><li>人工规则带有主观性；</li><li>编写覆盖整门语言的规则工作量巨大。</li></ol>\n<p>这引出PCFG：让机器从带树标注的语料中抽取规则，并给每条规则加概率。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块5</span><span class=\"qtitle\">CYK为什么要求乔姆斯基范式（CNF）？</span></summary>\n      <div class=\"answer lesson-answer\"><p>标准CYK只处理两类规则：</p>\n<div class=\"formula\">A → BC　或　A → a</div>\n<p>也就是一个非终结符只能展开为<strong>两个非终结符</strong>，或者<strong>一个终结符</strong>。这样任何跨度都能通过“把区间切成左右两段”来计算。</p>\n<p>若原规则是三元规则：</p><div class=\"formula\">S → VP Aux NP</div>\n<p>引入新非终结符X：</p><pre class=\"grammar\">S → VP X\nX → Aux NP</pre>\n<p>这叫<strong>二叉化</strong>。一元非终结符规则也通常要消除或闭包处理。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块6</span><span class=\"qtitle\">CYK表怎么填？方向不是重点，依赖顺序才是重点</span></summary>\n      <div class=\"answer lesson-answer\"><p>CYK是自底向上的动态规划。表格每个格子表示：某个连续词区间能够由哪些非终结符生成。</p>\n<ol><li><strong>初始化：</strong>把每个词对应的词性/终结规则填在对角线或底层。</li><li><strong>跨度从2到n：</strong>先算短区间，再算长区间。</li><li><strong>枚举分裂点：</strong>把区间[i,j]切成[i,k]和[k+1,j]。</li><li><strong>匹配规则：</strong>若左格有B、右格有C，且存在A→BC，就把A加入当前格。</li><li><strong>终止：</strong>覆盖整句的顶格出现S，说明句子可由文法生成。</li><li><strong>回溯：</strong>根据保存的规则和分裂点画树。</li></ol>\n<div class=\"tip warn\"><strong>关于“从上往下还是从下往上”</strong><div>图画法可以不同，但计算必须保证子区间先于父区间。PPT的PCFG表采用逐列、每列从下往上填写；本质仍是跨度由短到长。</div></div></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块7</span><span class=\"qtitle\">CYK大题：“咬 死 了 猎人 的 狗”如何出现两棵树？</span></summary>\n      <div class=\"answer lesson-answer\"><p>规范化后的关键规则：</p>\n<pre class=\"grammar\">S  → VC NP | VP X\nVC → v a | VC utl\nVP → VC NP\nNP → n | NP X | NP NP\nX  → Aux NP</pre>\n<p>先得到：VC[咬死]，再得到VC[咬死了]；“的＋狗”得到X；“猎人＋的狗”得到NP。</p>\n<p>覆盖整句时存在两种组合：</p>\n<ol><li><strong>S→VC NP：</strong>“咬死了”作为VC，“猎人的狗”作为NP；</li><li><strong>S→VP X：</strong>“咬死了猎人”作为VP，“的狗”作为X。</li></ol>\n<div class=\"compare\">\n<pre class=\"tree\">结构1\nS\n├─ VC：咬死了\n└─ NP：猎人的狗</pre>\n<pre class=\"tree\">结构2\nS\n├─ VP：咬死了猎人\n└─ X：的狗</pre>\n</div>\n<p>所以一个格子不能只记“S”，还要保存产生它的<strong>规则、左右子格和分裂点</strong>。否则无法回溯所有树。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块8</span><span class=\"qtitle\">PCFG：给CFG规则加概率</span></summary>\n      <div class=\"answer lesson-answer\"><p>PCFG与CFG有两点关键区别：</p>\n<ul><li>每条规则带概率，如NP→Det N [0.7]；</li><li>规则和概率通常从树库中自动抽取和估计。</li></ul>\n<p>一棵树的概率一般是所用规则概率的乘积：</p><div class=\"formula\">P(T)=∏<sub>r∈T</sub>P(r)</div>\n<p><strong>例：</strong>树A使用规则概率0.6、0.5、0.8，P(A)=0.24；树B使用0.4、0.9、0.5，P(B)=0.18，所以优先选择树A。</p>\n<p>PCFG既降低人工规则工作量，也能在多棵合法树之间选择概率最大的树。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块9</span><span class=\"qtitle\">PCFG＋CYK为什么只保留当前最优方案？</span></summary>\n      <div class=\"answer lesson-answer\"><p>当同一非终结符A能以多种方式生成同一区间时，PCFG-CYK会计算各方案概率，只保留最大的那一个以及回溯指针。</p>\n<div class=\"formula\">score(A,i,j)=max<sub>k,B,C</sub> P(A→BC)·score(B,i,k)·score(C,k+1,j)</div>\n<p>这是动态规划的<strong>最优子结构</strong>：若某个子区间已经有一条更高概率的A路径，低概率路径继续向上乘相同的其他概率，不可能反超。</p>\n<p>普通CFG-CYK要保留所有可行分析；PCFG-Viterbi式CYK为求最优树，可以只保留同类状态的最佳方案。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块10</span><span class=\"qtitle\">句法结构分析器怎样评价？</span></summary>\n      <div class=\"answer lesson-answer\"><p>短语结构树不能简单按“整棵树完全正确/错误”评价，因为一处小错就会使整树不一致。通常把树中的短语看成识别对象：</p>\n<ul><li><strong>Precision：</strong>系统识别出的短语中，多少是正确的；</li><li><strong>Recall：</strong>标准答案中的短语，系统找回了多少；</li><li><strong>F1：</strong>Precision与Recall的调和平均。</li></ul>\n<div class=\"formula\">F1 = 2PR / (P+R)</div>\n<p>依存句法常用UAS/LAS：UAS看父节点是否正确；LAS还要求依存关系标签正确。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块11</span><span class=\"qtitle\">浅层句法分析：只找局部“语块”</span></summary>\n      <div class=\"answer lesson-answer\"><p>浅层句法分析不构造完整递归树，只把句子切成若干<strong>非重叠、非递归的基本语块</strong>，例如Base NP、动词组VG、介词组PP。</p>\n<p>它通常可转化为序列标注：</p><div class=\"tag-row\"><span>B-X：语块开始</span><span>I-X：语块内部</span><span>O：语块外部</span></div>\n<p><strong>例：</strong>“[中国乒乓球队]<sub>NP</sub> [获得]<sub>VG</sub> [冠军]<sub>NP</sub>”。</p>\n<p>优点是简单、速度快、误差不容易像完整句法树那样层层传播；缺点是看不到远距离和完整层次关系。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块12</span><span class=\"qtitle\">依存句法分析：直接描述词与词的关系</span></summary>\n      <div class=\"answer lesson-answer\"><p>依存句法以词为节点，用有向边表示“中心词支配依存词”。通常整句有一个核心谓词连接ROOT，其余每个词有一个父节点，形成依存树。</p>\n<div class=\"role-row\"><span>SBV：主谓</span><span>VOB：动宾</span><span>ATT：定中</span><span>DE：“的”结构</span></div>\n<p><strong>例：</strong>“猎人咬死了狗”中，“咬死”是核心；“猎人”与它是SBV，“狗”与它是VOB。</p>\n<div class=\"tip danger\"><strong>不要混淆</strong><div>S、NP、VP、PP是短语结构树的节点类别；SBV、VOB、ATT、DE是依存树的边标签。</div></div></div>\n    </details><div class=\"tip memory\"><strong>本章最后背一句</strong><div>句法分析本质是在语法规则库中搜索解释；CFG规定规则形式，CYK按跨度动态规划；PCFG给规则加概率并选最优树；浅层句法只找语块，依存句法直接找词与词的支配关系。</div></div>","4":"<section class=\"card hero-card lesson-hero\">\n  <div class=\"lesson-kicker\">零基础逐章讲解</div>\n  <h3>第4章 语义分析：从“句子结构”继续走到“句子在表达什么”</h3>\n  <p class=\"lead\">PPT只讲三条主线：语义分析概述、词义消歧、语义角色标注。不要把它扩展成庞杂的知识图谱课程。</p>\n  <div class=\"goal-box\"><b>学完本章，你应该能做到：</b><ul><li>解释语义分析与句法分析的差别</li><li>判断多义词在上下文中的具体词义</li><li>区分规则法、有监督法和词典法</li><li>理解谓词、论元和语义角色</li><li>比较基于短语树、依存树和语块的SRL</li></ul></div>\n  <div class=\"source-note\">内容依据：《第4讲 语义分析 2026》PPT</div>\n</section><details class=\"qa lesson-block\" open>\n      <summary><span class=\"qtag\">知识块1</span><span class=\"qtitle\">什么是语义分析？</span></summary>\n      <div class=\"answer lesson-answer\"><p>语义分析是在词法分析和句法分析基础上，让计算机进一步识别作者表达的意义，也就是建立语言符号与客观世界真实知识内涵之间的联系。</p>\n<div class=\"flowline\"><span>词法：有哪些词</span><b>→</b><span>句法：词怎样组合</span><b>→</b><span>语义：到底表达什么</span></div>\n<p>按分析尺度可分：</p><ul><li>词语层面：词义消歧；</li><li>句子层面：语义角色标注；</li><li>篇章层面：共指消解、话题结构分析。</li></ul>\n<p>PPT还区分浅层语义分析和深层语义推理。本章重点是前者，即从表面语言下一层识别词义和语义关系。</p></div>\n    </details><details class=\"qa lesson-block\" open>\n      <summary><span class=\"qtag\">知识块2</span><span class=\"qtitle\">词义消歧（WSD）：一个词在这里到底是什么意思？</span></summary>\n      <div class=\"answer lesson-answer\"><p>词义消歧是确定多义词在给定上下文中的具体含义。</p>\n<p><strong>例：</strong></p><ul><li>The fish was bought by the <b>cook</b>. —— cook是“厨师”（名词）；</li><li>Please <b>cook</b> the fish. —— cook是“烹饪”（动词）。</li></ul>\n<p>多义现象可分为：</p>\n<ol><li><strong>意义相关：</strong>open“开着的/公开的”；</li><li><strong>意义无关：</strong>bank“银行/河岸”；</li><li><strong>词性不同：</strong>cook“煮/厨师”。</li></ol>\n<p>要注意：词性标注主要判断语法类别，词义消歧主要判断语义义项，两者可能有关但不是同一任务。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块3</span><span class=\"qtitle\">词性判断和词义判断分别需要什么上下文？</span></summary>\n      <div class=\"answer lesson-answer\"><p>PPT强调两类任务使用上下文的特点不同：</p>\n<ul><li><strong>词性标注：</strong>邻近词、局部句法形式很有效。例如“正在研究”中，前面的“正在”提示“研究”为动词。</li><li><strong>词义消歧：</strong>相隔较远的实词、主题词往往更重要。例如bank附近出现river、water，即使相隔几个词，也强烈提示“河岸”。</li></ul>\n<p>简单说：判断词性常看“旁边是什么结构”，判断词义常看“整句话在谈什么主题”。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块4</span><span class=\"qtitle\">基于规则的词义消歧</span></summary>\n      <div class=\"answer lesson-answer\"><p>基本思想：语言学专家人工总结词语搭配和语义限制规则，然后对各义项打分。</p>\n<p><strong>例：</strong>动词“跑”：</p>\n<ul><li>义项1“快速行走”：主语具有“动物”属性时加高分；</li><li>义项2“行驶”：主语具有“车辆”属性时加高分。</li></ul>\n<p>“狗跑去了卫生间”中，“狗”具有动物属性，因此“快速行走”得分更高。</p>\n<p>优点：解释清楚；缺点：规则工作量大、覆盖有限，需要语言知识库提供“动物、车辆、可吃”等语义属性。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块5</span><span class=\"qtitle\">基于有监督学习的词义消歧：把义项当类别</span></summary>\n      <div class=\"answer lesson-answer\"><p>先人工标注训练样本：每个多义词在句子中属于哪个义项。再提取上下文特征，训练分类器。</p>\n<h4>三类PPT方法</h4>\n<ul><li><strong>互信息方法：</strong>寻找与某个义项关联很强的上下文指示器。例如“river”与bank的“河岸”义互信息高。</li><li><strong>贝叶斯分类器：</strong>计算P(义项|上下文)，选择后验概率最大的义项。</li><li><strong>最大熵模型：</strong>融合多种特征，在满足训练数据约束的前提下选择最中立、熵最大的概率分布。</li></ul>\n<div class=\"formula\">T* = arg max<sub>T</sub> P(T | context)</div>\n<p>优点是可从数据自动学习；缺点是需要大量标注好的词义样本。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块6</span><span class=\"qtitle\">基于词典的三种词义消歧方法</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"table-wrap\"><table><thead><tr><th>方法</th><th>核心判据</th><th>通俗例子</th></tr></thead><tbody>\n<tr><td>基于词典语义定义</td><td>比较上下文词与各义项释义中的词重合程度</td><td>上下文有river，与“河岸”释义重合更多</td></tr>\n<tr><td>基于义类辞典</td><td>把义项和上下文词映射到ANIMAL、MACHINE等语义类，看哪些类常共现</td><td>crane与FOOD类共现偏“鹤”，与OPERATE类共现偏“起重机”</td></tr>\n<tr><td>基于双语词典</td><td>用翻译作为桥梁，在另一语言大语料中比较共现频率</td><td>plant翻译为“植物/工厂”，看“制造”与哪个译词更常共现</td></tr>\n</tbody></table></div>\n<p>三者共同点：不直接依赖大规模词义标注语料，而利用词典、义类或双语资源。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块7</span><span class=\"qtitle\">语义角色标注（SRL）：围绕谓词回答“谁对谁做了什么”</span></summary>\n      <div class=\"answer lesson-answer\"><p>语义角色标注以句子的<strong>谓词</strong>为中心，识别与谓词有关系的成分，并给它们分配角色。</p>\n<ul><li><strong>谓词：</strong>通常是动作或状态核心，如“写”；</li><li><strong>论元：</strong>参与该动作的成分，如“小明、信”；</li><li><strong>语义角色：</strong>论元与谓词的关系，如施事、受事、工具。</li></ul>\n<p><strong>例：</strong>“小明用铅笔在教室给小红写了一封信。”</p>\n<div class=\"role-row\"><span>小明：施事</span><span>铅笔：工具</span><span>教室：地点</span><span>小红：受益者</span><span>一封信：结果/客体</span></div>\n<p>常见角色还有时间、源点、终点、伴随等。英文PropBank常用ARG0、ARG1及ARGM表示核心和附加角色。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块8</span><span class=\"qtitle\">三种语义角色标注方法如何区分？</span></summary>\n      <div class=\"answer lesson-answer\"><div class=\"table-wrap\"><table><thead><tr><th>方法</th><th>标注对象</th><th>特征来源</th><th>直观理解</th></tr></thead><tbody>\n<tr><td>基于短语结构树</td><td>短语节点</td><td>短语类别、树路径、与谓词位置关系</td><td>从完整句法树中寻找可能论元短语</td></tr>\n<tr><td>基于依存关系树</td><td>词</td><td>父子依存关系、路径、关系标签</td><td>从谓词沿依存树向上和向下找候选词</td></tr>\n<tr><td>基于浅层语块</td><td>基本语块</td><td>语块类型、位置、谓词距离</td><td>不依赖完整树，用局部语块做候选</td></tr>\n</tbody></table></div>\n<p>依存树方法的候选生成步骤：从谓词开始，把当前节点的子节点作为候选论元；再把父节点设为当前节点，继续向上，直到根节点。</p></div>\n    </details><details class=\"qa lesson-block\">\n      <summary><span class=\"qtag\">知识块9</span><span class=\"qtitle\">完整做题示范：先找谓词，再找论元，再分类</span></summary>\n      <div class=\"answer lesson-answer\"><p>句子：“昨天，小王在实验室用Python完成了作业。”</p>\n<ol><li><strong>找谓词：</strong>完成。</li><li><strong>找候选论元：</strong>昨天、小王、实验室、Python、作业。</li><li><strong>分配角色：</strong>昨天=时间；小王=施事；实验室=地点；Python=工具；作业=受事。</li></ol>\n<p>答题不要只写“谁做了什么”，还要明确<strong>以哪个谓词为中心</strong>。一个句子有多个谓词时，要分别建立多组谓词—论元结构。</p></div>\n    </details><div class=\"tip memory\"><strong>本章最后背一句</strong><div>词义消歧是在上下文中选择多义词的具体义项，方法分规则、有监督和词典三类；语义角色标注以谓词为中心，识别施事、受事、工具、时间、地点等论元角色。</div></div>","5":"<section class=\"card hero-card lesson-hero\">\n  <div class=\"lesson-kicker\">零基础逐章讲解</div>\n  <h3>第5章 预训练词向量：机器怎样把“词”变成能计算的向量</h3>\n  <p class=\"lead\">这一章的主线是词表示的演进：One-hot只给编号；LSA/HAL统计上下文；Word2Vec/GloVe学习静态词向量；ELMo根据上下文动态生成词向量。</p>\n  <div class=\"goal-box\"><b>学完本章，你应该能做到：</b><ul><li>解释文本表示为何是NLP模型的基石</li><li>比较One-hot、分布表示和词嵌入</li><li>说清LSA与H
