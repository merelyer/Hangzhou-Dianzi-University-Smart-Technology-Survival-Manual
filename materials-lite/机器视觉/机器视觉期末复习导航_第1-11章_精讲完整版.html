const DATA={"overview":{"0":"<section class=\"card hero-card\"><h3>按你给出的期末题型复习</h3><div class=\"exam-grid\"><div><b>单选</b><strong>15×2分</strong><span>定义、性质、公式含义</span></div><div><b>判断</b><strong>10×1分</strong><span>易错方向与条件</span></div><div><b>简答</b><strong>4×5分</strong><span>解释 / 怎么解决</span></div><div><b>应用题</b><strong>10+15+15分</strong><span>写算法与步骤，不写代码</span></div></div></section>\n<section class=\"card\"><h3>复习优先级</h3><div class=\"table-wrap\"><table><thead><tr><th>等级</th><th>章节</th><th>核心</th><th>可能题型</th></tr></thead><tbody><tr><td><span class=\"level level-s\">S</span></td><td>第4章 图像增强</td><td>Gamma、均衡、卷积、平滑锐化、傅里叶</td><td>应用题/计算题</td></tr><tr><td><span class=\"level level-s\">S</span></td><td>第7章 分割与边缘</td><td>Sobel、LoG、Hough、Otsu、区域方法</td><td>应用题</td></tr><tr><td><span class=\"level level-s\">S</span></td><td>第8章 数学形态学</td><td>腐蚀膨胀、开闭、边界、连通分量</td><td>应用/简答</td></tr><tr><td><span class=\"level level-a\">A</span></td><td>第5章 几何变换</td><td>矩阵、齐次坐标、单应性</td><td>计算/简答</td></tr><tr><td><span class=\"level level-a\">A</span></td><td>第9章 特征</td><td>矩、圆形度、HOG、SIFT</td><td>简答/计算</td></tr><tr><td><span class=\"level level-a\">A</span></td><td>第10-11章</td><td>视差深度、SSD/NCC</td><td>计算/应用</td></tr><tr><td><span class=\"level level-b\">B</span></td><td>第2、3、6章</td><td>成像、数字化、颜色</td><td>选择/判断/简答</td></tr><tr><td><span class=\"level level-b\">B</span></td><td>第1章</td><td>定义、流程、应用</td><td>选择/简答</td></tr></tbody></table></div></section>\n<section class=\"card route-card\"><h3>应用题万能六步</h3><ol class=\"steps\"><li><b>说明目标：</b>输入是什么，输出要得到什么。</li><li><b>预处理：</b>灰度化、去噪、ROI、颜色空间转换。</li><li><b>核心原理：</b>写公式、核、结构元素或矩阵。</li><li><b>算法步骤：</b>按顺序编号，写到可以让别人照着实现。</li><li><b>结果判定：</b>阈值、极值、连通域或匹配位置如何确定。</li><li><b>分析改进：</b>噪声、光照、尺度、参数和失败情况。</li></ol></section>\n<section class=\"card\"><h3>简答题标准结构</h3><div class=\"template-grid\"><div><b>解释“是什么”</b><span>定义＋作用＋关键词</span></div><div><b>解释“怎么做”</b><span>输入→步骤→输出</span></div><div><b>比较两种方法</b><span>原理→效果→优缺点→场景</span></div><div><b>解释公式</b><span>每一项含义＋大/小意味着什么</span></div></div></section>\n<section class=\"card warn-card\"><h3>最容易丢分的地方</h3><ul><li>只写方法名，不写处理顺序和结果如何选出。</li><li>矩阵相乘顺序写反；bit、byte和像素单位混淆。</li><li>SSD/NCC、开/闭、近/远与视差等方向记反。</li><li>应用题写代码而不写算法原理；题目明确说“不写代码”。</li></ul></section>"},"chapters":{"1":"<section class=\"card chapter-intro\">\n<div class=\"chapter-kicker\">第1章 · PDF精讲完整版 · 讲义第5—27页</div><h2>机器视觉简介</h2>\n<p class=\"priority\">零基础目标：先听懂“它在解决什么问题”，再记公式和算法，最后用题目验证。</p>\n<div class=\"tip memory\"><strong>一句话理解</strong><div>机器视觉不是“把图像显示出来”，而是让系统自动采集图像、提取有用信息，并据此作出检测、测量、识别或控制动作。</div></div>\n<div class=\"tree-row\"><span>定义</span><span>自动化</span><span>非接触</span><span>低/中/高级处理</span><span>系统组成</span><span>工业检测</span><span>测量</span><span>OCR/OCV</span><span>引导跟踪</span></div>\n<h4>学习路线</h4><div class=\"flowline\"><span>采集图像</span><b>→</b><span>预处理</span><b>→</b><span>分割</span><b>→</b><span>特征提取</span><b>→</b><span>判断/测量</span><b>→</b><span>输出动作</span></div>\n<p class=\"source-note\">页码按上传的中文讲义标注；少量重复页、致谢页或扩展材料不作为主线。</p></section><nav class=\"chapter-toc\"><b>本章分块</b><a href=\"#c1-1\">机器视觉定义</a><a href=\"#c1-2\">系统流程与层次</a><a href=\"#c1-3\">机器视觉与计算机视觉</a><a href=\"#c1-4\">工业4.0与应用</a><a href=\"#c1-5\">题目示例</a></nav><details class=\"qa\" id=\"c1-1\" open><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">1. 什么是机器视觉？先抓住五个关键词</span><span class=\"chapter-pill\">第5—13页</span></summary><div class=\"answer\">\n<div class=\"answer-label\">先用生活例子理解</div>\n<p>人工检查瓶子液位时，人眼负责“看”，大脑负责“判断”，手负责“剔除不合格品”。机器视觉把这三部分换成：相机/传感器负责看，算法负责判断，执行机构负责动作。讲义中的瓶装液位检测只有“通过”和“失败”两种输出，因此是典型的二元检测系统。</p>\n<div class=\"formula\">机器视觉 = 自动获取图像 + 分析图像 + 提取数据 + 作出决策/动作</div>\n<div class=\"concept-grid\"><div><b>自动化</b><span>无需人工逐件观察，可连续运行。</span></div><div><b>非接触</b><span>不碰目标即可测量和检测，适合高速、脆弱或危险物体。</span></div><div><b>数据化</b><span>输出尺寸、位置、缺陷类别、合格/不合格等可记录结果。</span></div></div>\n<p><strong>图像采集</strong>可由普通相机、红外相机或紫外相机完成；<strong>预处理</strong>改善图像质量；<strong>分割</strong>把目标和背景分开；<strong>特征提取</strong>得到尺寸、颜色、长度和形状；最后系统根据这些信息执行动作。</p>\n<div class=\"tip warn\"><strong>考试表达</strong><div>定义题不要只写“用计算机看图像”。应写出“自动获取和分析图像，获得用于控制或评价对象的数据，并输出判断或动作”。</div></div>\n</div></details><details class=\"qa\" id=\"c1-2\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">2. 从图像到理解：低级、中级和高级处理</span><span class=\"chapter-pill\">第14—16页</span></summary><div class=\"answer\">\n<p>讲义把视觉处理看成一个连续过程。越往后，数据量越少，但语义越强。</p>\n<div class=\"table-wrap\"><table><thead><tr><th>层次</th><th>输入输出</th><th>典型任务</th><th>通俗理解</th></tr></thead><tbody>\n<tr><td>低级处理</td><td>图像 → 图像</td><td>获取、去噪、增强、锐化</td><td>把照片“洗干净”</td></tr>\n<tr><td>中级处理</td><td>图像 → 区域/属性</td><td>分割、边缘、特征描述</td><td>找出目标并量出特征</td></tr>\n<tr><td>高级处理</td><td>属性 → 语义/动作</td><td>分类、识别、学习、控制</td><td>知道它是什么并决定怎么办</td></tr>\n</tbody></table></div>\n<div class=\"mega-route\"><div><b>原始图像</b><span>像素很多</span></div><b>→</b><div><b>预处理</b><span>质量更好</span></div><b>→</b><div><b>分割</b><span>目标区域</span></div><b>→</b><div><b>描述</b><span>面积/形状/颜色</span></div><b>→</b><div><b>识别与动作</b><span>合格/不合格、抓取</span></div></div>\n<p>例如检测螺钉：先拍照并增强对比度；再分割螺钉；提取长度、直径和螺纹特征；最后判断型号或控制机械臂抓取。</p>\n</div></details><details class=\"qa\" id=\"c1-3\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">3. 机器视觉与计算机视觉有什么区别？</span><span class=\"chapter-pill\">第15—17页</span></summary><div class=\"answer\">\n<p>两者使用的核心组件很相似：成像设备、照明、图像采集、计算机和图像处理软件。区别主要在<strong>应用目标和系统约束</strong>。</p>\n<div class=\"table-wrap\"><table><thead><tr><th>比较项</th><th>机器视觉</th><th>计算机视觉</th></tr></thead><tbody>\n<tr><td>典型场景</td><td>工业生产线、测量、质量控制、机器人引导</td><td>更广泛的视觉理解，如自动驾驶、检索、医学影像</td></tr>\n<tr><td>环境</td><td>常主动控制光照、相机位置和背景</td><td>常面对自然场景与复杂变化</td></tr>\n<tr><td>输出</td><td>强调实时、稳定、可执行：Pass/Fail、坐标、尺寸</td><td>强调识别、理解与推理结果</td></tr>\n<tr><td>评价</td><td>漏检率、误检率、节拍、测量精度、可靠性</td><td>准确率、召回率、泛化能力等</td></tr>\n</tbody></table></div>\n<p>因此，机器视觉可以理解为计算机视觉技术在自动化检测和控制系统中的工程化应用，但二者边界并不是绝对的。</p>\n</div></details><details class=\"qa\" id=\"c1-4\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">4. 为什么机器视觉重要？常见应用如何分类？</span><span class=\"chapter-pill\">第18—26页</span></summary><div class=\"answer\">\n<p>讲义从工业4.0说明其重要性：相机与计算成本下降、算法精度提高、生产线追求高速和一致性，使机器视觉逐渐成为智能制造的“眼睛”。</p>\n<div class=\"concept-grid\"><div><b>缺陷检测</b><span>划痕、裂纹、缺料、污点</span></div><div><b>测量 Gauging</b><span>长度、直径、角度、间距</span></div><div><b>识别</b><span>零件类别、条码、OCR/OCV</span></div><div><b>引导与跟踪</b><span>输出位置和姿态给机器人</span></div><div><b>包装检测</b><span>漏装、错装、标签错误</span></div><div><b>表面/幅面检测</b><span>钢板、纸张、布料连续检测</span></div></div>\n<p><strong>OCR</strong>是把字符图像识别成文本；<strong>OCV</strong>更强调验证印刷内容是否正确。测量类任务必须先标定像素与真实长度的关系，否则只能得到像素单位。</p>\n<div class=\"tip memory\"><strong>应用题通用框架</strong><div>明确目标 → 设计照明和采集 → 预处理 → 分割目标 → 提取任务相关特征 → 判定/测量 → 输出控制信号 → 评估误检漏检与速度。</div></div>\n</div></details><details class=\"qa\" id=\"c1-5\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">5. 期末题目示例与标准答法</span><span class=\"chapter-pill\">综合</span></summary><div class=\"answer\">\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜简述一个机器视觉系统的基本组成与工作流程</div>\n<p><strong>标准答法：</strong>机器视觉系统通常由照明、光学镜头、相机/传感器、图像采集与处理平台、算法软件、通信接口及执行机构构成。工作时先由照明和相机获得稳定图像，再进行增强、去噪等预处理；随后分割目标并提取尺寸、颜色或形状等特征；根据特征完成检测、测量或识别，最后将合格/不合格、位置坐标或控制命令发送给生产设备。</p>\n</div><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜设计“瓶装液位检测”方案</div>\n<ol class=\"steps\"><li>采用背光，使液面边界与背景形成明显对比。</li><li>固定相机和瓶子位置，获取灰度图像。</li><li>在瓶颈附近设置ROI并平滑去噪。</li><li>用阈值或边缘检测找到液面高度。</li><li>与允许范围比较，输出Pass/Fail。</li><li>连续统计误检和漏检，调节阈值、曝光和ROI。</li></ol>\n</div>\n</div></details><section class=\"card memory-card\"><h3>本章最后必须会</h3><div class=\"checklist\"><label><input type=\"checkbox\"> 能完整写出机器视觉定义</label><label><input type=\"checkbox\"> 能区分低级/中级/高级处理</label><label><input type=\"checkbox\"> 能写系统组成与完整流程</label><label><input type=\"checkbox\"> 能列出缺陷、测量、识别、引导等应用</label></div>\n<h4>最容易记反</h4><ul><li>图像处理不是机器视觉的全部；它通常只是低级处理。</li><li>机器视觉输出不一定是“类别”，还可能是尺寸、坐标或控制动作。</li><li>工业系统中稳定照明往往和算法同样重要。</li></ul>\n<h4>口头自测</h4><ol><li>为什么机器视觉强调非接触？</li><li>OCR与OCV有什么区别？</li><li>一个检测系统为什么要先分割再提取特征？</li></ol></section>","2":"<section class=\"card chapter-intro\">\n<div class=\"chapter-kicker\">第2章 · PDF精讲完整版 · 讲义第2—71页</div><h2>针孔相机模型与图像采集</h2>\n<p class=\"priority\">零基础目标：先听懂“它在解决什么问题”，再记公式和算法，最后用题目验证。</p>\n<div class=\"tip memory\"><strong>一句话理解</strong><div>相机把三维世界投影到二维图像。针孔模型给出最基本的几何关系；真实相机还要考虑透镜、光圈、焦距、景深、视场与畸变。</div></div>\n<div class=\"tree-row\"><span>O/P/p/f/Z</span><span>相似三角形</span><span>薄透镜</span><span>F数</span><span>景深</span><span>FOV</span><span>径向畸变</span><span>插值校正</span></div>\n<h4>学习路线</h4><div class=\"flowline\"><span>3D点</span><b>→</b><span>投影中心</span><b>→</b><span>归一化坐标</span><b>→</b><span>像平面</span><b>→</b><span>像素坐标</span><b>→</b><span>真实相机修正</span></div>\n<p class=\"source-note\">页码按上传的中文讲义标注；少量重复页、致谢页或扩展材料不作为主线。</p></section><nav class=\"chapter-toc\"><b>本章分块</b><a href=\"#c2-1\">针孔成像与投影</a><a href=\"#c2-2\">透镜和薄透镜</a><a href=\"#c2-3\">光圈、F数与景深</a><a href=\"#c2-4\">视场角</a><a href=\"#c2-5\">畸变与校正</a><a href=\"#c2-6\">题目示例</a></nav><details class=\"qa\" id=\"c2-1\" open><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">1. 为什么需要针孔？投影公式中的字母到底是什么？</span><span class=\"chapter-pill\">第3—24页</span></summary><div class=\"answer\">\n<p>若直接在物体前放一张感光片，同一物点发出的许多光线会落到不同位置，多个物点的光线相互混合，图像就会模糊。增加一个很小的孔后，每个物点只有一束近似光线通过，位置对应关系变得明确。</p>\n<div class=\"concept-grid\"><div><b>O</b><span>投影中心/针孔/相机光心</span></div><div><b>P(X,Y,Z)</b><span>相机坐标系中的三维点</span></div><div><b>p(x,y)</b><span>P在像平面上的二维投影</span></div><div><b>f</b><span>光心到像平面的距离，即焦距</span></div><div><b>Z</b><span>物点沿光轴方向的深度</span></div><div><b>X、Y</b><span>物点相对光轴的水平、竖直位置</span></div></div>\n<p>用放在光心前方的“虚拟像平面”推导，可避免倒像的负号。由相似三角形：</p>\n<div class=\"formula\">x = fX / Z　　y = fY / Z</div>\n<p>这两个式子说明：在X、Y不变时，Z越大，图像中的x、y越小，物体看起来越小；f越大，投影越大，画面越“放大”。</p>\n<div class=\"tip warn\"><strong>投影丢失什么</strong><div>3D压成2D后，一条经过光心的射线上的许多三维点会投到同一个像素，所以单幅图像一般不能唯一恢复深度、真实长度和三维角度。</div></div>\n</div></details><details class=\"qa\" id=\"c2-2\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">2. 透镜为什么比针孔好？薄透镜公式怎么理解？</span><span class=\"chapter-pill\">第25—31页</span></summary><div class=\"answer\">\n<p>针孔越小，几何模糊越小，但进光量也越少；过小时还会出现衍射。透镜能收集更大范围的光线并把来自某一距离的物点汇聚到像平面上，因此亮度和能量效率更高。</p>\n<div class=\"formula\">1 / d<sub>o</sub> + 1 / d<sub>i</sub> = 1 / f</div>\n<p><strong>d<sub>o</sub></strong>是物距，<strong>d<sub>i</sub></strong>是像距，<strong>f</strong>是焦距。只有满足薄透镜方程的物点才能在当前传感器位置形成清晰点；其他距离的点形成“弥散圆”，产生离焦模糊。</p>\n<div class=\"formula\">放大率 m = - d<sub>i</sub> / d<sub>o</sub></div>\n<p>负号表示真实像倒立。对焦本质是改变镜片组与传感器的相对位置，使目标距离对应的像距落在传感器平面上。变焦镜头通过改变有效焦距改变放大率和视场。</p>\n</div></details><details class=\"qa\" id=\"c2-3\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">3. 光圈、F数、曝光和景深之间的关系</span><span class=\"chapter-pill\">第32—43页</span></summary><div class=\"answer\">\n<div class=\"formula\">F数 N = f / D</div>\n<p>D是光圈有效直径。F数越大，表示孔越小；F数越小，表示孔越大。这是最容易记反的地方。</p>\n<div class=\"table-wrap\"><table><thead><tr><th>变化</th><th>进光量</th><th>景深</th><th>离焦模糊</th><th>可能代价</th></tr></thead><tbody>\n<tr><td>光圈变大 / F数变小</td><td>增加</td><td>变小</td><td>背景更容易虚化</td><td>景深不足、像差可能增加</td></tr>\n<tr><td>光圈变小 / F数变大</td><td>减少</td><td>变大</td><td>更多距离范围清晰</td><td>需要更长曝光；过小会衍射</td></tr>\n</tbody></table></div>\n<p><strong>景深</strong>是物方一段可接受清晰的距离范围，不是“焦点只有一个”的否定，而是弥散圆在允许范围内时人眼认为清晰。一般规律：小光圈、大F数、短焦距、较远对焦距离会增大景深。</p>\n<p>快门时间越长进光越多，但运动物体容易拖影；频闪灯用很短的强光冻结运动。工业视觉通常同时协调光圈、快门、增益和照明，而不是只调一个参数。</p>\n</div></details><details class=\"qa\" id=\"c2-4\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">4. 视场角FOV：为什么焦距长看得窄？</span><span class=\"chapter-pill\">第44—50页</span></summary><div class=\"answer\">\n<p>设传感器有效宽度为W、高度为H，焦距为f，则：</p>\n<div class=\"formula\">θ<sub>h</sub> = 2 arctan(W / 2f)　　θ<sub>v</sub> = 2 arctan(H / 2f)</div>\n<ul><li>焦距f增大，分母增大，视场角减小：长焦看得窄、目标显得大。</li><li>焦距f减小，视场角增大：广角看得宽、透视感更强。</li><li>在焦距相同时，传感器尺寸越大，视场角越大。</li></ul>\n<p>若工作距离为Z，忽略畸变时，水平视野宽度近似为：</p><div class=\"formula\">视野宽度 ≈ ZW / f</div>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜视场角计算</div><p>传感器宽W=12 mm，焦距f=8 mm：</p><div class=\"formula\">θ<sub>h</sub>=2arctan(12/16)≈73.7°</div><p>把焦距改为16 mm，视场角约变为41.1°，所以焦距加倍并不意味着角度简单减半，但视场明显变窄。</p></div>\n</div></details><details class=\"qa\" id=\"c2-5\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">5. 像差、径向畸变与校正</span><span class=\"chapter-pill\">第51—63页</span></summary><div class=\"answer\">\n<p>真实镜头会产生球差、色差、像散等像差。机器视觉中最常见的几何问题是径向畸变：</p>\n<ul><li><strong>桶形畸变：</strong>边缘向外鼓，直线向外弯。</li><li><strong>枕形畸变：</strong>边缘向内收，直线向内弯。</li></ul>\n<div class=\"formula\">x<sub>d</sub> = x(1+k₁r²+k₂r⁴+k₃r⁶)　　y<sub>d</sub> = y(1+k₁r²+k₂r⁴+k₃r⁶)</div>\n<p>其中r²=x²+y²，坐标相对主点计算。畸变越靠近图像边缘越明显。完整模型还可加入切向畸变p₁、p₂。</p>\n<ol class=\"steps\"><li>用棋盘格等标定板估计内参、主点和畸变系数。</li><li>对每个校正后像素反求原畸变图中的采样位置。</li><li>由于位置通常不是整数像素，使用双线性插值取得灰度值。</li></ol>\n<div class=\"tip warn\"><strong>为什么用反向映射</strong><div>若把原图像素正向投到新图，可能出现空洞；从输出像素反查输入位置，可保证每个输出像素都有来源。</div></div>\n</div></details><details class=\"qa\" id=\"c2-6\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">6. 期末题目示例</span><span class=\"chapter-pill\">综合</span></summary><div class=\"answer\"><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜投影坐标计算</div>\n<p>已知三维点P(40 mm, 20 mm, 200 mm)，焦距f=50 mm：</p><div class=\"formula\">x=50×40/200=10 mm，y=50×20/200=5 mm</div><p>若深度变为400 mm，投影变为(5 mm,2.5 mm)，说明深度加倍，像的线性尺寸减半。</p>\n</div><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜解释“为什么光圈不能无限小”</div>\n<p>光圈缩小时几何光线束变窄，离焦模糊减小、景深增大；但进光量减少，需要更长曝光或更高增益，同时孔径过小会出现衍射，使点扩散斑反而变大。因此存在清晰度与亮度之间的折中，不能无限缩小。</p>\n</div><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜景深应用题</div>\n<p>高速生产线上零件高度有波动且都要清晰：优先增加照明强度，在允许曝光时间下适当缩小光圈（增大F数），选择较短焦距并合理提高工作距离，同时避免因过小光圈导致衍射。</p>\n</div></div></details><section class=\"card memory-card\"><h3>本章最后必须会</h3><div class=\"checklist\"><label><input type=\"checkbox\"> 会解释O、P、p、f、X、Y、Z</label><label><input type=\"checkbox\"> 会用x=fX/Z、y=fY/Z计算</label><label><input type=\"checkbox\"> 会写薄透镜公式</label><label><input type=\"checkbox\"> 会判断F数、光圈、景深关系</label><label><input type=\"checkbox\"> 会写FOV公式</label><label><input type=\"checkbox\"> 会解释径向畸变和反向映射</label></div>\n<h4>最容易记反</h4><ul><li>F数大不是光圈大，而是光圈小。</li><li>焦距变长：视场变小、投影变大。</li><li>深度Z越大：投影越小。</li><li>针孔过小也会模糊，因为有衍射。</li></ul>\n<h4>口头自测</h4><ol><li>为什么单目图像有深度歧义？</li><li>如何在进光量与景深间折中？</li><li>为什么畸变校正要插值？</li></ol></section>","3":"<section class=\"card chapter-intro\">\n<div class=\"chapter-kicker\">第3章 · PDF精讲完整版 · 讲义第4—52页</div><h2>图像数字化与表示</h2>\n<p class=\"priority\">零基础目标：先听懂“它在解决什么问题”，再记公式和算法，最后用题目验证。</p>\n<div class=\"tip memory\"><strong>一句话理解</strong><div>连续场景要进入计算机，必须在空间上“取点”形成像素，并把连续亮度“分级”变成有限整数；这就是采样和量化。</div></div>\n<div class=\"tree-row\"><span>人眼</span><span>f=i·r</span><span>M×N矩阵</span><span>L=2^k</span><span>4/8邻域</span><span>距离</span><span>最近邻/双线性</span><span>RAW/BMP/PNG/JPEG</span></div>\n<h4>学习路线</h4><div class=\"flowline\"><span>光照与反射</span><b>→</b><span>传感器</span><b>→</b><span>采样</span><b>→</b><span>量化</span><b>→</b><span>像素矩阵</span><b>→</b><span>邻域关系</span><b>→</b><span>编码与压缩</span></div>\n<p class=\"source-note\">页码按上传的中文讲义标注；少量重复页、致谢页或扩展材料不作为主线。</p></section><nav class=\"chapter-toc\"><b>本章分块</b><a href=\"#c3-1\">人眼与数字成像</a><a href=\"#c3-2\">采样与量化</a><a href=\"#c3-3\">矩阵与存储量</a><a href=\"#c3-4\">邻域、连通与距离</a><a href=\"#c3-5\">缩放插值</a><a href=\"#c3-6\">文件格式与JPEG</a></nav><details class=\"qa\" id=\"c3-1\" open><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">1. 人眼视觉、光谱与数字图像获取</span><span class=\"chapter-pill\">第4—16页</span></summary><div class=\"answer\">\n<p>可见光约位于400—700 nm。人眼视网膜中，<strong>视杆细胞</strong>对弱光敏感、主要感受亮暗；<strong>视锥细胞</strong>在明视觉下工作，负责颜色和精细分辨，中央凹视锥密度最高。</p>\n<p>一幅场景图像常写成照明和反射的乘积：</p><div class=\"formula\">f(x,y)=i(x,y)·r(x,y)，　i(x,y)&gt;0，　0≤r(x,y)≤1</div>\n<p>i表示照到物体上的能量，r表示物体反射比例。阴影可能来自i减小，并不一定是物体颜色r改变；这也是光照变化会影响分割和识别的原因。</p>\n<div class=\"mega-route\"><div><b>场景</b><span>照明×反射</span></div><b>→</b><div><b>光学系统</b><span>形成连续像</span></div><b>→</b><div><b>传感器</b><span>光转电</span></div><b>→</b><div><b>采样量化</b><span>数字矩阵</span></div></div>\n</div></details><details class=\"qa\" id=\"c3-2\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">2. 采样与量化：一个决定清不清，一个决定细不细</span><span class=\"chapter-pill\">第17—23页</span></summary><div class=\"answer\">\n<div class=\"table-wrap\"><table><thead><tr><th>步骤</th><th>作用</th><th>不足时的现象</th></tr></thead><tbody>\n<tr><td>采样</td><td>把连续空间离散成M×N个像素</td><td>空间分辨率低、锯齿、细节丢失、混叠</td></tr>\n<tr><td>量化</td><td>把连续强度离散成L个灰度级</td><td>灰度层次少、假轮廓、渐变不平滑</td></tr>\n</tbody></table></div>\n<div class=\"formula\">k bit → L=2<sup>k</sup> 个灰度级</div>\n<p>例如8位灰度图有256级，通常范围0—255；4位只有16级。低频平滑区域更容易看到量化造成的假轮廓，因为本来应连续变化的灰度被分成明显台阶。</p>\n<div class=\"tip memory\"><strong>记忆</strong><div>采样问“有多少格”；量化问“每格有多少种数值”。空间分辨率由像素密度决定，灰度分辨率由位数决定。</div></div>\n</div></details><details class=\"qa\" id=\"c3-3\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">3. 数字图像如何表示？存储量怎么算？</span><span class=\"chapter-pill\">第14—23页</span></summary><div class=\"answer\">\n<p>灰度图像是M×N矩阵，每个元素f(x,y)是一个像素灰度。彩色RGB图像可看作M×N×3数组。</p>\n<div class=\"formula\">未压缩灰度图存储位数 b = M × N × k</div>\n<p>若要换成字节，再除以8；换成KB通常除以1024。RGB每通道8位时，每像素24 bit。</p>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜存储量计算</div><p>1024×768、8位灰度图：</p><div class=\"formula\">1024×768×8 bit = 786432 byte = 768 KB</div><p>若为24位RGB，未压缩数据量为2304 KB。</p></div>\n<p>图像坐标通常以左上角为原点，x向右、y向下；数学坐标常以左下或中心为原点，y向上。做几何变换时必须先确认坐标约定。</p>\n</div></details><details class=\"qa\" id=\"c3-4\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">4. 像素邻域、连通性与距离</span><span class=\"chapter-pill\">第24—28页</span></summary><div class=\"answer\">\n<p>对像素p(x,y)：</p>\n<div class=\"formula-stack\"><div>N₄(p)={(x±1,y),(x,y±1)}</div><div>N<sub>D</sub>(p)={(x±1,y±1)}</div><div>N₈(p)=N₄(p)∪N<sub>D</sub>(p)</div></div>\n<p>连通性不仅要求几何相邻，还要求像素值属于指定集合V，例如二值图像中的前景值1。4连通较严格，8连通允许对角相连。m连通用于避免对角连接造成的歧义。</p>\n<div class=\"formula-stack\"><div>欧氏距离 D<sub>E</sub>=√[(x-s)²+(y-t)²]</div><div>城市街区距离 D₄=|x-s|+|y-t|</div><div>棋盘距离 D₈=max(|x-s|,|y-t|)</div></div>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜距离计算</div><p>p(2,3)，q(7,5)：D₄=5+2=7；D₈=max(5,2)=5；D<sub>E</sub>=√29。</p></div></div></details><details class=\"qa\" id=\"c3-5\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">5. 图像放大为什么需要插值？</span><span class=\"chapter-pill\">缩放相关内容及第5章插值页</span></summary><div class=\"answer\">\n<p>几何变换后，输出像素反查到输入图像的位置通常不是整数坐标，因此需要估计该位置的灰度。</p>\n<div class=\"table-wrap\"><table><thead><tr><th>方法</th><th>原理</th><th>优缺点</th></tr></thead><tbody>\n<tr><td>最近邻</td><td>取距离最近的一个像素</td><td>最快、保留原值，但锯齿和块状明显</td></tr>\n<tr><td>双线性</td><td>用周围4点按水平和竖直距离加权</td><td>平滑、常用，但稍微模糊</td></tr>\n<tr><td>双三次</td><td>利用周围16点的三次函数</td><td>质量更好，计算更大，可能有过冲</td></tr>\n</tbody></table></div>\n<div class=\"formula\">f(x,y)≈(1-a)(1-b)f₀₀+a(1-b)f₁₀+(1-a)bf₀₁+abf₁₁</div>\n<p>a、b是目标点在四邻像素方格内的横纵小数比例。</p>\n</div></details><details class=\"qa\" id=\"c3-6\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">6. 图像文件格式与JPEG质量因数</span><span class=\"chapter-pill\">第27—51页</span></summary><div class=\"answer\">\n<div class=\"table-wrap\"><table><thead><tr><th>格式</th><th>压缩/特点</th><th>适合场景</th></tr></thead><tbody>\n<tr><td>RAW</td><td>传感器原始数据，信息多、文件大、厂商相关</td><td>后期与高精度视觉</td></tr>\n<tr><td>BMP</td><td>通常无压缩或简单压缩，结构直接、体积大</td><td>教学、Windows位图、程序中间数据</td></tr>\n<tr><td>TIFF</td><td>可无损，支持高位深与元数据，文件较大</td><td>印刷、医学、科学图像</td></tr>\n<tr><td>GIF</td><td>无损LZW但最多256色，支持动画和透明</td><td>图标、简单动画</td></tr>\n<tr><td>PNG</td><td>无损，支持Alpha透明</td><td>截图、线条、网页图形</td></tr>\n<tr><td>JPEG</td><td>有损、压缩率高，不支持透明</td><td>自然照片</td></tr>\n</tbody></table></div>\n<p>JPEG大致经历颜色变换、分块、DCT、量化、熵编码。<strong>质量因数q</strong>控制量化强度：质量越高，量化越弱、文件越大、细节保留越多；质量越低，量化越强、文件越小，但会出现8×8块效应、振铃和细节损失。</p>\n<div class=\"tip warn\"><strong>不要误解</strong><div>JPEG解压后仍可得到每个像素，但被量化丢掉的高频信息无法恢复，所以它是有损压缩。</div></div>\n</div></details><section class=\"card memory-card\"><h3>本章最后必须会</h3><div class=\"checklist\"><label><input type=\"checkbox\"> 能区分采样和量化</label><label><input type=\"checkbox\"> 会算L=2^k及未压缩存储量</label><label><input type=\"checkbox\"> 会写4/8邻域和三种距离</label><label><input type=\"checkbox\"> 会比较最近邻与双线性</label><label><input type=\"checkbox\"> 会选择RAW/BMP/PNG/JPEG</label></div>\n<h4>最容易记反</h4><ul><li>像素数量多不等于灰度级多。</li><li>无损压缩不是“不压缩”。</li><li>PNG适合无损图形，JPEG适合照片。</li><li>8连通会把对角像素视为连通。</li></ul>\n<h4>口头自测</h4><ol><li>8位与4位图的量化差异是什么？</li><li>为什么平滑渐变区域容易出现假轮廓？</li><li>JPEG质量降低后为什么有块效应？</li></ol></section>","4":"<section class=\"card chapter-intro\">\n<div class=\"chapter-kicker\">第4章 · PDF精讲完整版 · 讲义标注第2—226页（PDF共257页）</div><h2>图像增强：灰度、直方图、空间与频率滤波</h2>\n<p class=\"priority\">零基础目标：先听懂“它在解决什么问题”，再记公式和算法，最后用题目验证。</p>\n<div class=\"tip memory\"><strong>一句话理解</strong><div>图像增强不是把图像“变漂亮”，而是针对任务突出有用信息、抑制噪声。空间域直接改像素，频率域先分解成不同频率再处理。</div></div>\n<div class=\"tree-row\"><span>s=T(r)</span><span>负片/对数/Gamma</span><span>CDF均衡</span><span>图像加减</span><span>卷积</span><span>均值/中值/高斯</span><span>Laplacian/Sobel</span><span>DFT</span><span>低通/高通/带阻/同态</span></div>\n<h4>学习路线</h4><div class=\"flowline\"><span>问题与图像</span><b>→</b><span>选择增强方法</span><b>→</b><span>控制噪声与细节</span><b>→</b><span>得到适合后续检测的图像</span></div>\n<p class=\"source-note\">页码按上传的中文讲义标注；少量重复页、致谢页或扩展材料不作为主线。</p></section><nav class=\"chapter-toc\"><b>本章分块</b><a href=\"#c4-1\">增强总览</a><a href=\"#c4-2\">灰度变换</a><a href=\"#c4-3\">直方图处理</a><a href=\"#c4-4\">算术逻辑运算</a><a href=\"#c4-5\">空间平滑</a><a href=\"#c4-6\">空间锐化</a><a href=\"#c4-7\">傅里叶与频域滤波</a><a href=\"#c4-8\">综合题</a></nav><details class=\"qa\" id=\"c4-1\" open><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">1. 图像增强总览：为什么没有万能算法？</span><span class=\"chapter-pill\">第2—7页</span></summary><div class=\"answer\">\n<p>增强的目标由任务决定：医学图像可能强调微弱组织差异；工业检测可能强调裂纹边缘；人像处理可能优先抑制噪声并保留轮廓。因此同一幅图在不同任务中的“好结果”不同。</p>\n<div class=\"table-wrap\"><table><thead><tr><th>空间域</th><th>频率域</th></tr></thead><tbody><tr><td>直接对f(x,y)的像素或邻域操作</td><td>先做傅里叶变换得到F(u,v)，乘滤波器H(u,v)，再逆变换</td></tr><tr><td>直观、局部处理方便</td><td>适合分析周期噪声、低频/高频成分</td></tr></tbody></table></div>\n<div class=\"formula\">g(x,y)=T[f(x,y)]</div><p>若T只作用于单个像素，是灰度点变换；若T覆盖w×h邻域，是空间滤波。</p>\n</div></details><details class=\"qa\" id=\"c4-2\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">2. 基本灰度变换：每条曲线在“搬运”哪些灰度？</span><span class=\"chapter-pill\">第8—32页</span></summary><div class=\"answer\">\n<h4>负片变换</h4><div class=\"formula\">s=L-1-r</div><p>把黑白反转，适合从大面积暗背景中突出白色或灰色细节。</p>\n<h4>对数变换</h4><div class=\"formula\">s=c·log(1+r)</div><p>扩展低灰度、压缩高灰度，常用于显示动态范围很大的傅里叶频谱。</p>\n<h4>Gamma变换</h4><div class=\"formula\">s=c·r<sup>γ</sup>（通常先把r归一化到0—1）</div>\n<ul><li>γ&lt;1：输出大于输入，暗部被拉开，图像提亮。</li><li>γ&gt;1：输出小于输入，图像压暗，可增强亮区层次。</li><li>γ=1：恒等变换。</li></ul>\n<h4>分段线性与灰度切片</h4><p>用户指定若干控制点，在不同灰度段使用不同斜率。斜率大于1的区间被拉伸，斜率小于1的区间被压缩；阈值化是极端的分段变换。</p>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜Gamma手算</div><p>归一化灰度r=0.25，γ=0.5：</p><div class=\"formula\">s=√0.25=0.5</div><p>输出变大，所以暗像素变亮。若γ=2，则s=0.0625，明显变暗。</p></div>\n</div></details><details class=\"qa\" id=\"c4-3\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">3. 直方图与均衡化：五步一定要会手算</span><span class=\"chapter-pill\">第33—53页</span></summary><div class=\"answer\">\n<p>直方图h(r<sub>k</sub>)统计灰度r<sub>k</sub>出现的像素数；归一化后p(r<sub>k</sub>)=n<sub>k</sub>/MN，可看成灰度概率。</p>\n<ol class=\"steps\"><li>统计每个灰度级像素数n<sub>k</sub>。</li><li>归一化：p(r<sub>k</sub>)=n<sub>k</sub>/MN。</li><li>累加得到CDF：C(r<sub>k</sub>)=Σ<sub>j≤k</sub>p(r<sub>j</sub>)。</li><li>映射：s<sub>k</sub>=round[(L-1)C(r<sub>k</sub>)]。</li><li>用新灰度替换原像素并合并映射到同一灰度的计数。</li></ol>\n<div class=\"tip memory\"><strong>本质</strong><div>CDF单调递增，把原来集中在较窄范围的灰度映射到更宽范围，从而提高全局对比度；离散图像均衡后不一定完全均匀。</div></div>\n<h4>局部与自适应均衡</h4><p>AHE在每个邻域计算映射，可增强局部细节，但会放大平坦区域噪声；CLAHE通过限制直方图峰值抑制过度增强。</p>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜4级灰度均衡</div><p>灰度0,1,2,3的概率为0.25,0.25,0.5,0，L=4。CDF为0.25,0.5,1,1，映射近似为1,2,3,3。原灰度2全部映射为3。</p></div></div></details><details class=\"qa\" id=\"c4-4\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">4. 图像加减乘除与逻辑运算</span><span class=\"chapter-pill\">第54—68页</span></summary><div class=\"answer\">\n<ul><li><strong>加法：</strong>图像叠加；多幅独立零均值噪声图像取平均可降噪，噪声标准差约降为原来的1/√K。</li><li><strong>减法：</strong>变化检测、背景差分、医学图像差分。要防止负值和溢出。</li><li><strong>乘法：</strong>掩膜ROI、亮度缩放。</li><li><strong>除法：</strong>阴影/照明校正，但分母接近0时不稳定。</li><li><strong>AND/OR/NOT/XOR：</strong>二值区域组合、掩膜、变化区域提取。</li></ul>\n<p>8位图运算时不要直接让结果在uint8中回绕；通常先转换为更大范围或浮点类型，再截断/归一化到0—255。</p>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜20幅高斯噪声图平均</div><p>若每幅图的噪声相互独立、均值为0，像素平均后信号不变，噪声方差变为原来的1/20，标准差变为原来的1/√20。该方法要求图像严格配准。</p></div></div></details><details class=\"qa\" id=\"c4-5\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">5. 空间平滑：卷积、边界处理与滤波器选择</span><span class=\"chapter-pill\">第69—104页</span></summary><div class=\"answer\">\n<p><strong>相关</strong>直接滑动核；<strong>卷积</strong>先把核旋转180°再滑动。对中心对称核（均值、高斯、拉普拉斯）两者结果相同。</p>\n<div class=\"formula\">g(x,y)=ΣΣ w(s,t)f(x-s,y-t)</div>\n<div class=\"table-wrap\"><table><thead><tr><th>滤波器</th><th>适合</th><th>主要问题</th></tr></thead><tbody>\n<tr><td>均值/盒式</td><td>随机噪声、简单平滑</td><td>边缘模糊，对椒盐噪声效果差</td></tr>\n<tr><td>高斯</td><td>高斯噪声、边缘检测前平滑</td><td>仍会模糊，σ越大越平滑</td></tr>\n<tr><td>中值</td><td>椒盐噪声</td><td>非线性；窗口过大会损失细线</td></tr>\n<tr><td>最小值</td><td>去除白色盐噪声</td><td>使亮区域缩小</td></tr>\n<tr><td>最大值</td><td>去除黑色椒噪声</td><td>使亮区域扩张</td></tr>\n</tbody></table></div>\n<h4>边界处理</h4><p>常见方法：零填充、复制边界、镜像反射、循环填充。零填充会让边缘变暗；复制和反射通常更自然；循环适合周期信号但可能把另一侧内容接过来。</p>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜3×3均值卷积</div><p>邻域为[10,10,10;10,100,10;10,10,10]，均值=(8×10+100)/9=20。脉冲100被压低，但周围也被抬高，说明均值会把异常扩散。</p></div></div></details><details class=\"qa\" id=\"c4-6\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">6. 空间锐化：一阶梯度和二阶拉普拉斯</span><span class=\"chapter-pill\">第105—143页</span></summary><div class=\"answer\">\n<p>锐化强调灰度快速变化，即边缘和细节。导数也会放大噪声，所以通常先平滑。</p>\n<div class=\"formula\">∇f=[G<sub>x</sub>,G<sub>y</sub>]<sup>T</sup>，|∇f|=√(G<sub>x</sub>²+G<sub>y</sub>²)≈|G<sub>x</sub>|+|G<sub>y</sub>|</div>\n<pre class=\"matrix\">Sobel Gx（检测竖直边缘）     Sobel Gy（检测水平边缘）\n-1  0  1                    -1 -2 -1\n-2  0  2                     0  0  0\n-1  0  1                     1  2  1</pre>\n<p>名称Gx表示计算x方向灰度变化，所以对左右不同的<strong>竖直边缘</strong>响应大；Gy对上下不同的水平边缘响应大。</p>\n<div class=\"formula\">∇²f≈f(x+1,y)+f(x-1,y)+f(x,y+1)+f(x,y-1)-4f(x,y)</div>\n<pre class=\"matrix\">常用拉普拉斯核（中心为正）\n 0 -1  0\n-1  4 -1\n 0 -1  0</pre>\n<p>若核中心为正，增强常写g=f+c∇²f；若中心为负，通常写g=f-c∇²f，关键是让边缘细节加回原图。二阶导数对细线和孤立点更敏感，阶跃边缘会产生双响应。</p>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜为什么先平滑再锐化</div><p>噪声本身包含快速变化，导数会把噪声当作高频细节放大。先用较小高斯滤波抑制噪声，再计算梯度或拉普拉斯，可以提高边缘响应的可靠性；但平滑过强会让真实边缘变弱。</p></div></div></details><details class=\"qa\" id=\"c4-7\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">7. 傅里叶变换与频率域滤波</span><span class=\"chapter-pill\">标注第144—226页</span></summary><div class=\"answer\">\n<p>傅里叶思想：把图像表示为许多不同方向、不同频率的正弦/余弦分量。缓慢变化的背景属于低频；边缘、纹理和噪声通常含较多高频。</p>\n<div class=\"formula\">G(u,v)=H(u,v)F(u,v)，　g(x,y)=IDFT{G(u,v)}</div>\n<ol class=\"steps\"><li>必要时乘(-1)<sup>x+y</sup>把低频移到频谱中心。</li><li>对图像做DFT得到复数频谱F。</li><li>设计滤波器H并逐点相乘。</li><li>逆DFT返回空间域，取实部并归一化。</li></ol>\n<div class=\"table-wrap\"><table><thead><tr><th>滤波器</th><th>作用</th><th>特点</th></tr></thead><tbody>\n<tr><td>理想低通</td><td>保留D≤D₀</td><td>截止陡峭，空间域易振铃</td></tr>\n<tr><td>巴特沃斯低通</td><td>平滑过渡</td><td>阶数n越大越接近理想</td></tr>\n<tr><td>高斯低通</td><td>高斯衰减</td><td>无明显振铃，平滑自然</td></tr>\n<tr><td>高通/高频强调</td><td>增强边缘细节</td><td>高频强调保留部分低频与平均亮度</td></tr>\n<tr><td>带阻/陷波</td><td>去周期噪声</td><td>在频谱亮点处成对设置陷波</td></tr>\n<tr><td>同态滤波</td><td>压低照明低频、增强反射高频</td><td>先对数把乘法模型变加法</td></tr>\n</tbody></table></div>\n<div class=\"tip warn\"><strong>频谱显示</strong><div>幅度范围很大，直接显示常只见一个亮点，因此常用log(1+|F|)压缩动态范围。</div></div>\n</div></details><details class=\"qa\" id=\"c4-8\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">8. 综合增强应用题怎么写完整算法？</span><span class=\"chapter-pill\">综合</span></summary><div class=\"answer\"><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜胸部X光综合增强</div>\n<ol class=\"steps\"><li>读取灰度图并检查动态范围和噪声。</li><li>用中值/高斯或边缘保持滤波轻度去噪。</li><li>采用CLAHE增强局部对比度，避免全局均衡过度放大。</li><li>用反锐化掩蔽或拉普拉斯增强骨骼细节。</li><li>对结果限幅并与原图比较直方图、边缘和噪声。</li></ol><p><strong>分析：</strong>去噪与锐化存在冲突；参数过大会出现噪声放大、光晕或骨骼边缘过冲。</p>\n</div><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜周期噪声去除</div>\n<ol class=\"steps\"><li>DFT并中心化，显示对数幅度谱。</li><li>周期条纹在频谱中形成关于中心对称的离散亮点。</li><li>在亮点处设计陷波带阻滤波器，保留直流与主要图像频率。</li><li>逆变换并比较条纹抑制和细节损失。</li></ol>\n</div></div></details><section class=\"card memory-card\"><h3>本章最后必须会</h3><div class=\"checklist\"><label><input type=\"checkbox\"> 会判断γ&lt;1提亮、γ&gt;1压暗</label><label><input type=\"checkbox\"> 会完整手算直方图均衡</label><label><input type=\"checkbox\"> 会选择均值/高斯/中值</label><label><input type=\"checkbox\"> 会写Sobel和Laplacian核</label><label><input type=\"checkbox\"> 会解释低通平滑、高通锐化</label><label><input type=\"checkbox\"> 会写频域滤波流程</label></div>\n<h4>最容易记反</h4><ul><li>导数会放大噪声。</li><li>Gx检测的是x方向变化，通常突出竖直边缘。</li><li>低通不是“让低灰度通过”，而是让低频通过。</li><li>均衡后直方图不一定完全平坦。</li></ul>\n<h4>口头自测</h4><ol><li>为什么中值适合椒盐噪声？</li><li>理想低通为什么有振铃？</li><li>同态滤波为什么先取对数？</li></ol></section>","5":"<section class=\"card chapter-intro\">\n<div class=\"chapter-kicker\">第5章 · PDF精讲完整版 · 讲义第3—113页</div><h2>仿射变换、投影变换与图像变换</h2>\n<p class=\"priority\">零基础目标：先听懂“它在解决什么问题”，再记公式和算法，最后用题目验证。</p>\n<div class=\"tip memory\"><strong>一句话理解</strong><div>滤波改变像素值，几何变换改变像素位置。齐次坐标把平移、旋转、缩放、仿射和投影统一成矩阵乘法。</div></div>\n<div class=\"tree-row\"><span>平移</span><span>旋转</span><span>缩放</span><span>剪切</span><span>齐次坐标</span><span>复合矩阵</span><span>仿射6自由度</span><span>单应性8自由度</span><span>逆向映射</span><span>最近邻/双线性</span></div>\n<h4>学习路线</h4><div class=\"flowline\"><span>确定几何模型</span><b>→</b><span>建立矩阵</span><b>→</b><span>组合变换</span><b>→</b><span>坐标映射</span><b>→</b><span>插值填充</span><b>→</b><span>得到新图像</span></div>\n<p class=\"source-note\">页码按上传的中文讲义标注；少量重复页、致谢页或扩展材料不作为主线。</p></section><nav class=\"chapter-toc\"><b>本章分块</b><a href=\"#c5-1\">几何变换总览</a><a href=\"#c5-2\">基本仿射变换</a><a href=\"#c5-3\">齐次坐标</a><a href=\"#c5-4\">复合顺序</a><a href=\"#c5-5\">单应性</a><a href=\"#c5-6\">图像映射与插值</a><a href=\"#c5-7\">题目示例</a></nav><details class=\"qa\" id=\"c5-1\" open><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">1. 为什么要做几何变换？二维变换层级</span><span class=\"chapter-pill\">第3—18页</span></summary><div class=\"answer\">\n<p>全景拼接、图像校正、地图投影和纹理映射都需要把一幅图像“扭”到另一坐标系。几何变换保持或改变的几何性质不同：</p>\n<div class=\"table-wrap\"><table><thead><tr><th>变换</th><th>自由度</th><th>保持性质</th></tr></thead><tbody>\n<tr><td>平移</td><td>2</td><td>长度、角度、平行、形状</td></tr><tr><td>欧氏/刚体</td><td>3</td><td>长度、角度、平行</td></tr><tr><td>相似</td><td>4</td><td>角度、形状比例、平行</td></tr><tr><td>仿射</td><td>6</td><td>直线、平行、共线、比例关系</td></tr><tr><td>投影/单应</td><td>8</td><td>直线与共线关系；平行不一定保持</td></tr></tbody></table></div>\n<p>从左到右模型能力增强，需要估计的参数更多，也更容易过拟合或受噪声影响。</p>\n</div></details><details class=\"qa\" id=\"c5-2\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">2. 平移、缩放、旋转和剪切矩阵</span><span class=\"chapter-pill\">第19—40页</span></summary><div class=\"answer\">\n<pre class=\"matrix\">平移 T = [1 0 tx; 0 1 ty; 0 0 1]\n缩放 S = [sx 0 0; 0 sy 0; 0 0 1]\n旋转 R = [cosθ -sinθ 0; sinθ cosθ 0; 0 0 1]\n剪切 Hx = [1 hx 0; 0 1 0; 0 0 1]</pre>\n<p>在数学坐标系中，正角通常表示逆时针旋转；图像坐标y向下时，视觉方向可能相反，要根据坐标约定判断。</p>\n<p>2×2线性部分A可同时包含旋转、缩放、剪切和反射，平移由向量t表示：</p><div class=\"formula\">p′=Ap+t</div>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜点坐标变换</div><p>点p=(1,2)，先放大2倍，再逆时针旋转90°，再平移(5,3)：放大得(2,4)，旋转得(-4,2)，平移得(1,5)。</p></div></div></details><details class=\"qa\" id=\"c5-3\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">3. 齐次坐标为什么能表示平移？</span><span class=\"chapter-pill\">第41—55页</span></summary><div class=\"answer\">\n<p>二维笛卡尔点(X,Y)写成齐次坐标(x,y,w)，只要w≠0：</p><div class=\"formula\">X=x/w，Y=y/w；　(X,Y)↔(X,Y,1)</div>\n<p>(x,y,w)与(kx,ky,kw)表示同一个点，所以齐次坐标有尺度不唯一性。w=0可表示无穷远方向，这对投影几何很重要。</p>\n<p>使用3×3矩阵后，平移成为普通矩阵乘法：</p><div class=\"formula\">[x′ y′ 1]<sup>T</sup>=T[x y 1]<sup>T</sup></div>\n<div class=\"tip memory\"><strong>价值</strong><div>统一表达所有二维几何变换；多个变换可预先连乘成一个矩阵；投影变换中的除法可由最后一个齐次分量实现。</div></div>\n</div></details><details class=\"qa\" id=\"c5-4\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">4. 复合变换：顺序为什么不能交换？</span><span class=\"chapter-pill\">第51—61页</span></summary><div class=\"answer\">\n<p>采用列向量时，最右边的矩阵最先作用。若“先缩放S，再旋转R，再平移T”：</p><div class=\"formula\">p′=T R S p</div>\n<p>通常RS≠SR，RT≠TR。例如绕原点旋转后再平移，与先平移再绕原点旋转，轨迹不同。</p>\n<h4>绕任意点c=(c<sub>x</sub>,c<sub>y</sub>)旋转</h4>\n<div class=\"formula\">M=T(c<sub>x</sub>,c<sub>y</sub>) · R(θ) · T(-c<sub>x</sub>,-c<sub>y</sub>)</div>\n<ol class=\"steps\"><li>把旋转中心平移到原点。</li><li>绕原点旋转。</li><li>把坐标平移回去。</li></ol>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜复合矩阵判断</div><p>题目说“点先旋转再平移”，列向量写法为T·R·p，而不是R·T·p。判断时直接从右向左读。</p></div></div></details><details class=\"qa\" id=\"c5-5\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">5. 投影变换与单应性H</span><span class=\"chapter-pill\">第62—85页</span></summary><div class=\"answer\">\n<p>平面到平面的投影关系可用3×3单应矩阵H表示：</p>\n<div class=\"formula\">s[x′ y′ 1]<sup>T</sup> = H[x y 1]<sup>T</sup></div>\n<div class=\"formula\">x′=(h₁₁x+h₁₂y+h₁₃)/(h₃₁x+h₃₂y+h₃₃)，　y′=(h₂₁x+h₂₂y+h₂₃)/(h₃₁x+h₃₂y+h₃₃)</div>\n<p>H有9个元素，但整体乘任意非零尺度不改变映射，所以只有8个自由度。每对对应点给出两个独立方程，因此至少需要4对不共线点。</p>\n<p>单应性适合：同一平面、相机纯旋转、远景近似平面等。若场景有明显不同深度且相机发生平移，仅一个H不能同时对齐所有物体，会出现视差错位。</p>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜为什么至少4对点</div><p>H有8个独立未知量；一对点提供x′、y′两个方程；4对点提供8个方程。点不能退化为共线配置，否则方程组不能唯一确定H。</p></div></div></details><details class=\"qa\" id=\"c5-6\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">6. 正向映射、逆向映射与插值</span><span class=\"chapter-pill\">第86—113页</span></summary><div class=\"answer\">\n<p><strong>正向映射：</strong>把每个输入像素送到输出位置，简单但会因坐标取整产生空洞和重叠。<strong>逆向映射：</strong>遍历每个输出像素，用M⁻¹求其来源位置，能保证输出像素都有值，因此实际更常用。</p>\n<div class=\"formula\">p<sub>in</sub>=M⁻¹p<sub>out</sub></div>\n<p>来源位置多为小数，需最近邻、双线性或双三次插值。最近邻保留离散标签，适合分割掩膜；双线性适合一般灰度和彩色图；高质量缩放可用双三次。</p>\n<div class=\"tip warn\"><strong>标签图注意</strong><div>语义分割标签、类别掩膜不能用双线性，否则会产生不存在的中间类别，应使用最近邻。</div></div>\n</div></details><details class=\"qa\" id=\"c5-7\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">7. 期末题目示例</span><span class=\"chapter-pill\">综合</span></summary><div class=\"answer\"><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜求仿射变换需要几对点？</div><p>二维仿射有6个未知参数，每对对应点给两个方程，因此理论上至少3对不共线点。投影单应性则至少4对不共线点。</p></div><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜图像放大比较</div><p>80×60放大到800×600，缩放倍数均为10。最近邻边缘呈台阶和马赛克；双线性边缘平滑但会模糊。报告应截取边缘局部比较，并说明速度与质量权衡。</p></div><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜全景拼接算法流程</div><ol class=\"steps\"><li>提取并匹配重叠区域特征。</li><li>用RANSAC去除误匹配，估计单应性H。</li><li>逆向映射将一幅图扭到另一坐标系。</li><li>确定画布并进行曝光补偿和接缝融合。</li></ol></div></div></details><section class=\"card memory-card\"><h3>本章最后必须会</h3><div class=\"checklist\"><label><input type=\"checkbox\"> 会默写平移/旋转/缩放矩阵</label><label><input type=\"checkbox\"> 会从右向左读复合变换</label><label><input type=\"checkbox\"> 会写绕任意点旋转矩阵</label><label><input type=\"checkbox\"> 知道仿射6自由度、单应8自由度</label><label><input type=\"checkbox\"> 会写单应投影公式</label><label><input type=\"checkbox\"> 会解释逆向映射和插值</label></div>\n<h4>最容易记反</h4><ul><li>仿射保持平行，投影不保持平行。</li><li>单应性不是任意3D场景的万能对齐。</li><li>列向量时最右矩阵先执行。</li><li>标签图插值用最近邻。</li></ul>\n<h4>口头自测</h4><ol><li>三对点为什么能求仿射？</li><li>平行线在单应变换后还一定平行吗？</li><li>为什么正向映射会出现空洞？</li></ol></section>","6":"<section class=\"card chapter-intro\">\n<div class=\"chapter-kicker\">第6章 · PDF精讲完整版 · 讲义第5—100页为主</div><h2>彩色图像基础与处理</h2>\n<p class=\"priority\">零基础目标：先听懂“它在解决什么问题”，再记公式和算法，最后用题目验证。</p>\n<div class=\"tip memory\"><strong>一句话理解</strong><div>颜色不仅是三通道数值，它还可分成色调、饱和度和亮度。选择合适颜色空间，往往能把“颜色目标”与“光照变化”分开处理。</div></div>\n<div class=\"tree-row\"><span>三色理论</span><span>亮度/色调/饱和度</span><span>RGB</span><span>CMY/CMYK</span><span>HSI</span><span>伪彩色</span><span>颜色切片</span><span>彩色平滑</span><span>彩色分割</span></div>\n<h4>学习路线</h4><div class=\"flowline\"><span>理解颜色</span><b>→</b><span>选择颜色空间</span><b>→</b><span>分离亮度/色度</span><b>→</b><span>处理或分割</span><b>→</b><span>转换回显示空间</span></div>\n<p class=\"source-note\">页码按上传的中文讲义标注；少量重复页、致谢页或扩展材料不作为主线。</p></section><nav class=\"chapter-toc\"><b>本章分块</b><a href=\"#c6-1\">颜色基础</a><a href=\"#c6-2\">RGB与CMY/CMYK</a><a href=\"#c6-3\">HSI</a><a href=\"#c6-4\">伪彩色</a><a href=\"#c6-5\">全彩色与颜色变换</a><a href=\"#c6-6\">平滑锐化与分割</a><a href=\"#c6-7\">作业题</a></nav><details class=\"qa\" id=\"c6-1\" open><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">1. 颜色的物理与感知：亮度、色调、饱和度</span><span class=\"chapter-pill\">第5—20页</span></summary><div class=\"answer\">\n<p>白光可由棱镜分解为连续光谱。人眼的L、M、S三类视锥对长、中、短波段响应不同，因此颜色视觉可用三维量描述。</p>\n<div class=\"concept-grid\"><div><b>亮度/强度</b><span>颜色有多亮，接近黑—灰—白轴</span></div><div><b>色调 Hue</b><span>主导波长对应的颜色类别，如红、绿、蓝</span></div><div><b>饱和度 Saturation</b><span>颜色纯度；混入白光越多，饱和度越低</span></div></div>\n<p>色调和饱和度合称色度。CIE三刺激值X、Y、Z归一化：</p><div class=\"formula\">x=X/(X+Y+Z)，y=Y/(X+Y+Z)，z=1-x-y</div>\n<p>CIE色度图描述可见颜色和设备色域；显示器与打印机能表示的颜色范围只是色度图的一部分。</p>\n</div></details><details class=\"qa\" id=\"c6-2\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">2. RGB与CMY/CMYK：加色和减色不要混</span><span class=\"chapter-pill\">第21—34页</span></summary><div class=\"answer\">\n<p><strong>RGB加色模型</strong>适合发光设备和相机：黑色(0,0,0)，白色(1,1,1)或(255,255,255)。红+绿=黄，绿+蓝=青，红+蓝=品红。</p>\n<p><strong>CMY减色模型</strong>适合颜料和打印：青吸收红、品红吸收绿、黄吸收蓝。归一化时：</p><div class=\"formula\">C=1-R，M=1-G，Y=1-B</div>\n<p>理论上C=M=Y=1应得到黑色，但实际油墨叠加不够纯且耗墨，因此增加K黑色通道形成CMYK。</p>\n<div class=\"formula\">24位RGB颜色数 = 2<sup>24</sup> = 16,777,216</div>\n</div></details><details class=\"qa\" id=\"c6-3\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">3. HSI模型：为什么更适合按颜色分割？</span><span class=\"chapter-pill\">第35—47页</span></summary><div class=\"answer\">\n<p>HSI把色调H、饱和度S、强度I分开。强度：</p><div class=\"formula\">I=(R+G+B)/3</div>\n<p>饱和度可理解为“离灰轴有多远”，色调表示围绕颜色轴的角度。H是圆周变量，0°与360°实际上相邻。</p>\n<div class=\"tip warn\"><strong>关键易错点</strong><div>不能像普通灰度那样直接对H做线性平均。例如359°与1°的正确平均接近0°，算术平均却是180°。平均色调应把角度转成单位圆向量后求平均。</div></div>\n<p>低饱和度区域接近灰色，色调数值不稳定。因此彩色分割常先用S排除灰白区域，再在H上选目标颜色范围，并用I处理亮暗。</p>\n</div></details><details class=\"qa\" id=\"c6-4\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">4. 伪彩色：灰度图为什么要“上色”？</span><span class=\"chapter-pill\">第48—59页</span></summary><div class=\"answer\">\n<p>伪彩色不是恢复真实颜色，而是人为给灰度值分配颜色，以帮助人观察差异。人能区分的颜色层次通常多于灰度层次。</p>\n<ul><li><strong>强度分层：</strong>把灰度范围分成若干区间，每个区间赋一种颜色。</li><li><strong>灰度到彩色变换：</strong>用R(r)、G(r)、B(r)三条变换曲线把一个灰度映射成彩色。</li><li><strong>多光谱融合：</strong>把不同不可见波段映射到RGB显示。</li></ul>\n<p>遥感降雨量图、温度图和医学图像常用颜色编码，但颜色必须配图例，否则不能知道物理意义。</p>\n</div></details><details class=\"qa\" id=\"c6-5\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">5. 全彩色处理和颜色变换</span><span class=\"chapter-pill\">第60—79页</span></summary><div class=\"answer\">\n<p>全彩色处理有两类：</p><ol><li>分别处理R、G、B三个分量，再合成。</li><li>把彩色像素c(x,y)=[R,G,B]<sup>T</sup>作为向量整体处理。</li></ol>\n<div class=\"formula\">s<sub>i</sub>=T<sub>i</sub>(r₁,r₂,…,r<sub>n</sub>)</div>\n<p>若运算对各通道独立且是线性的，逐通道处理与向量处理可能等价；非线性操作则不一定。</p>\n<h4>颜色切片</h4><p>在RGB或HSI空间定义目标颜色中心a和允许距离D₀，满足距离条件的像素保留，其余映射为灰色或作为掩膜。</p>\n<div class=\"formula\">D(z,a)=√[(R-a<sub>R</sub>)²+(G-a<sub>G</sub>)²+(B-a<sub>B</sub>)²]</div>\n</div></details><details class=\"qa\" id=\"c6-6\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">6. 彩色平滑、锐化、分割与噪声</span><span class=\"chapter-pill\">第80—100页</span></summary><div class=\"answer\">\n<p><strong>平滑：</strong>可分别对RGB通道做均值/高斯，也可对颜色向量平均。若只想平滑亮度且保持颜色，常转换到HSI/HSV/Lab，只处理I/V/L。</p>\n<p><strong>锐化：</strong>若对RGB独立锐化，可能改变通道比例并产生彩边。更稳妥的方法是锐化亮度分量，再与原色度合成。</p>\n<p><strong>颜色分割：</strong>可在HSI中用H选色、S排除低饱和区域，也可在RGB向量空间计算颜色距离。光照变化大时，归一化rgb、HSV或Lab通常比原始RGB稳健。</p>\n<p><strong>彩色噪声：</strong>RGB噪声经过非线性HSI变换后，H和S可能被严重放大；I作为三通道平均通常更平滑。</p>\n<div class=\"tip memory\"><strong>小丑鱼分割思路</strong><div>目标包含橙、白、黑三种区域，不能只阈值橙色。可先利用饱和色/边缘和位置得到鱼的整体候选，再做形态学连接与孔洞填充，最后保留与橙色主体相连的白黑区域。</div></div>\n</div></details><details class=\"qa\" id=\"c6-7\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">7. 重点作业题示例</span><span class=\"chapter-pill\">课程作业14—16</span></summary><div class=\"answer\"><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜对H分量做25×25均值会怎样？</div>\n<p>H是角度变量，红色附近可能同时出现接近0°和360°的值，直接算术平均会得到错误的中间色；在不同纯色块边界处会产生不符合真实颜色过渡的色调，转换回RGB后出现异常彩色带。</p>\n</div><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜对S分量做25×25均值会怎样？</div>\n<p>纯色块内部S较高，背景若低饱和，边界平均会使纯色块边缘S下降、背景附近S上升；色调和强度不变时，边缘颜色被“稀释”，出现较灰的过渡带。S是线性标量，平均本身没有H的环形断点问题。</p>\n</div><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜淡化雀斑并保留毛发</div><ol class=\"steps\"><li>检测皮肤区域，避免处理头发和背景。</li><li>在亮度通道使用双边/导向/非局部均值等边缘保持滤波估计平滑层。</li><li>通过高低频分离弱化雀斑的局部高频，但保护睫毛和发丝边缘。</li><li>按掩膜和适当权重与原图融合，避免塑料感。</li></ol></div></div></details><section class=\"card memory-card\"><h3>本章最后必须会</h3><div class=\"checklist\"><label><input type=\"checkbox\"> 能区分RGB加色与CMY减色</label><label><input type=\"checkbox\"> 会解释H/S/I</label><label><input type=\"checkbox\"> 知道H是周期角度量</label><label><input type=\"checkbox\"> 会说明伪彩色与全彩色区别</label><label><input type=\"checkbox\"> 会设计颜色切片和颜色分割</label><label><input type=\"checkbox\"> 会解释彩色图只处理亮度的好处</label></div>\n<h4>最容易记反</h4><ul><li>H=0°和360°相邻。</li><li>低饱和度时H不可靠。</li><li>逐通道非线性处理可能改变颜色。</li><li>小丑鱼完整分割不能只保留橙色。</li></ul>\n<h4>口头自测</h4><ol><li>为什么打印使用CMYK？</li><li>为何HSI适合颜色分割？</li><li>为什么对H直接均值会出错？</li></ol></section>","7":"<section class=\"card chapter-intro\">\n<div class=\"chapter-kicker\">第7章 · PDF精讲完整版 · 讲义第2—90页为主</div><h2>点、线、边缘检测与图像分割</h2>\n<p class=\"priority\">零基础目标：先听懂“它在解决什么问题”，再记公式和算法，最后用题目验证。</p>\n<div class=\"tip memory\"><strong>一句话理解</strong><div>分割利用两类信息：灰度不连续性用于找边缘，灰度或颜色相似性用于形成区域。检测到边缘后还要连接，阈值后还要清理区域。</div></div>\n<div class=\"tree-row\"><span>R=Σwᵢzᵢ</span><span>Roberts</span><span>Prewitt</span><span>Sobel</span><span>Laplacian</span><span>LoG零交叉</span><span>Hough</span><span>全局/局部阈值</span><span>Otsu</span><span>区域生长</span><span>彩色距离</span></div>\n<h4>学习路线</h4><div class=\"flowline\"><span>预处理</span><b>→</b><span>检测不连续性/相似性</span><b>→</b><span>连接或生长</span><b>→</b><span>形态学清理</span><b>→</b><span>得到目标区域</span></div>\n<p class=\"source-note\">页码按上传的中文讲义标注；少量重复页、致谢页或扩展材料不作为主线。</p></section><nav class=\"chapter-toc\"><b>本章分块</b><a href=\"#c7-1\">分割总览</a><a href=\"#c7-2\">点线检测</a><a href=\"#c7-3\">一阶梯度</a><a href=\"#c7-4\">Laplacian与LoG</a><a href=\"#c7-5\">边缘连接与Hough</a><a href=\"#c7-6\">阈值与Otsu</a><a href=\"#c7-7\">区域与彩色分割</a><a href=\"#c7-8\">应用题</a></nav><details class=\"qa\" id=\"c7-1\" open><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">1. 分割的总框架：边缘法和区域法</span><span class=\"chapter-pill\">第2—5页</span></summary><div class=\"answer\">\n<p>图像分割把图像划分为有意义的区域或像素集合。讲义主线有五部分：不连续性检测、边缘连接与边界检测、阈值分割、基于区域的分割、彩色分割。</p>\n<div class=\"table-wrap\"><table><thead><tr><th>依据</th><th>方法</th><th>适合场景</th></tr></thead><tbody><tr><td>不连续性</td><td>点、线、梯度、Laplacian、边缘连接</td><td>目标边界明显</td></tr><tr><td>相似性</td><td>阈值、区域生长、分裂合并、聚类</td><td>目标内部灰度/颜色一致</td></tr></tbody></table></div>\n<p>最终想要的通常不是一堆边缘像素，而是完整封闭的目标区域，所以边缘检测、阈值、区域处理和形态学经常组合使用。</p>\n</div></details><details class=\"qa\" id=\"c7-2\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">2. 点检测和线检测：掩模响应R</span><span class=\"chapter-pill\">第6—8页</span></summary><div class=\"answer\">\n<div class=\"formula\">R=Σ<sub>i=1</sub><sup>9</sup>w<sub>i</sub>z<sub>i</sub></div>\n<p>掩模在图像上滑动，若|R|≥T则认为存在目标不连续性。点检测核通常让中心系数大、周围系数为负，使孤立亮点或暗点产生大响应。</p>\n<p>线检测使用方向性核：水平、垂直、+45°、-45°线在对应核上响应最大。若要保留某方向线，可计算多个方向响应并取最大值或比较阈值。</p>\n<div class=\"tip warn\"><strong>孤立响应</strong><div>检测结果常含噪声点，应结合阈值、连通域面积或形态学开运算去除。</div></div>\n</div></details><details class=\"qa\" id=\"c7-3\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">3. 一阶导数：Roberts、Prewitt和Sobel</span><span class=\"chapter-pill\">第9—20页</span></summary><div class=\"answer\">\n<p>理想阶跃边缘在实际成像中会变成斜坡。一阶导数在斜坡中产生峰值，其幅值表示变化强弱，方向指向灰度增长最快方向；边缘方向与梯度方向垂直。</p>\n<div class=\"formula\">|∇f|≈√(Gx²+Gy²) 或 |Gx|+|Gy|，　α=atan2(Gy,Gx)</div>\n<div class=\"table-wrap\"><table><thead><tr><th>算子</th><th>核大小/特点</th><th>抗噪</th></tr></thead><tbody><tr><td>Roberts</td><td>2×2对角差分，定位紧凑</td><td>弱</td></tr><tr><td>Prewitt</td><td>3×3等权差分</td><td>一般</td></tr><tr><td>Sobel</td><td>3×3，中间行/列权重2，兼有轻微平滑</td><td>较好</td></tr></tbody></table></div>\n<pre class=\"matrix\">Sobel Gx               Sobel Gy\n-1 0 1                 -1 -2 -1\n-2 0 2                  0  0  0\n-1 0 1                  1  2  1</pre>\n<p>平滑能抑制噪声，但也会减弱和扩宽边缘，因此滤波尺寸要适中。</p>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜Sobel方向判断</div><p>左黑右白的竖直边缘，像素沿x方向变化大，所以|Gx|大；边缘本身竖直，但梯度水平。</p></div></div></details><details class=\"qa\" id=\"c7-4\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">4. 二阶导数、Laplacian和LoG零交叉</span><span class=\"chapter-pill\">第21—24页</span></summary><div class=\"answer\">\n<div class=\"formula\">∇²f=∂²f/∂x²+∂²f/∂y²</div>\n<p>Laplacian对细节和噪声敏感，阶跃边缘会产生正负双响应，不能给出边缘方向。边缘位置常由二阶响应的<strong>零交叉</strong>确定。</p>\n<p>LoG先用高斯函数平滑，再计算Laplacian：</p><div class=\"formula\">LoG*f = ∇²(G<sub>σ</sub>*f)</div>\n<p>σ越大，平滑越强，检测到的结构尺度越大。零交叉过多会产生“意大利面条效应”，因此还需幅值阈值和连接约束。</p>\n<div class=\"tip memory\"><strong>顺序</strong><div>二阶导数特别怕噪声，所以LoG把“先平滑”内置进一个卷积核中。</div></div>\n</div></details><details class=\"qa\" id=\"c7-5\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">5. 边缘连接与Hough变换</span><span class=\"chapter-pill\">第25—40页</span></summary><div class=\"answer\">\n<h4>局部连接</h4><p>在邻域内，如果两个边缘点的梯度幅值接近、方向接近，就把它们连接起来。这样可以把断裂像素组成边界。</p>\n<h4>Hough直线</h4><p>斜截式对垂直线不稳定，常用极坐标：</p><div class=\"formula\">ρ=x cosθ+y sinθ</div>\n<ol class=\"steps\"><li>先得到二值边缘图。</li><li>每个边缘点对所有θ计算ρ，在(ρ,θ)累加器中投票。</li><li>寻找累加器峰值。</li><li>把峰值参数反投影为图像直线。</li></ol>\n<p>Hough对断裂和少量噪声较鲁棒，但参数空间量化会影响精度，边缘点太多时计算量大。</p>\n<h4>圆检测</h4><div class=\"formula\">(x-a)²+(y-b)²=r²</div><p>已知半径时只需在(a,b)二维空间投票；未知半径时需(a,b,r)三维参数空间，计算和存储显著增大。</p>\n<p class=\"source-note\">讲义中的Canny主要出现在Hough示例，不是本章主线要求；复习重点仍是讲义列出的梯度、Laplacian、连接、Hough与阈值方法。</p>\n</div></details><details class=\"qa\" id=\"c7-6\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">6. 全局、局部、自适应阈值与Otsu</span><span class=\"chapter-pill\">第41—65页</span></summary><div class=\"answer\">\n<div class=\"formula\">g(x,y)=1，f(x,y)&gt;T；否则g(x,y)=0</div>\n<ul><li><strong>全局阈值：</strong>T固定，适合照明均匀和双峰直方图。</li><li><strong>迭代阈值：</strong>用当前T分成两类，算两类均值m₁、m₂，再令T=(m₁+m₂)/2，直到收敛。</li><li><strong>平均值阈值：</strong>取全图平均，简单但易受背景比例影响。</li><li><strong>局部/自适应阈值：</strong>T随邻域或坐标变化，适合阴影和照明不均。</li></ul>\n<h4>Otsu最大类间方差</h4>\n<div class=\"formula\">σ<sub>B</sub>²(T)=ω₀(T)ω₁(T)[μ₀(T)-μ₁(T)]²</div>\n<ol class=\"steps\"><li>遍历所有候选阈值T。</li><li>计算前景、背景概率ω₀、ω₁和均值μ₀、μ₁。</li><li>计算类间方差。</li><li>取类间方差最大的T。</li></ol>\n<p>直观上，最佳阈值让两类内部尽量紧凑、两类均值尽量分开。若直方图不是两类结构、目标很小或光照不均，Otsu可能失败。</p>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜阈值过高或过低</div><p>设亮目标、暗背景：阈值过低会把大量背景判成目标，假阳性增加；阈值过高会漏掉目标暗部，目标破碎，假阴性增加。</p></div></div></details><details class=\"qa\" id=\"c7-7\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">7. 基于区域与彩色分割</span><span class=\"chapter-pill\">第66—88页</span></summary><div class=\"answer\">\n<h4>区域生长</h4><ol class=\"steps\"><li>选择可靠种子。</li><li>检查邻域未分配像素。</li><li>若灰度/颜色与区域统计满足相似准则，则加入。</li><li>更新区域均值并重复，直到不再增长。</li></ol>\n<p>优点是可得到连通区域；缺点是对种子、阈值和噪声敏感，可能泄漏到背景。</p>\n<h4>区域分裂与合并</h4><p>从整图开始，若区域不均匀则四叉树分裂；相邻区域满足相似性时合并。适合大尺度区域，但边界可能呈块状。</p>\n<h4>彩色分割</h4><p>可在RGB向量空间用欧氏距离，也可在HSI中用H、S阈值。RGB距离：</p><div class=\"formula\">D(z,a)=||z-a||</div>\n<p>若各通道方差不同或相关，可用马氏距离；在颜色分割后通常用开闭运算、孔洞填充和连通域筛选获得完整目标。</p>\n</div></details><details class=\"qa\" id=\"c7-8\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">8. 期末应用题示例：写算法，不写代码</span><span class=\"chapter-pill\">综合</span></summary><div class=\"answer\"><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜检测零件外轮廓与孔洞</div>\n<ol class=\"steps\"><li>灰度化并用高斯滤波抑制噪声。</li><li>使用Sobel得到梯度幅值，阈值化为边缘。</li><li>根据梯度方向和邻域进行边缘连接。</li><li>用闭运算连接小断口，填充后得到区域。</li><li>提取外轮廓与内部孔洞，按面积和圆形度筛选。</li></ol><p>若轮廓是规则圆，可在边缘图上使用Hough圆。</p>\n</div><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜照明不均的文档二值化</div>\n<p>不能只用全局阈值。先做背景估计/光照校正，或直接使用局部自适应阈值；再用开运算去小噪声、闭运算补断笔画，按连通域面积保留文字。</p>\n</div></div></details><section class=\"card memory-card\"><h3>本章最后必须会</h3><div class=\"checklist\"><label><input type=\"checkbox\"> 会写Sobel梯度公式与核</label><label><input type=\"checkbox\"> 会解释Laplacian双边缘和LoG零交叉</label><label><input type=\"checkbox\"> 会写Hough直线ρ公式和投票流程</label><label><input type=\"checkbox\"> 会区分全局/局部/自适应阈值</label><label><input type=\"checkbox\"> 会写Otsu目标函数和步骤</label><label><input type=\"checkbox\"> 会设计区域生长和彩色分割</label></div>\n<h4>最容易记反</h4><ul><li>边缘方向与梯度方向垂直。</li><li>Hough是在参数空间投票。</li><li>Otsu不是任何图都有效。</li><li>阈值分割后通常还需要形态学清理。</li></ul>\n<h4>口头自测</h4><ol><li>为什么二阶导数更怕噪声？</li><li>未知半径圆Hough为什么更慢？</li><li>区域生长为什么会泄漏？</li></ol></section>","8":"<section class=\"card chapter-intro\">\n<div class=\"chapter-kicker\">第8章 · PDF精讲完整版 · 讲义第5—91页</div><h2>数学形态学</h2>\n<p class=\"priority\">零基础目标：先听懂“它在解决什么问题”，再记公式和算法，最后用题目验证。</p>\n<div class=\"tip memory\"><strong>一句话理解</strong><div>形态学让一个小形状“结构元素”在图像上移动，依据包含或相交关系改变目标形状，特别适合二值图的去噪、连接、填孔、边界和骨架。</div></div>\n<div class=\"tree-row\"><span>集合</span><span>反射/平移</span><span>结构元素</span><span>⊕膨胀</span><span>⊖腐蚀</span><span>○开</span><span>•闭</span><span>击中击不中</span><span>边界/填孔</span><span>细化/骨架</span><span>灰度max/min</span></div>\n<h4>学习路线</h4><div class=\"flowline\"><span>选择前景定义</span><b>→</b><span>选择结构元素形状/大小</span><b>→</b><span>执行形态学组合</span><b>→</b><span>连通域筛选</span><b>→</b><span>得到所需形状</span></div>\n<p class=\"source-note\">页码按上传的中文讲义标注；少量重复页、致谢页或扩展材料不作为主线。</p></section><nav class=\"chapter-toc\"><b>本章分块</b><a href=\"#c8-1\">集合与结构元素</a><a href=\"#c8-2\">膨胀与腐蚀</a><a href=\"#c8-3\">开运算与闭运算</a><a href=\"#c8-4\">击中击不中</a><a href=\"#c8-5\">基本形态学算法</a><a href=\"#c8-6\">细化骨架</a><a href=\"#c8-7\">灰度形态学</a><a href=\"#c8-8\">作业题</a></nav><details class=\"qa\" id=\"c8-1\" open><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">1. 集合、二值逻辑与结构元素</span><span class=\"chapter-pill\">第5—9页</span></summary><div class=\"answer\">\n<p>二值形态学把前景像素坐标看成集合A。结构元素B也是一个小集合，并指定原点。B的形状决定“关注什么形状”，大小决定处理尺度。</p>\n<ul><li>并集A∪B对应OR；交集A∩B对应AND；补集A<sup>c</sup>对应NOT。</li><li>反射：B̂={-b|b∈B}。</li><li>平移：(B)<sub>z</sub>={b+z|b∈B}。</li></ul>\n<p>以下默认白色/1是前景。若图像定义相反，腐蚀和膨胀的视觉效果也会相反。</p>\n</div></details><details class=\"qa\" id=\"c8-2\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">2. 膨胀和腐蚀：一个看“碰到”，一个看“放得下”</span><span class=\"chapter-pill\">第10—27页</span></summary><div class=\"answer\">\n<div class=\"formula\">A⊕B={z | B̂<sub>z</sub>∩A≠∅}</div>\n<p>膨胀：只要结构元素移动到z时与前景有相交，z就成为前景。效果是扩大白色目标、连接小间隙、填小孔。</p>\n<div class=\"formula\">A⊖B={z | B<sub>z</sub>⊆A}</div>\n<p>腐蚀：只有结构元素完整放在A内部，中心z才保留。效果是缩小白色目标、去除小白噪声、断开细连接。</p>\n<div class=\"table-wrap\"><table><thead><tr><th>目标</th><th>优先操作</th><th>结构元素</th></tr></thead><tbody><tr><td>连接水平断裂</td><td>膨胀/闭运算</td><td>水平长条</td></tr><tr><td>去除小白点</td><td>腐蚀/开运算</td><td>略大于噪声的圆/方形</td></tr><tr><td>分开窄连接目标</td><td>腐蚀/开运算</td><td>能穿过连接处的结构元素</td></tr></tbody></table></div>\n<p>结构元素越大，形态改变越强；方向性结构元素只会在特定方向扩张或收缩。</p>\n</div></details><details class=\"qa\" id=\"c8-3\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">3. 开运算和闭运算：顺序必须背熟</span><span class=\"chapter-pill\">第28—39页</span></summary><div class=\"answer\">\n<div class=\"formula\">A○B=(A⊖B)⊕B　　先腐蚀后膨胀</div>\n<p>开运算能去除小前景、细突起，断开狭窄连接，平滑外凸边界。被腐蚀掉且无法恢复的结构通常小于B。</p>\n<div class=\"formula\">A•B=(A⊕B)⊖B　　先膨胀后腐蚀</div>\n<p>闭运算能连接窄断口、填小孔和细沟，平滑内凹边界。</p>\n<div class=\"tip memory\"><strong>口诀</strong><div>开：先缩后放，打开细连接、去白点；闭：先放后缩，关闭小缺口、补黑洞。</div></div>\n<p>开、闭运算具有幂等性：再做一次同样的开或闭，结果通常不再变化。</p>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜判断处理效果</div><p>白色文字有小断笔：用与笔画方向一致的闭运算连接；背景中有小白噪点：用开运算去除。若同时存在，可根据先后影响尝试开后闭或闭后开。</p></div></div></details><details class=\"qa\" id=\"c8-4\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">4. 击中-击不中：同时匹配前景和背景</span><span class=\"chapter-pill\">第40—47页</span></summary><div class=\"answer\">\n<p>仅腐蚀只能问“某前景形状是否存在”，击中-击不中同时要求目标前景匹配B₁、目标周围背景匹配B₂：</p>\n<div class=\"formula\">A⊛B=(A⊖B₁)∩(A<sup>c</sup>⊖B₂)</div>\n<p>它是二值形状检测的基本工具，可寻找特定字符、端点、角点或局部结构。结构元素中常用1表示必须是前景，0表示必须是背景，空白表示不关心。</p>\n<p>对旋转方向未知的目标，应把结构元素旋转成多个方向并取检测结果并集。</p>\n</div></details><details class=\"qa\" id=\"c8-5\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">5. 边界提取、孔洞填充和连通分量</span><span class=\"chapter-pill\">第48—58页</span></summary><div class=\"answer\">\n<h4>边界提取</h4><div class=\"formula\">β(A)=A-(A⊖B)</div><p>原图减去腐蚀结果得到内边界。B越大，边界越厚。</p>\n<h4>孔洞填充</h4><p>在孔洞内部选种子X₀={p}，做条件膨胀：</p><div class=\"formula\">X<sub>k</sub>=(X<sub>k-1</sub>⊕B)∩A<sup>c</sup></div><p>直到稳定，再与边界A合并。与A<sup>c</sup>相交限制生长不能穿过边界。</p>\n<h4>连通分量提取</h4><p>从目标内一点开始条件膨胀，并与A相交：</p><div class=\"formula\">X<sub>k</sub>=(X<sub>k-1</sub>⊕B)∩A</div><p>稳定结果就是包含该种子的连通分量。</p>\n</div></details><details class=\"qa\" id=\"c8-6\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">6. 细化、加粗、骨架与剪枝</span><span class=\"chapter-pill\">第59—67页</span></summary><div class=\"answer\">\n<p><strong>细化</strong>逐层删除边界像素，但保持连通性，得到一像素宽结构；<strong>骨架</strong>描述形状的中心轴，可用于字符、道路和血管分析。</p>\n<div class=\"formula\">S<sub>k</sub>(A)=(A⊖kB)-[(A⊖kB)○B]</div>\n<div class=\"formula\">A=⋃<sub>k=0</sub><sup>K</sup>[S<sub>k</sub>(A)⊕kB]</div>\n<p>骨架化容易产生短小毛刺，剪枝通过端点检测、有限次删除和条件恢复去除寄生分支。处理时必须避免删掉真实短分支。</p>\n</div></details><details class=\"qa\" id=\"c8-7\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">7. 灰度形态学：膨胀取最大，腐蚀取最小</span><span class=\"chapter-pill\">第68—91页</span></summary><div class=\"answer\">\n<p>灰度图中不再是集合包含，而是在结构元素邻域内做最大/最小运算（平坦结构元素时）：</p>\n<div class=\"formula\">灰度膨胀：最大值滤波　　灰度腐蚀：最小值滤波</div>\n<ul><li>膨胀使图像偏亮，扩展亮区域，削弱小暗细节。</li><li>腐蚀使图像偏暗，扩展暗区域，削弱小亮细节。</li><li>灰度开运算抑制小亮结构；灰度闭运算抑制小暗结构。</li></ul>\n<div class=\"formula\">形态学梯度 = (f⊕b)-(f⊖b)</div>\n<p>形态学梯度突出边界；顶帽f-(f○b)提取小亮目标；黑帽(f•b)-f提取小暗目标。结构元素尺度应大于要提取的细节、小于要保留的主体。</p>\n</div></details><details class=\"qa\" id=\"c8-8\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">8. 重点作业题示例</span><span class=\"chapter-pill\">课程作业17—18</span></summary><div class=\"answer\"><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜开闭运算结果分析</div><p>报告不能只放图。应说明：开运算后小白点和细突起消失、窄连接断开，主体大轮廓基本保留；闭运算后小黑洞和裂缝被填充、断裂区域连接。比较不同结构元素大小，说明过大会造成主体形状失真。</p>\n</div><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜检测所有字母I</div><ol class=\"steps\"><li>二值化并统一前景为白色。</li><li>根据字母I的竖线和上下横线设计击中-击不中结构元素。</li><li>对可能的字体尺度或方向制作多个结构元素。</li><li>取检测并集并做连通域定位。</li><li>用宽高比、面积进一步排除误检。</li></ol></div></div></details><section class=\"card memory-card\"><h3>本章最后必须会</h3><div class=\"checklist\"><label><input type=\"checkbox\"> 会写膨胀和腐蚀的集合含义</label><label><input type=\"checkbox\"> 会背开闭顺序和效果</label><label><input type=\"checkbox\"> 会根据任务选择结构元素形状</label><label><input type=\"checkbox\"> 会写边界提取公式</label><label><input type=\"checkbox\"> 会解释条件膨胀填孔</label><label><input type=\"checkbox\"> 会说明击中击不中</label><label><input type=\"checkbox\"> 会判断灰度max/min效果</label></div>\n<h4>最容易记反</h4><ul><li>默认白色是前景，前景定义变了效果也变。</li><li>开运算去白色小目标，闭运算填黑色小孔。</li><li>结构元素不是越大越好。</li><li>骨架后常需剪枝。</li></ul>\n<h4>口头自测</h4><ol><li>为什么闭运算能连接断裂？</li><li>填孔公式中为什么要与A的补集相交？</li><li>灰度顶帽能提取什么？</li></ol></section>","9":"<section class=\"card chapter-intro\">\n<div class=\"chapter-kicker\">第9章 · PDF精讲完整版 · 讲义第3—108页</div><h2>区域、颜色、轮廓与局部特征</h2>\n<p class=\"priority\">零基础目标：先听懂“它在解决什么问题”，再记公式和算法，最后用题目验证。</p>\n<div class=\"tip memory\"><strong>一句话理解</strong><div>特征是把大量像素压缩成可比较的数值。区域特征描述大小和形状；颜色与纹理特征用于分类；SIFT等局部特征用于匹配、拼接和三维重建。</div></div>\n<div class=\"tree-row\"><span>面积</span><span>原始矩/中心矩/Hu矩</span><span>质心</span><span>等效椭圆</span><span>圆形度</span><span>颜色矩</span><span>周长</span><span>LBP</span><span>HOG</span><span>Haar</span><span>SIFT 128维</span></div>\n<h4>学习路线</h4><div class=\"flowline\"><span>分割目标/检测关键点</span><b>→</b><span>选择描述方式</span><b>→</b><span>计算特征向量</span><b>→</b><span>归一化</span><b>→</b><span>比较或分类</span></div>\n<p class=\"source-note\">页码按上传的中文讲义标注；少量重复页、致谢页或扩展材料不作为主线。</p></section><nav class=\"chapter-toc\"><b>本章分块</b><a href=\"#c9-1\">好特征与任务</a><a href=\"#c9-2\">面积、矩与质心</a><a href=\"#c9-3\">椭圆与形状</a><a href=\"#c9-4\">颜色与轮廓</a><a href=\"#c9-5\">LBP/HOG/Haar</a><a href=\"#c9-6\">SIFT/SURF/DAISY</a><a href=\"#c9-7\">题目示例</a></nav><details class=\"qa\" id=\"c9-1\" open><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">1. 为什么提取特征？什么样的点是好特征？</span><span class=\"chapter-pill\">第3—19页</span></summary><div class=\"answer\">\n<p>特征用于平面/三维物体识别、位置识别、机器人定位、全景拼接、跟踪和数据库检索。好特征应具备：</p>\n<ul><li><strong>可重复性：</strong>视角、尺度、亮度变化后仍能找到。</li><li><strong>显著性：</strong>不同位置或对象的描述子容易区分。</li><li><strong>局部性：</strong>遮挡一部分时仍有其他特征可用。</li><li><strong>紧凑与高效：</strong>数量远少于像素，计算和匹配快。</li></ul>\n<p>小窗口分类：平坦区各方向变化都小；边缘沿边缘方向变化小；角点在各方向移动都会产生明显变化。因此角点通常比单纯边缘点更容易被再次定位。</p>\n</div></details><details class=\"qa\" id=\"c9-2\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">2. 面积、图像矩、质心与Hu矩</span><span class=\"chapter-pill\">第20—30页</span></summary><div class=\"answer\">\n<div class=\"formula\">m<sub>pq</sub>=ΣΣ x<sup>p</sup>y<sup>q</sup>f(x,y)</div>\n<p>二值区域中f=1：m₀₀就是面积；一阶矩给出坐标加权和：</p><div class=\"formula\">x̄=m₁₀/m₀₀，　ȳ=m₀₁/m₀₀</div>\n<p>原始矩随平移改变。以质心为原点定义中心矩：</p><div class=\"formula\">μ<sub>pq</sub>=ΣΣ(x-x̄)<sup>p</sup>(y-ȳ)<sup>q</sup>f(x,y)</div>\n<p>归一化中心矩消除尺度影响：</p><div class=\"formula\">η<sub>pq</sub>=μ<sub>pq</sub>/μ₀₀<sup>(p+q)/2+1</sup></div>\n<p>Hu用二、三阶归一化中心矩组合出7个不变量，对平移、尺度和旋转具有不变性（实际离散、噪声和镜像会产生误差）。</p>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜质心计算</div><p>二值目标像素坐标为(1,1)、(2,1)、(3,2)。面积m₀₀=3，x̄=(1+2+3)/3=2，ȳ=(1+1+2)/3=4/3。</p></div></div></details><details class=\"qa\" id=\"c9-3\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">3. 等效椭圆、主轴、包围框与形状指标</span><span class=\"chapter-pill\">第31—47页</span></summary><div class=\"answer\">\n<p>二阶中心矩形成区域的协方差/惯性矩阵，其特征向量给出主方向，特征值反映沿主轴和次轴的扩展程度。等效椭圆是与区域具有相同二阶矩的椭圆。</p>\n<div class=\"formula\">方向 θ = 1/2 atan2(2μ₁₁, μ₂₀-μ₀₂)</div>\n<ul><li><strong>轴对齐包围矩形：</strong>计算快，但旋转时面积变化大。</li><li><strong>最小外接矩形：</strong>考虑旋转，能反映方向和长宽。</li><li><strong>最小外接圆：</strong>适合圆形目标和尺寸上界。</li><li><strong>凸包：</strong>包住区域的最小凸集合，可计算凸性与缺陷。</li></ul>\n<div class=\"formula\">圆形度 C=4πA/P²，理想圆C=1</div>\n<p>周长P对锯齿和噪声敏感，所以分割边界不平滑会显著降低圆形度。紧凑度常用P²/A，越大通常越不紧凑。</p>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜珍珠筛选</div><p>分割后对连通域计算面积、圆形度、长宽比和凸性。保留面积在合理范围、圆形度接近1、长宽比接近1的区域；粘连珍珠可用距离变换与分水岭分开。</p></div></div></details><details class=\"qa\" id=\"c9-4\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">4. 颜色特征与轮廓特征</span><span class=\"chapter-pill\">第48—56页</span></summary><div class=\"answer\">\n<p>颜色特征通常对平移、旋转和尺度稳定，但会受光照和白平衡影响。常用颜色均值、直方图、颜色一致性和颜色矩。</p>\n<div class=\"formula\">均值 μ<sub>i</sub>=1/(MN)ΣΣI(x,y,i)</div>\n<div class=\"formula\">标准差 σ<sub>i</sub>=√[1/(MN)ΣΣ(I-μ<sub>i</sub>)²]</div>\n<p>第三阶中心矩的立方根反映偏度。RGB三通道各取均值、标准差、偏度可得到9维颜色矩。</p>\n<p>轮廓特征包括周长、曲率、链码、傅里叶描述子等。4连通边界步长为1；8连通的对角步长为√2。轮廓方法更敏感于边界噪声，区域矩对局部小缺口相对稳健。</p>\n</div></details><details class=\"qa\" id=\"c9-5\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">5. LBP、HOG与Haar-like</span><span class=\"chapter-pill\">第57—83页</span></summary><div class=\"answer\">\n<h4>LBP</h4><p>以中心像素为阈值，邻域大于等于中心记1，否则记0，按顺序组成二进制码。它使用相对灰度，对单调光照变化较稳健，适合纹理和人脸。</p>\n<h4>HOG</h4><ol class=\"steps\"><li>灰度化/归一化并计算梯度幅值、方向。</li><li>划分cell，在每个cell统计方向直方图。</li><li>把相邻cell组成block并归一化，增强光照鲁棒性。</li><li>串联所有block得到特征向量，常与SVM分类器结合。</li></ol>\n<p>讲义示例：8×8 cell、2×2 cell/block、9个方向bin，每个block有2×2×9=36维；若有105个block，总长3780维。</p>\n<h4>Haar-like</h4><p>用相邻矩形区域像素和之差描述边缘、线和中心环绕结构，配合积分图可快速计算，经典用于Viola-Jones人脸检测。</p>\n<div class=\"tip warn\"><strong>区别</strong><div>HOG是固定网格上的局部梯度统计，适合检测/分类；SIFT围绕关键点构建具有尺度和旋转信息的局部描述子，适合匹配。</div></div>\n</div></details><details class=\"qa\" id=\"c9-6\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">6. SIFT为什么尺度、旋转不变？128维从哪里来？</span><span class=\"chapter-pill\">第84—106页</span></summary><div class=\"answer\">\n<ol class=\"steps\"><li><strong>尺度空间：</strong>用不同σ的高斯模糊形成高斯金字塔，模拟不同观察尺度。</li><li><strong>DoG极值：</strong>相邻高斯图相减，在当前层及上下层3×3×3邻域寻找极值。</li><li><strong>精确定位：</strong>亚像素插值，去除低对比度点和强边缘响应。</li><li><strong>主方向：</strong>统计关键点邻域梯度方向，为关键点分配主方向。</li><li><strong>描述子：</strong>把旋转对齐后的邻域分成4×4小块，每块8个方向bin，得到4×4×8=128维。</li><li><strong>归一化：</strong>降低整体亮度和对比度变化影响。</li></ol>\n<p>高斯金字塔的“分层”解决物体大小变化；不同σ的“模糊通道”避免只在单一尺度找点。主方向解决旋转；描述子归一化改善光照鲁棒性。</p>\n<p><strong>SURF</strong>用Hessian近似和积分图加速，描述子常为64维；<strong>DAISY</strong>适合稠密描述，通过高斯卷积高效汇聚方向直方图。</p>\n</div></details><details class=\"qa\" id=\"c9-7\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">7. 重点题目示例</span><span class=\"chapter-pill\">课程作业22—24</span></summary><div class=\"answer\"><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜为什么SIFT需要高斯金字塔？</div>\n<p>同一物体在不同拍摄距离下会占据不同像素尺度。若只在原图上检测，关键点可能在缩放后消失。高斯尺度空间在多种σ和多组降采样层上检测DoG极值，使同一物理结构能在其合适尺度被找到，从而获得尺度不变性；高斯平滑还抑制高频噪声并满足尺度空间理论。</p>\n</div><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜HOG猫目标检测</div><ol class=\"steps\"><li>统一模板和搜索窗口尺寸。</li><li>提取HOG描述子并训练/使用分类器或计算特征相似度。</li><li>多尺度滑窗检测目标。</li><li>用非极大值抑制合并重复框。</li><li>将每个cell方向直方图以线段方式可视化。</li></ol></div></div></details><section class=\"card memory-card\"><h3>本章最后必须会</h3><div class=\"checklist\"><label><input type=\"checkbox\"> 会算面积和质心</label><label><input type=\"checkbox\"> 会区分原始矩/中心矩/归一化矩</label><label><input type=\"checkbox\"> 会写圆形度公式</label><label><input type=\"checkbox\"> 会解释颜色矩</label><label><input type=\"checkbox\"> 会说清HOG步骤与维度</label><label><input type=\"checkbox\"> 会完整口述SIFT六步和128维</label></div>\n<h4>最容易记反</h4><ul><li>Hu矩是不变量组合，不是单个原始矩。</li><li>圆形度对周长噪声很敏感。</li><li>HOG一般不具备SIFT同等级的尺度旋转不变性。</li><li>SIFT关键点检测与描述子生成是两个阶段。</li></ul>\n<h4>口头自测</h4><ol><li>平坦区、边缘、角点哪个更好重复定位？</li><li>HOG block归一化解决什么问题？</li><li>SIFT为何要去除边缘响应？</li></ol></section>","10":"<section class=\"card chapter-intro\">\n<div class=\"chapter-kicker\">第10章 · PDF精讲完整版 · 讲义第2—40页</div><h2>双目立体视觉与三维重建</h2>\n<p class=\"priority\">零基础目标：先听懂“它在解决什么问题”，再记公式和算法，最后用题目验证。</p>\n<div class=\"tip memory\"><strong>一句话理解</strong><div>双目利用同一三维点在左右图像中的位置差恢复深度。核心是先把对应点找到，再用相似三角形把视差换成距离。</div></div>\n<div class=\"tree-row\"><span>基线</span><span>对极平面</span><span>对极线</span><span>对极点</span><span>d=xL-xR</span><span>Z=fb/d</span><span>近大远小</span><span>内参/外参</span><span>重投影误差</span></div>\n<h4>学习路线</h4><div class=\"flowline\"><span>标定</span><b>→</b><span>畸变校正</span><b>→</b><span>极线校正</span><b>→</b><span>左右匹配</span><b>→</b><span>计算视差</span><b>→</b><span>三角测量</span><b>→</b><span>深度图/点云</span></div>\n<p class=\"source-note\">页码按上传的中文讲义标注；少量重复页、致谢页或扩展材料不作为主线。</p></section><nav class=\"chapter-toc\"><b>本章分块</b><a href=\"#c10-1\">单目与双目</a><a href=\"#c10-2\">极线几何</a><a href=\"#c10-3\">深度与视差</a><a href=\"#c10-4\">标定与校正</a><a href=\"#c10-5\">立体匹配流程</a><a href=\"#c10-6\">测量范围与误差</a><a href=\"#c10-7\">题目示例</a></nav><details class=\"qa\" id=\"c10-1\" open><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">1. 单目为什么不够？双目流程是什么？</span><span class=\"chapter-pill\">第2—6页</span></summary><div class=\"answer\">\n<p>单目像素p只确定一条从光心出发的射线，射线上不同深度的点都会投到p，因此存在尺度和深度歧义。第二个相机从不同位置观察同一点，两条视线相交后可恢复三维位置。</p>\n<div class=\"mega-route\"><div><b>双目标定</b><span>内外参、畸变</span></div><b>→</b><div><b>校正</b><span>极线水平对齐</span></div><b>→</b><div><b>对应匹配</b><span>找同一物点</span></div><b>→</b><div><b>视差</b><span>xL-xR</span></div><b>→</b><div><b>三角测量</b><span>深度/点云</span></div></div>\n<p>最难的环节通常不是公式，而是“对应点匹配”：纹理重复、无纹理、遮挡、反光都会造成误匹配。</p>\n</div></details><details class=\"qa\" id=\"c10-2\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">2. 对极几何：把二维搜索降成一维</span><span class=\"chapter-pill\">第6—11页</span></summary><div class=\"answer\">\n<ul><li><strong>基线：</strong>两个相机光心C、C′的连线。</li><li><strong>对极平面：</strong>C、C′和三维点X共同确定的平面。</li><li><strong>对极线：</strong>对极平面与像平面的交线。</li><li><strong>对极点：</strong>一幅图像中另一个相机光心的投影，所有对极线交于此点。</li></ul>\n<p>左图中给定点x，其右图对应点x′一定在对应对极线上，而不必在整个二维图像中搜索。校正后的标准平行双目中，对极线成为同一水平扫描线，搜索只沿x方向进行。</p>\n<div class=\"tip warn\"><strong>平行式与汇聚式</strong><div>平行式极线水平且视差可看作标量；汇聚式相机光轴相交，极线不平行，原始视差有水平和竖直分量，通常先做极线校正。</div></div>\n</div></details><details class=\"qa\" id=\"c10-3\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">3. 深度与视差公式及推导</span><span class=\"chapter-pill\">第12—16、22—32页</span></summary><div class=\"answer\">\n<p>理想平行双目中，两相机焦距f、基线b，三维点在左右图横坐标为x<sub>L</sub>、x<sub>R</sub>：</p>\n<div class=\"formula\">d=x<sub>L</sub>-x<sub>R</sub>，　Z=f b / d</div>\n<p>由左右相机相似三角形相减即可得到。关系：</p><ul><li>物体越近，d越大；越远，d越小。</li><li>f或b越大，同一深度产生的视差越大，深度分辨率提高。</li><li>d接近0时Z非常大，远距离测量对视差误差极敏感。</li></ul>\n<p>恢复相机坐标（主点c<sub>x</sub>,c<sub>y</sub>，像素焦距f<sub>x</sub>,f<sub>y</sub>）：</p>\n<div class=\"formula\">X=(u-c<sub>x</sub>)Z/f<sub>x</sub>，Y=(v-c<sub>y</sub>)Z/f<sub>y</sub></div>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜深度计算</div><p>f=800 pixel，b=0.12 m，d=48 pixel：</p><div class=\"formula\">Z=800×0.12/48=2 m</div><p>若视差变为24 pixel，深度变为4 m。</p></div></div></details><details class=\"qa\" id=\"c10-4\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">4. 相机标定、畸变校正与极线校正</span><span class=\"chapter-pill\">第17—24、33—40页</span></summary><div class=\"answer\">\n<p><strong>内参</strong>描述相机自身：f<sub>x</sub>、f<sub>y</sub>、主点(c<sub>x</sub>,c<sub>y</sub>)、畸变；<strong>外参</strong>描述世界/左右相机之间的旋转R和平移t。</p>\n<div class=\"formula\">s[u v 1]<sup>T</sup>=K[R|t][X Y Z 1]<sup>T</sup></div>\n<ol class=\"steps\"><li>从不同角度拍摄多张棋盘格图像。</li><li>检测并亚像素优化角点。</li><li>估计单应性、内参、每幅图外参和畸变参数。</li><li>非线性优化，最小化重投影误差。</li><li>双目标定求两相机相对R、t。</li><li>计算校正映射，使对极线水平对齐。</li></ol>\n<p>重投影误差是“标定板三维点经参数投影的位置”与“实际检测角点”的像素距离。误差小不保证所有场景都好，还要检查标定板覆盖图像范围、姿态多样性和镜头模型。</p>\n</div></details><details class=\"qa\" id=\"c10-5\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">5. 立体匹配与视差图</span><span class=\"chapter-pill\">第16—30页</span></summary><div class=\"answer\">\n<p>校正后，对左图每个像素或小块沿同一行在右图搜索。局部方法常用SAD、SSD、NCC；全局/半全局方法还考虑邻域平滑和边缘保持。</p>\n<ol class=\"steps\"><li>计算匹配代价。</li><li>代价聚合，增强稳定性。</li><li>选择最佳视差。</li><li>左右一致性检查，发现遮挡和误匹配。</li><li>亚像素优化、中值/引导滤波等后处理。</li></ol>\n<p>视差图通常用亮度显示视差，近处视差大显示更亮。无纹理区域代价相近，重复纹理有多个候选，遮挡区在另一图中没有对应点。</p>\n</div></details><details class=\"qa\" id=\"c10-6\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">6. 可测深度范围与误差关系</span><span class=\"chapter-pill\">第23—27页及综合</span></summary><div class=\"answer\">\n<p>视差搜索范围[d<sub>min</sub>,d<sub>max</sub>]对应深度范围：</p><div class=\"formula\">Z<sub>near</sub>=fb/d<sub>max</sub>，　Z<sub>far</sub>=fb/d<sub>min</sub></div>\n<p>由Z=fb/d微分可得近似误差：</p><div class=\"formula\">|δZ|≈(Z²/(fb))|δd|</div>\n<p>深度误差随Z²增长，所以双目适合有限工作范围。增大基线和焦距可提高远处精度，但会减少左右共同视场、增加遮挡，并可能使近处视差超出搜索范围。</p>\n<div class=\"tip memory\"><strong>工程折中</strong><div>大基线精度高但遮挡大；小基线共同视场好但远处视差太小。需要根据目标距离、相机分辨率和视差算法选择。</div></div>\n</div></details><details class=\"qa\" id=\"c10-7\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">7. 期末题目示例</span><span class=\"chapter-pill\">综合</span></summary><div class=\"answer\"><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜简述双目三维重建流程</div>\n<p>先离线标定得到左右相机内参、畸变及相对外参；对图像去畸变并极线校正，使对应点位于同一水平线；使用立体匹配得到视差图；根据Z=fb/d三角测量深度，再由内参恢复X、Y，形成深度图或三维点云；最后进行一致性检查、滤波和误差评估。</p>\n</div><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜焦距、基线、视差变化判断</div><p>同一深度下，增大f或b会增大视差；同一系统中，目标靠近时d增大。若d测量误差固定，远处Z更大，深度误差显著增加。</p></div></div></details><section class=\"card memory-card\"><h3>本章最后必须会</h3><div class=\"checklist\"><label><input type=\"checkbox\"> 会定义基线/对极线/对极点/对极平面</label><label><input type=\"checkbox\"> 会解释极线约束降维</label><label><input type=\"checkbox\"> 会算d和Z=fb/d</label><label><input type=\"checkbox\"> 会写XYZ恢复</label><label><input type=\"checkbox\"> 会区分内参与外参</label><label><input type=\"checkbox\"> 会口述标定-校正-匹配-三角测量</label></div>\n<h4>最容易记反</h4><ul><li>近处视差大，远处视差小。</li><li>焦距必须使用与视差一致的像素单位。</li><li>重投影误差小不等于立体匹配一定正确。</li><li>单目无法仅凭一个像素唯一确定深度。</li></ul>\n<h4>口头自测</h4><ol><li>对极校正解决了什么？</li><li>为什么远距离深度误差更大？</li><li>增大基线有哪些好处和代价？</li></ol></section>","11":"<section class=\"card chapter-intro\">\n<div class=\"chapter-kicker\">第11章 · PDF精讲完整版 · 讲义第2—49页为主</div><h2>基于灰度值的模板匹配</h2>\n<p class=\"priority\">零基础目标：先听懂“它在解决什么问题”，再记公式和算法，最后用题目验证。</p>\n<div class=\"tip memory\"><strong>一句话理解</strong><div>模板匹配是在搜索图中滑动一个已知小图，每个位置算“差异”或“相似度”，再选择最小差异或最大相似度的位置。</div></div>\n<div class=\"tree-row\"><span>模板/搜索图</span><span>位置数</span><span>SSD</span><span>SAD</span><span>MAD</span><span>MSD</span><span>NCC</span><span>响应图</span><span>SSDA提前终止</span><span>直方图</span><span>特征匹配</span></div>\n<h4>学习路线</h4><div class=\"flowline\"><span>准备模板</span><b>→</b><span>遍历候选位置</span><b>→</b><span>计算响应</span><b>→</b><span>寻找最优值</span><b>→</b><span>阈值与非极大值抑制</span><b>→</b><span>输出位置</span></div>\n<p class=\"source-note\">页码按上传的中文讲义标注；少量重复页、致谢页或扩展材料不作为主线。</p></section><nav class=\"chapter-toc\"><b>本章分块</b><a href=\"#c11-1\">匹配分类与滑动</a><a href=\"#c11-2\">SSD展开</a><a href=\"#c11-3\">SAD/MAD/MSD/NCC</a><a href=\"#c11-4\">SSDA与分层搜索</a><a href=\"#c11-5\">直方图匹配</a><a href=\"#c11-6\">特征匹配</a><a href=\"#c11-7\">作业题</a></nav><details class=\"qa\" id=\"c11-1\" open><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">1. 图像匹配三类方法与滑动窗口</span><span class=\"chapter-pill\">第2—13页</span></summary><div class=\"answer\">\n<div class=\"table-wrap\"><table><thead><tr><th>方法</th><th>比较对象</th><th>优缺点</th></tr></thead><tbody>\n<tr><td>模板匹配</td><td>同位置像素灰度</td><td>简单精确；怕旋转、缩放、光照</td></tr>\n<tr><td>直方图匹配</td><td>灰度/颜色分布</td><td>对平移旋转较稳健；丢失空间位置</td></tr>\n<tr><td>特征匹配</td><td>关键点描述子</td><td>可抗尺度旋转；流程复杂</td></tr>\n</tbody></table></div>\n<p>设搜索图M×N，模板J×K，模板左上角可以放置的位置数：</p><div class=\"formula\">(M-J+1)(N-K+1)</div>\n<p>每个位置产生一个响应值，所有响应组成响应图。差异量取最小点，相似量取最大点；检测多个目标时还需阈值和非极大值抑制，避免同一目标周围出现多个峰。</p>\n</div></details><details class=\"qa\" id=\"c11-2\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">2. SSD及展开公式有什么意义？</span><span class=\"chapter-pill\">第14—23页</span></summary><div class=\"answer\">\n<div class=\"formula\">D(x,y)=ΣΣ[I(x+j,y+k)-T(j,k)]²</div>\n<p>SSD越小越相似，完全相同为0。展开：</p>\n<div class=\"formula\">D=D<sub>S</sub>-D<sub>ST</sub>+D<sub>T</sub></div>\n<div class=\"formula-stack\"><div>D<sub>S</sub>=ΣΣI²：当前候选块能量，随位置变化</div><div>D<sub>ST</sub>=2ΣΣIT：模板与候选块相关项，越大越相似</div><div>D<sub>T</sub>=ΣΣT²：模板自身能量，匹配过程中是常数</div></div>\n<p><strong>展开的意义：</strong>把平方差分解为候选块能量、交叉相关和模板常量，便于理解SSD为什么受亮度/能量影响，也便于用积分图或快速相关加速。不能只最大化相关项而忽略D<sub>S</sub>，除非候选块能量近似相同或已归一化。</p>\n<div class=\"exam-box\"><div class=\"answer-label\">题目示例｜SSD手算</div><p>模板[1,2]，候选A=[1,3]，候选B=[2,3]：SSD(A)=0²+1²=1；SSD(B)=1²+1²=2，因此A更匹配。</p></div></div></details><details class=\"qa\" id=\"c11-3\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">3. SAD、MAD、MSD与NCC怎么选？</span><span class=\"chapter-pill\">第24—31页</span></summary><div class=\"answer\">\n<div class=\"formula-stack\"><div>SAD=ΣΣ|I-T|，越小越好</div><div>MAD=SAD/(JK)，越小越好</div><div>MSD=SSD/(JK)，越小越好</div><div>NCC=ΣΣ[(I-Ī)(T-T̄)] / √[ΣΣ(I-Ī)²ΣΣ(T-T̄)²]，越大越好</div></div>\n<div class=\"table-wrap\"><table><thead><tr><th>指标</th><th>特点</th></tr></thead><tbody>\n<tr><td>SSD/MSD</td><td>平方放大大误差，平滑可导；对异常值和亮度变化敏感</td></tr><tr><td>SAD/MAD</td><td>绝对值计算简单，对异常值比平方项稳健</td></tr><tr><td>NCC</td><td>减均值并归一化，对整体亮度和对比度变化更稳健；计算较大</td></tr></tbody></table></div>\n<p>“平均”只除以模板像素数，不改变同一尺寸模板下最佳位置，但便于不同模板尺寸之间比较。</p>\n<div class=\"tip warn\"><strong>必须记住</strong><div>SSD、SAD、MAD、MSD是误差，越小越好；相关和NCC是相似度，越大越好。</div></div>\n</div></details><details class=\"qa\" id=\"c11-4\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">4. 为什么要SSDA和分层搜索？</span><span class=\"chapter-pill\">第28—36页</span></summary><div class=\"answer\">\n<p>完整模板在每个候选位置都计算全部JK个像素，计算量约为位置数×JK。SSDA在明显不匹配的位置提前停止：</p>\n<ol class=\"steps\"><li>设定累计误差阈值Th。</li><li>按随机或指定顺序逐点比较模板与候选块。</li><li>误差一旦超过Th，立即放弃该位置。</li><li>记录坚持比较的点数H；真正匹配位置通常H较大。</li></ol>\n<p>分层搜索则先在低分辨率图像粗定位，再在高分辨率局部细搜，类似“先找浙江，再找杭州”。</p>\n<p>这些加速方法会引入阈值或粗尺度误差，阈值太低可能把正确位置提前淘汰，金字塔过粗可能丢失小目标。</p>\n</div></details><details class=\"qa\" id=\"c11-5\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">5. 直方图匹配：为什么图像不同也可能直方图相同？</span><span class=\"chapter-pill\">第38—47页</span></summary><div class=\"answer\">\n<p>直方图忽略像素位置，只统计每种灰度/颜色出现多少。因此两幅内容完全不同的图，只要颜色比例相似，直方图也可能相似。</p>\n<ul><li><strong>直方图相交：</strong>Σmin(H<sub>Q</sub>,H<sub>D</sub>)，越大越相似。</li><li><strong>欧氏/明可夫斯基距离：</strong>比较直方图向量，越小越相似。</li><li><strong>χ²距离：</strong>对各bin差异按频数归一，越小越相似。</li><li><strong>颜色矩：</strong>用均值、方差等低维统计减少计算。</li></ul>\n<p>改进方法是加入空间信息，如分块直方图、颜色一致性、空间金字塔等。</p>\n</div></details><details class=\"qa\" id=\"c11-6\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">6. 特征匹配为何能抗旋转和尺度？</span><span class=\"chapter-pill\">第48—49页及总结页</span></summary><div class=\"answer\">\n<ol class=\"steps\"><li>在两图中检测关键点。</li><li>为每个关键点生成描述子，如SIFT、SURF、ORB。</li><li>用欧氏距离或汉明距离寻找近邻。</li><li>使用比值检验过滤模糊匹配。</li><li>用RANSAC估计几何模型并删除误匹配。</li></ol>\n<p>特征匹配不要求每个像素对齐，只比较局部稳定结构，因此能处理部分遮挡、旋转和尺度变化。代价是特征可能不足，纹理重复时仍会误匹配。</p>\n<div class=\"tip memory\"><strong>选择方法</strong><div>固定姿态、固定尺度、受控光照 → 模板匹配；只关心颜色分布 → 直方图；视角/尺度变化明显 → 局部特征匹配。</div></div>\n</div></details><details class=\"qa\" id=\"c11-7\"><summary><span class=\"qtag\">精讲</span><span class=\"qtitle\">7. 鸡蛋模板检测完整答题流程</span><span class=\"chapter-pill\">课程作业21</span></summary><div class=\"answer\"><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜用模板在原图中检测鸡蛋</div>\n<ol class=\"steps\"><li>灰度化模板和搜索图，必要时做轻度去噪与亮度归一化。</li><li>若尺寸固定，直接滑动并计算NCC或归一化平方差；若大小变化，构建多尺度图像或多尺度模板。</li><li>得到响应图：NCC取局部最大值，平方差取局部最小值。</li><li>设置阈值选候选框，使用非极大值抑制合并重叠检测。</li><li>用椭圆度、面积或颜色进一步排除误检。</li></ol>\n<p><strong>结果分析：</strong>固定场景下模板匹配定位精确；鸡蛋旋转影响较小但尺度、遮挡、反光和光照变化会降低响应。可用归一化相关、多尺度搜索或特征/形状方法改进。</p>\n</div><div class=\"exam-box\"><div class=\"answer-label\">题目示例｜响应图判定</div><p>使用SSD时正确位置应为深色谷值/最小值；使用NCC时正确位置应为亮峰/最大值。答题时先说明指标方向，再说找极值。</p></div></div></details><section class=\"card memory-card\"><h3>本章最后必须会</h3><div class=\"checklist\"><label><input type=\"checkbox\"> 会算滑动位置数</label><label><input type=\"checkbox\"> 会手算SSD/SAD</label><label><input type=\"checkbox\"> 会解释SSD展开三项</label><label><input type=\"checkbox\"> 会区分误差最小与相关最大</label><label><input type=\"checkbox\"> 会写NCC优势</label><label><input type=\"checkbox\"> 会口述SSDA提前终止</label><label><input type=\"checkbox\"> 会比较模板/直方图/特征匹配</label></div>\n<h4>最容易记反</h4><ul><li>NCC越大越好，SSD越小越好。</li><li>模板匹配不是天然旋转尺度不变。</li><li>直方图匹配忽略空间位置。</li><li>展开SSD后不能随意忽略候选块能量。</li></ul>\n<h4>口头自测</h4><ol><li>模板为J×K时为什么位置数要加1？</li><li>MAD与SAD最佳位置是否不同？</li><li>什么时候应该放弃模板匹配改用SIFT？</li></ol></section>"},"formulas":{"0":"<section class=\"card hero-card\"><h3>公式不是单独背：先判断题目属于哪一类</h3><div class=\"mega-route\"><div>成像几何<span>投影、F数、FOV</span></div><b>→</b><div>像素处理<span>灰度、直方图、卷积</span></div><b>→</b><div>位置变换<span>仿射、单应</span></div><b>→</b><div>结构分析<span>边缘、形态学、特征</span></div><b>→</b><div>匹配重建<span>视差、SSD/NCC</span></div></div></section>\n<section class=\"formula-grid\">\n<div class=\"card\"><h3>相机与光学</h3><div class=\"formula-stack\"><div>x=fX/Z，y=fY/Z</div><div>1/f=1/u+1/v</div><div>N=f/D</div><div>FOV=2atan(W/(2f))</div><div>Z=fb/d</div></div><p class=\"small\">单位必须一致。立体视觉的f常以像素表示，b以米或毫米表示。</p></div>\n<div class=\"card\"><h3>采样与增强</h3><div class=\"formula-stack\"><div>L=2ᵏ</div><div>存储量=M×N×k bit</div><div>s=L-1-r</div><div>s=c log(1+r)</div><div>s=c rᵞ</div><div>sₖ=(L-1)CDF(rₖ)</div></div></div>\n<div class=\"card\"><h3>空间与频域滤波</h3><div class=\"formula-stack\"><div>g(x,y)=∑∑w(s,t)f(x-s,y-t)</div><div>|∇f|=√(Gx²+Gy²)</div><div>g=f-c∇²f（符号按核定义）</div><div>G(u,v)=H(u,v)F(u,v)</div></div><p class=\"small\">核若不对称，卷积需翻转；相关不翻转。</p></div>\n<div class=\"card\"><h3>几何矩阵</h3><pre class=\"matrix\">T=[1 0 tx;0 1 ty;0 0 1]\nR=[c -s 0;s c 0;0 0 1]\nS=[sx 0 0;0 sy 0;0 0 1]\np'~Hp</pre><p class=\"small\">列向量：先做S再R再T，总矩阵T·R·S。</p></div>\n<div class=\"card\"><h3>分割与形态学</h3><div class=\"formula-stack\"><div>ρ=xcosθ+ysinθ</div><div>σB²=ω0ω1(μ0-μ1)²</div><div>A○B=(A⊖B)⊕B</div><div>A●B=(A⊕B)⊖B</div><div>β(A)=A-(A⊖B)</div></div></div>\n<div class=\"card\"><h3>区域特征</h3><div class=\"formula-stack\"><div>mₚq=∑∑xᵖyᑫf(x,y)</div><div>x̄=m10/m00，ȳ=m01/m00</div><div>C=4πA/P²</div><div>Convexity=Phull/P</div><div>SIFT=4×4×8=128维</div></div></div>\n<div class=\"card\"><h3>模板匹配</h3><div class=\"formula-stack\"><div>SSD=∑∑(I-T)² ↓</div><div>SAD=∑∑|I-T| ↓</div><div>MAD=SAD/(JK) ↓</div><div>NCC=∑IT/√(∑I²∑T²) ↑</div></div><p class=\"small\">箭头表示最佳匹配方向。</p></div>\n</section>"},"examples":{"0":"<section class=\"card hero-card\"><h3>重点题目示例</h3><p class=\"lead\">先自己做，再展开答案。每道题都对应期末常见的计算或算法表达。</p></section><details class=\"qa\"><summary><span class=\"qtag\">第2章</span><span class=\"qtitle\">投影计算：已知f=16 mm，点(X,Y,Z)=(80,-40,800) mm，求像坐标。</span></summary><div class=\"answer\"><div class=\"answer-label\">解题要点</div><p>x=16×80/800=1.6 mm；y=16×(-40)/800=-0.8 mm。写清坐标系、单位和Z不能为0。</p></div></details><details class=\"qa\"><summary><span class=\"qtag\">第3章</span><span class=\"qtitle\">存储量计算：1920×1080、24位RGB图像未压缩大小。</span></summary><div class=\"answer\"><div class=\"answer-label\">解题要点</div><p>1920×1080×24/8=6,220,800 byte，约5.93 MiB。不要把bit和byte混淆。</p></div></details><details class=\"qa\"><summary><span class=\"qtag\">第4章</span><span class=\"qtitle\">直方图均衡：给出灰度频数表，求每级映射。</span></summary><div class=\"answer\"><div class=\"answer-label\">解题要点</div><p>按“频数→概率→CDF→乘L-1→取整→替换像素”写完整表格；最后解释动态范围被拉开。</p></div></details><details class=\"qa\"><summary><span class=\"qtag\">第4章</span><span class=\"qtitle\">空间卷积：给3×3图像邻域和3×3核，求中心输出。</span></summary><div class=\"answer\"><div class=\"answer-label\">解题要点</div><p>对应元素相乘求和；若题目说卷积，非对称核要先翻转；对称核可直接算。</p></div></details><details class=\"qa\"><summary><span class=\"qtag\">第5章</span><span class=\"qtitle\">复合仿射：先缩放、再旋转、最后平移，写总矩阵。</span></summary><div class=\"answer\"><div class=\"answer-label\">解题要点</div><p>列向量约定：M=T·R·S。先写每个3×3矩阵，再连乘，最后作用到齐次点。</p></div></details><details class=\"qa\"><summary><span class=\"qtag\">第7章</span><span class=\"qtitle\">Sobel边缘：给3×3邻域，求Gx、Gy、幅值和方向。</span></summary><div class=\"answer\"><div class=\"answer-label\">解题要点</div><p>分别与两个Sobel核点乘；幅值用√(Gx²+Gy²)；方向atan2(Gy,Gx)，边缘方向与梯度垂直。</p></div></details><details class=\"qa\"><summary><span class=\"qtag\">第7章</span><span class=\"qtitle\">Otsu算法：不要求逐灰度手算时，写出自动阈值流程。</span></summary><div class=\"answer\"><div class=\"answer-label\">解题要点</div><p>遍历阈值t；求两类概率ω0、ω1和均值μ0、μ1；算σB²=ω0ω1(μ0-μ1)²；取最大者。</p></div></details><details class=\"qa\"><summary><span class=\"qtag\">第8章</span><span class=\"qtitle\">形态学方案设计：文字断裂且有孤立白噪声，如何处理？</span></summary><div class=\"answer\"><div class=\"answer-label\">解题要点</div><p>先用小开运算去白噪声，再用沿断裂方向的膨胀或闭运算连接字符；必要时腐蚀恢复笔画宽度。</p></div></details><details class=\"qa\"><summary><span class=\"qtag\">第9章</span><span class=\"qtitle\">区域形状计算：已知A、P、凸包周长，计算圆形度和凸性。</span></summary><div class=\"answer\"><div class=\"answer-label\">解题要点</div><p>C=4πA/P²；Convexity=Phull/P。解释两者都越接近1越规则/凸。</p></div></details><details class=\"qa\"><summary><span class=\"qtag\">第10章</span><span class=\"qtitle\">双目深度：已知f、b、左右横坐标求Z。</span></summary><div class=\"answer\"><div class=\"answer-label\">解题要点</div><p>先d=xL-xR，确认像素与焦距单位一致，再Z=fb/d。视差为0表示深度趋于无穷。</p></div></details><details class=\"qa\"><summary><span class=\"qtag\">第11章</span><span class=\"qtitle\">模板匹配：比较两个候选块的SSD或NCC。</span></summary><div class=\"answer\"><div class=\"answer-label\">解题要点</div><p>SSD逐像素差平方求和选最小；NCC先归一化能量选最大；写出响应图尺寸(M-J+1)×(N-K+1)。</p></div></details>"},"traps":{"0":"<section class=\"card hero-card\"><h3>选择判断易错点</h3><p class=\"lead\">点击展开原因。判断题必须注意“通常、一定、在前景为白色时、单位一致”等条件。</p></section><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">1. F数越大，光圈直径越大。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>N=f/D，F数越大，D越小。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">2. 焦距越长，在传感器尺寸不变时视场角越小。</span><span class=\"verdict yes\">对</span></summary><div class=\"answer\"><p>长焦相当于缩小视野、放大目标。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">3. 三维到二维投影通常保持真实长度和角度。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>投影会丢失深度，长度与角度一般不守恒。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">4. 8位灰度图像有256个可能灰度级。</span><span class=\"verdict yes\">对</span></summary><div class=\"answer\"><p>2⁸=256，通常取0-255。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span
