><span class=\"qtitle\">5. 采样不足主要引起伪轮廓。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>采样不足主要引起混叠；量化不足容易出现伪轮廓。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">6. Gamma小于1通常会提亮归一化暗图。</span><span class=\"verdict yes\">对</span></summary><div class=\"answer\"><p>0<r<1时，r^γ在γ<1时变大。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">7. 中值滤波是线性滤波。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>排序取中位数，不满足线性叠加。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">8. 多个独立零均值噪声图像平均后，信号也会被平均掉。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>同一对齐信号保持，随机噪声方差下降。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">9. 对称卷积核做卷积和相关的结果相同。</span><span class=\"verdict yes\">对</span></summary><div class=\"answer\"><p>核翻转后不变。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">10. 理想低通滤波器过渡最平滑，因此没有振铃。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>频域陡截止会导致空间域振铃。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">11. 仿射变换保持平行性，但不一定保持角度和长度。</span><span class=\"verdict yes\">对</span></summary><div class=\"answer\"><p>这是仿射的重要性质。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">12. 求二维单应矩阵至少需要3对点。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>H有8个自由度，至少4对非共线点。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">13. 图像几何变换采用正向映射更不容易出现空洞。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>逆向映射逐输出像素取样，更不易产生空洞。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">14. RGB是减色模型。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>RGB是加色；CMY/CMYK是减色。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">15. HSI中的H可以直接按普通灰度做算术平均而没有问题。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>H是周期角度，0°与360°相邻。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">16. Sobel的Gx响应大通常表示竖直边缘明显。</span><span class=\"verdict yes\">对</span></summary><div class=\"answer\"><p>Gx测x方向灰度变化。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">17. 拉普拉斯是一阶导数算子。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>拉普拉斯是二阶导数。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">18. 二阶导数通常比一阶导数更容易受噪声影响。</span><span class=\"verdict yes\">对</span></summary><div class=\"answer\"><p>导数阶数越高，噪声放大越明显。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">19. Otsu通过最大化类内方差选阈值。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>最大化类间方差，等价于最小化类内方差。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">20. Hough直线变换用斜率截距式最适合检测竖直线。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>斜率会无穷，通常使用ρ-θ法线式。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">21. 前景为白色时，膨胀会使目标变大。</span><span class=\"verdict yes\">对</span></summary><div class=\"answer\"><p>结构元素与前景相交即可写入前景。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">22. 开运算的顺序是先膨胀后腐蚀。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>开：先腐蚀后膨胀；闭相反。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">23. 闭运算适合连接小间隙和填小孔。</span><span class=\"verdict yes\">对</span></summary><div class=\"answer\"><p>先膨胀连接/填孔，再腐蚀恢复大体尺寸。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">24. 零阶矩m00可表示二值区域面积。</span><span class=\"verdict yes\">对</span></summary><div class=\"answer\"><p>前景像素值为1时求和即面积。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">25. 圆形度4πA/P²可以大于1。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>理想连续情形不超过1，圆为1。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">26. LBP原始算子用邻域像素与中心像素比较得到二进制编码。</span><span class=\"verdict yes\">对</span></summary><div class=\"answer\"><p>3×3邻域产生8位编码。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">27. SIFT描述子通常为64维。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>经典SIFT为4×4×8=128维。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">28. HOG的block归一化可减弱局部光照与对比度变化。</span><span class=\"verdict yes\">对</span></summary><div class=\"answer\"><p>这是HOG鲁棒性的来源之一。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">29. 双目中物体越近，视差越小。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>Z=fb/d，越近d越大。</p></div></details><details class=\"qa trap\"><summary><span class=\"qtag\">判断</span><span class=\"qtitle\">30. NCC匹配时数值越小越好。</span><span class=\"verdict no\">错</span></summary><div class=\"answer\"><p>NCC越大越相似；SSD/SAD越小越好。</p></div></details>"},"homework":{"0":"<section class=\"card hero-card\"><h3>机器视觉课程作业：24题独立模块</h3><p class=\"lead\">这里不把作业混进章节课后题，而是按任务类型单独归类。每题给出对应章节、推荐算法和实验分析重点。</p></section><section class=\"card\"><h3>图像增强与复原</h3><p class=\"small\">本组共15题</p></section><details class=\"qa hw\"><summary><span class=\"qtag\">作业01</span><span class=\"qtitle\">幂指数变换图像增强</span><span class=\"chapter-pill\">第4章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>Gamma变换：归一化图像后计算s=r^γ；暗图通常选γ<1，再拉伸回0-255。</p><h4>结果分析必须写</h4><p>比较不同γ下暗部细节、亮区饱和与噪声放大。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业02</span><span class=\"qtitle\">自选方法增强花朵图像</span><span class=\"chapter-pill\">第4、6章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>先判断问题，再组合CLAHE/直方图、Gamma、彩色饱和度和轻度反锐化。</p><h4>结果分析必须写</h4><p>说明每一步针对的缺陷，避免“越艳越好”。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业03</span><span class=\"qtitle\">直方图均衡增强对比度</span><span class=\"chapter-pill\">第4章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>灰度图计算直方图→PDF→CDF→灰度映射；彩色图建议仅处理亮度通道。</p><h4>结果分析必须写</h4><p>对比均衡前后直方图、动态范围和局部过增强。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业04</span><span class=\"qtitle\">空域均值滤波与三种边界处理</span><span class=\"chapter-pill\">第4章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>19×19均值核；分别采用零填充、复制边界、镜像反射。</p><h4>结果分析必须写</h4><p>零填充会产生暗边；复制较平稳；反射通常连续性最好。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业05</span><span class=\"qtitle\">均值滤波与中值滤波去椒盐噪声</span><span class=\"chapter-pill\">第4章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>手写滑窗：均值取邻域平均，中值排序取中位数。</p><h4>结果分析必须写</h4><p>中值更能去脉冲噪声并保边缘；均值易模糊且受极值影响。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业06</span><span class=\"qtitle\">多幅高斯噪声图像去噪增强</span><span class=\"chapter-pill\">第4章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>对20幅对齐图逐像素平均，独立零均值噪声相互抵消；必要时再轻度平滑。</p><h4>结果分析必须写</h4><p>理论方差降为原来的1/20；检查图像是否严格配准。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业07</span><span class=\"qtitle\">人像美肌：去痘或去皱纹</span><span class=\"chapter-pill\">第4、6章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>肤色/人脸区域掩膜→双边或引导滤波；痘点可检测后修复，最后回加高频细节。</p><h4>结果分析必须写</h4><p>皮肤变平滑但眼睛、眉毛、头发不能糊；避免塑料感。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业08</span><span class=\"qtitle\">图像锐化与算子分析（一）</span><span class=\"chapter-pill\">第4章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>Laplacian、Sobel梯度或Unsharp Mask；先去噪再锐化。</p><h4>结果分析必须写</h4><p>比较边缘增强、噪声放大、光晕和参数敏感性。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业09</span><span class=\"qtitle\">阴影区域细节增强</span><span class=\"chapter-pill\">第4章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>Gamma<1、对数变换或CLAHE；可用同态滤波分离光照与反射。</p><h4>结果分析必须写</h4><p>暗部提升是否伴随噪声放大，亮区是否过曝。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业10</span><span class=\"qtitle\">胸部X光图像综合增强</span><span class=\"chapter-pill\">第4章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>去噪→CLAHE局部对比度→高提升锐化；医学图像避免改变诊断结构。</p><h4>结果分析必须写</h4><p>观察骨骼、肺纹理与软组织细节，说明伪影风险。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业11</span><span class=\"qtitle\">手部X光图像锐化</span><span class=\"chapter-pill\">第4章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>高斯去噪后用Laplacian或Unsharp Mask增强骨缘。</p><h4>结果分析必须写</h4><p>高频增强能显骨缝，也会放大颗粒噪声。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业12</span><span class=\"qtitle\">花朵X光图像锐化</span><span class=\"chapter-pill\">第4章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>使用Laplacian/高提升滤波，选择适当增益。</p><h4>结果分析必须写</h4><p>比较轮廓清晰度、细节和噪声。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业13</span><span class=\"qtitle\">周期性噪声去除</span><span class=\"chapter-pill\">第4章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>FFT并中心化→观察成对亮峰→构造陷波/带阻滤波器→逆变换。</p><h4>结果分析必须写</h4><p>陷波过宽会损失图像纹理，过窄会残留条纹。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业14</span><span class=\"qtitle\">HSI空间H、S分量均值滤波分析</span><span class=\"chapter-pill\">第6章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>分别平滑H和S，再转RGB；依据讲义解释H边界混色、纯色S内部影响小。</p><h4>结果分析必须写</h4><p>强调H的周期性，普通平均可能产生不合理色相。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业15</span><span class=\"qtitle\">淡化雀斑并保留毛发细节</span><span class=\"chapter-pill\">第4、6章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>肤色掩膜＋边缘保持滤波；用细节层分解，只平滑低频皮肤层，再融合高频毛发。</p><h4>结果分析必须写</h4><p>定量/定性对比雀斑减弱与发丝保留。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><section class=\"card\"><h3>分割与形态学</h3><p class=\"small\">本组共4题</p></section><details class=\"qa hw\"><summary><span class=\"qtag\">作业16</span><span class=\"qtitle\">小丑鱼完整分割与背景替换</span><span class=\"chapter-pill\">第6、7、8章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>HSV/HSI多颜色阈值联合橙白黑掩膜→形态学闭运算→最大连通域→替换背景。</p><h4>结果分析必须写</h4><p>检查鱼鳍、黑边和内部白色是否被完整保留。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业17</span><span class=\"qtitle\">形态学开运算与闭运算</span><span class=\"chapter-pill\">第8章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>同一结构元素分别做开和闭；展示中间腐蚀/膨胀结果。</p><h4>结果分析必须写</h4><p>开去小白点、断细颈；闭填小黑孔、连小缝。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业18</span><span class=\"qtitle\">形态学检测字母“I”</span><span class=\"chapter-pill\">第8章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>设计前景和背景结构元素，使用击中-击不中；或腐蚀模板后定位。</p><h4>结果分析必须写</h4><p>结构元素必须匹配字体大小和方向，过严会漏检。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业19</span><span class=\"qtitle\">黑色打印内容分割</span><span class=\"chapter-pill\">第7、8章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>灰度化或颜色阈值提取黑色→自适应/Otsu→形态学去噪与连通域筛选。</p><h4>结果分析必须写</h4><p>光照不均时全局阈值可能失败。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><section class=\"card\"><h3>插值、匹配与特征</h3><p class=\"small\">本组共5题</p></section><details class=\"qa hw\"><summary><span class=\"qtag\">作业20</span><span class=\"qtitle\">最近邻与双线性插值放大比较</span><span class=\"chapter-pill\">第3、5章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>反向映射到80×60原图；最近邻取最近整数点，双线性用四邻点加权。</p><h4>结果分析必须写</h4><p>最近邻锯齿明显；双线性平滑但边缘略软。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业21</span><span class=\"qtitle\">鸡蛋模板目标检测</span><span class=\"chapter-pill\">第11章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>灰度/边缘模板→NCC或归一化SSD滑动匹配→非极大值抑制；尺度变化时做多尺度。</p><h4>结果分析必须写</h4><p>阈值影响漏检与误检，重叠响应需抑制。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业22</span><span class=\"qtitle\">HOG猫目标检测与可视化</span><span class=\"chapter-pill\">第9章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>归一化→梯度→cell方向直方图→block归一化→模板距离或分类器→画HOG线段。</p><h4>结果分析必须写</h4><p>讨论姿态、遮挡和方向变化对HOG的影响。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业23</span><span class=\"qtitle\">SIFT高斯金字塔分通道与分层分析</span><span class=\"chapter-pill\">第9章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>同一组octave内逐级高斯模糊形成尺度层；降采样进入下一octave；DoG寻找跨尺度稳定极值。</p><h4>结果分析必须写</h4><p>模糊抑制混叠，分层提供尺度不变性，跨octave覆盖更大结构。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details><details class=\"qa hw\"><summary><span class=\"qtag\">作业24</span><span class=\"qtitle\">珍珠检测</span><span class=\"chapter-pill\">第7、8、9章</span></summary><div class=\"answer\"><h4>推荐处理路线</h4><p>阈值/颜色分割→去噪→距离变换＋分水岭分离粘连；圆形明显时可用Hough圆，最后圆形度筛选。</p><h4>结果分析必须写</h4><p>重点处理相互接触、反光与大小变化。</p><div class=\"tip warn\"><strong>报告结构</strong><div>算法原理 → 参数与关键步骤 → 原图/结果图 → 对比分析 → 局限与改进。</div></div></div></details>"},"sprint":{"0":"<section class=\"card hero-card\"><h3>考前30分钟冲刺</h3><p class=\"lead\">按顺序过一遍，发现不会的直接点左侧章节。</p></section>\n<section class=\"card\"><h3>10个绝对不能记反的方向</h3><div class=\"flash-grid\"><div>γ&lt;1<br><b>提亮</b></div><div>低通<br><b>平滑</b></div><div>高通<br><b>锐化</b></div><div>SSD/SAD<br><b>越小越好</b></div><div>NCC<br><b>越大越好</b></div><div>开运算<br><b>腐蚀→膨胀</b></div><div>闭运算<br><b>膨胀→腐蚀</b></div><div>近物体<br><b>视差大</b></div><div>F数大<br><b>孔小景深大</b></div><div>Gx大<br><b>竖直边缘</b></div></div></section>\n<section class=\"card\"><h3>必须默写的矩阵和核</h3><pre class=\"matrix\">旋转：[cosθ -sinθ 0; sinθ cosθ 0; 0 0 1]\n平移：[1 0 tx; 0 1 ty; 0 0 1]\nSobel Gx：[-1 0 1; -2 0 2; -1 0 1]\nSobel Gy：[-1 -2 -1; 0 0 0; 1 2 1]\n常用Laplacian：[0 -1 0; -1 4 -1; 0 -1 0]</pre></section>\n<section class=\"card\"><h3>必须能口述的7条算法</h3><ol class=\"steps\"><li>直方图均衡：统计→PDF→CDF→映射。</li><li>边缘检测通用流程：适度平滑→梯度/二阶响应→阈值→边缘连接；Canny作为补充了解。</li><li>Hough直线：边缘点映射ρ-θ参数空间→投票→峰值反投影。</li><li>Otsu：遍历阈值→计算两类统计→最大类间方差。</li><li>形态学去噪：按噪声类型选择开/闭和结构元素。</li><li>SIFT：尺度空间→极值→精确定位→主方向→128维描述。</li><li>双目重建：标定→校正→匹配→视差→Z=fb/d。</li></ol></section>\n<section class=\"card memory-card\"><h3>最后检查</h3><div class=\"checklist\"><label><input type=\"checkbox\"> 会写所有核心公式的符号含义</label><label><input type=\"checkbox\"> 会手算Sobel、卷积和简单均衡化</label><label><input type=\"checkbox\"> 会写仿射复合矩阵顺序</label><label><input type=\"checkbox\"> 会设计开闭运算和结构元素</label><label><input type=\"checkbox\"> 会写边缘检测/分割应用题完整流程</label><label><input type=\"checkbox\"> 会算Z=fb/d与SSD</label></div></section>"}};
const CATEGORIES=[{"id": "overview", "name": "考试导航", "desc": "题型、重点与答题模板", "icon": "导"}, {"id": "chapters", "name": "章节精讲", "desc": "第1-11章按PDF整理", "icon": "章"}, {"id": "formulas", "name": "核心公式矩阵", "desc": "计算题快速查公式", "icon": "∑"}, {"id": "examples", "name": "重点题目示例", "desc": "应用题完整步骤", "icon": "题"}, {"id": "traps", "name": "选择判断易错点", "desc": "高频陷阱与辨析", "icon": "错"}, {"id": "homework", "name": "课程作业24题", "desc": "单独模块与推荐方法", "icon": "作"}, {"id": "sprint", "name": "考前冲刺", "desc": "30分钟速记清单", "icon": "冲"}];
const CHAPTERS=[{"id": "1", "title": "机器视觉简介", "priority": "基础概念｜选择、判断、简答"}, {"id": "2", "title": "针孔相机模型与成像", "priority": "高频公式｜简答、计算、应用"}, {"id": "3", "title": "图像数字化与表示", "priority": "基础计算｜选择、判断、简答"}, {"id": "4", "title": "图像增强：灰度、直方图与滤波", "priority": "全课程最重点｜计算、简答、应用"}, {"id": "5", "title": "几何变换与单应性", "priority": "高频矩阵｜计算、应用"}, {"id": "6", "title": "彩色图像基础与处理", "priority": "概念＋作业题｜选择、简答、应用"}, {"id": "7", "title": "点、线、边缘与图像分割", "priority": "期末应用题核心｜计算、算法步骤"}, {"id": "8", "title": "数学形态学", "priority": "高频算法｜判断、简答、应用"}, {"id": "9", "title": "区域、颜色与局部特征", "priority": "特征题重点｜简答、计算、应用"}, {"id": "10", "title": "双目立体视觉与三维重建", "priority": "必会公式｜简答、计算、应用"}, {"id": "11", "title": "基于灰度值的模板匹配", "priority": "算法题重点｜计算、简答、应用"}];
let state={category:'overview',chapter:'0'};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},remove(k){try{localStorage.removeItem(k)}catch(e){}}};
const app=document.getElementById('app'), sidebar=document.getElementById('sidebar');
function strip(s){const d=document.createElement('div');d.innerHTML=s;return d.textContent||''}
function renderNav(){
 const c=document.getElementById('categoryNav');c.innerHTML=CATEGORIES.map(x=>`<button class="cat-btn ${state.category===x.id?'active':''}" data-cat="${x.id}"><span class="cat-icon">${x.icon}</span><span class="nav-text"><b>${x.name}</b><small>${x.desc}</small></span></button>`).join('');
 c.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;state.chapter=state.category==='chapters'?'1':'0';render();sidebar.classList.remove('open')});
 const n=document.getElementById('chapterNav');n.innerHTML=CHAPTERS.map(x=>`<button class="chapter-btn ${state.category==='chapters'&&state.chapter===x.id?'active':''}" data-ch="${x.id}"><span class="num">${x.id}</span><span class="nav-text"><b>${x.title}</b><small>${x.priority}</small></span></button>`).join('');
 n.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.category='chapters';state.chapter=b.dataset.ch;render();sidebar.classList.remove('open')});
}
function home(){return `<div class="breadcrumb">机器视觉 · 期末复习</div><section class="page-head"><h1>机器视觉期末复习导航</h1><p>第1-11章PDF逐节精讲＋课程作业24题 · 零基础解释 · 公式推导 · 重点题目示例</p></section><div class="category-home">${CATEGORIES.map(x=>`<div class="cat-card" data-cat="${x.id}"><div class="big-icon">${x.icon}</div><h3>${x.name}</h3><p>${x.desc}</p></div>`).join('')}</div><section class="card" style="margin-top:16px"><h3>章节快速进入</h3><div class="chapter-home">${CHAPTERS.map(x=>`<div class="chapter-card" data-ch="${x.id}"><b>第${x.id}章 ${x.title}</b><small>${x.priority}</small></div>`).join('')}</div></section>`}
function render(){renderNav();const cat=CATEGORIES.find(x=>x.id===state.category);let body,title,desc;
 if(state.category==='home'){app.innerHTML=home();bindCards();return}
 if(state.category==='chapters'){
   const ch=CHAPTERS.find(x=>x.id===state.chapter);title=`第${ch.id}章 ${ch.title}`;desc=ch.priority;body=DATA.chapters[ch.id];
 }else{title=cat.name;desc=cat.desc;body=DATA[state.category]['0']}
 app.innerHTML=`<div class="breadcrumb"><span role="button" id="crumbHome">首页</span><b>›</b><span>${title}</span></div><section class="page-head"><h1>${title}</h1><p>${desc}</p></section><div class="toolbar"><button id="expandAll">全部展开</button><button id="collapseAll">全部收起</button><button onclick="window.print()">打印当前页</button>${state.category==='chapters'?'<button id="markDone">标记本章已复习</button>':''}</div><div class="content">${body}</div>`;
 document.getElementById('crumbHome').onclick=()=>{state.category='home';render()};
 document.getElementById('expandAll').onclick=()=>document.querySelectorAll('.content details').forEach(x=>x.open=true);
 document.getElementById('collapseAll').onclick=()=>document.querySelectorAll('.content details').forEach(x=>x.open=false);
 const m=document.getElementById('markDone');if(m){const key='mv_done_'+state.chapter;m.textContent=store.get(key)?'✓ 已复习（点击取消）':'标记本章已复习';m.onclick=()=>{store.get(key)?store.remove(key):store.set(key,'1');render()}}
 window.scrollTo({top:0,behavior:'smooth'});
}
function bindCards(){document.querySelectorAll('[data-cat]').forEach(x=>x.onclick=()=>{state.category=x.dataset.cat;state.chapter=state.category==='chapters'?'1':'0';render()});document.querySelectorAll('[data-ch]').forEach(x=>x.onclick=()=>{state.category='chapters';state.chapter=x.dataset.ch;render()})}
function search(q){q=q.trim().toLowerCase();if(!q){state.category='home';render();return}let res=[];for(const cat of CATEGORIES){const group=DATA[cat.id]||{};for(const [k,v] of Object.entries(group)){const text=strip(v);if(text.toLowerCase().includes(q)){let idx=text.toLowerCase().indexOf(q);let sn=text.slice(Math.max(0,idx-55),idx+120);res.push({cat:cat.id,key:k,title:cat.id==='chapters'?`第${k}章 ${CHAPTERS.find(c=>c.id===k).title}`:cat.name,sn})}}}
 app.innerHTML=`<div class="breadcrumb">搜索</div><section class="page-head"><h1>搜索：${q.replace(/[<>&]/g,'')}</h1><p>共找到 ${res.length} 个模块</p></section><div class="search-results">${res.length?res.map((r,i)=>`<div class="result" data-i="${i}"><b>${r.title}</b><p>${r.sn}</p><small>${CATEGORIES.find(c=>c.id===r.cat).name}</small></div>`).join(''):'<div class="empty">没有找到。可搜索：Sobel、Gamma、Otsu、SIFT、视差、模板匹配、作业21……</div>'}</div>`;
 document.querySelectorAll('.result').forEach(el=>el.onclick=()=>{const r=res[+el.dataset.i];state.category=r.cat;state.chapter=r.key;render()})}
document.getElementById('searchInput').addEventListener('input',e=>search(e.target.value));
document.getElementById('themeBtn').onclick=()=>{const d=document.documentElement;const dark=d.dataset.theme==='dark';d.dataset.theme=dark?'light':'dark';store.set('mv_theme',d.dataset.theme)};
document.getElementById('menuBtn').onclick=()=>sidebar.classList.toggle('open');
document.getElementById('brandHome').onclick=()=>{state.category='home';document.getElementById('searchInput').value='';render()};
document.documentElement.dataset.theme=store.get('mv_theme')||'light';
state.category='home';render();
</script></body></html>
